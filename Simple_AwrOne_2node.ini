CHART3=rac_char,[1.2:E.2/1.7:E.8],ACTIVE,rac_char,Avg global cache current block receive time (ms) - @@hostname@@,42,10,LINE,TRUE,dd hh:mm,Date & Time
[rac_char]
select /*+ awrsql */  snap_id,
       min(snap_time) "Timestamp",
       decode(max(case when inst=:inst_no1 and stat_name='global enqueue gets async' then delta_val else 0 end)
             +max(case when inst=:inst_no1 and stat_name='global enqueue gets sync'  then delta_val else 0 end), 0, 0,
             (max(case when inst=:inst_no1 and stat_name='global enqueue get time'   then delta_val else 0 end)
            /(max(case when inst=:inst_no1 and stat_name='global enqueue gets async' then delta_val else 0 end)
             +max(case when inst=:inst_no1 and stat_name='global enqueue gets sync'  then delta_val else 0 end))) * 10
             ) "#1.global.enq get time(ms)" ,
       decode(max(case when inst=:inst_no2 and stat_name='global enqueue gets async' then delta_val else 0 end)
             +max(case when inst=:inst_no2 and stat_name='global enqueue gets sync'  then delta_val else 0 end), 0, 0,
             (max(case when inst=:inst_no2 and stat_name='global enqueue get time'   then delta_val else 0 end)
            /(max(case when inst=:inst_no2 and stat_name='global enqueue gets async' then delta_val else 0 end)
             +max(case when inst=:inst_no2 and stat_name='global enqueue gets sync'  then delta_val else 0 end))) * 10
             ) "#2.global.enq get time(ms)" ,
       decode(max(case when inst=:inst_no1 and stat_name='gc cr blocks received'     then delta_val else 0 end), 0, 0,
             (max(case when inst=:inst_no1 and stat_name='gc cr block receive time'  then delta_val else 0 end)
             /max(case when inst=:inst_no1 and stat_name='gc cr blocks received'     then delta_val else 0 end)) * 10
             ) "#1.cr blk rcv time(ms)" ,
       decode(max(case when inst=:inst_no2 and stat_name='gc cr blocks received'     then delta_val else 0 end), 0, 0,
             (max(case when inst=:inst_no2 and stat_name='gc cr block receive time'  then delta_val else 0 end)
             /max(case when inst=:inst_no2 and stat_name='gc cr blocks received'     then delta_val else 0 end)) * 10
             ) "#2.cr blk rcv time(ms)" ,
       decode(max(case when inst=:inst_no1 and stat_name='gc current blocks received'    then delta_val else 0 end), 0, 0,
             (max(case when inst=:inst_no1 and stat_name='gc current block receive time' then delta_val else 0 end)
             /max(case when inst=:inst_no1 and stat_name='gc current blocks received'    then delta_val else 0 end)) * 10
             ) "#1.cur blk rcv time(ms)",
       decode(max(case when inst=:inst_no2 and stat_name='gc current blocks received'    then delta_val else 0 end), 0, 0,
             (max(case when inst=:inst_no2 and stat_name='gc current block receive time' then delta_val else 0 end)
             /max(case when inst=:inst_no2 and stat_name='gc current blocks received'    then delta_val else 0 end)) * 10
             ) "#2.cur blk rcv time(ms)"
 from (select sy.snap_id,
              sy.instance_number inst,
              to_char(sn.end_interval_time,'yyyy-mm-dd hh24:mi:ss') snap_time,
              sy.stat_name,
              greatest(sy.value - lag(sy.value) over (partition by sy.dbid, sy.instance_number, sy.con_id, sn.startup_time, sy.stat_name order by sy.snap_id), 0) delta_val
         from dba_hist_sysstat sy,
              dba_hist_snapshot sn
        where sy.snap_id = sn.snap_id
          and sy.instance_number = sn.instance_number
          and sy.dbid = sn.dbid
          and sy.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
          and sy.stat_name in (
               'global enqueue gets sync',
               'global enqueue gets async',
               'global enqueue get time',
               'gc cr blocks received',
               'gc cr block receive time',
               'gc current blocks received',
               'gc current block receive time'
              )
          and sn.snap_id between :snap_fr and :snap_to
          and sn.instance_number in (:inst_no1,:inst_no2)
          and sn.dbid = :dbid)
 where snap_id > :snap_fr
group by snap_id
order by snap_id
