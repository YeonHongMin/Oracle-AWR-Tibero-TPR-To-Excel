[osstat]
select  /* tprsql */ s.snap_id "SnapID",
    to_char(s.end_interval_time, 'yyyy-mm-dd hh24:mi:ss') "Timestamp",
    round(nvl(o.busy,0) / 100, 1) "Busy(s)",
    round(nvl(o.usr,0) / 100, 1) "User(s)",
    round(nvl(o.sys,0) / 100, 1) "Sys(s)",
    round(nvl(o.wio,0) / 100, 1) "IOWait(s)",
    round(nvl(o.nice,0) / 100, 1) "Nice(s)",
    round(nvl(o.idle,0) / 100, 1) "Idle(s)",
    nvl(o.cpus, 0) "CPUs",
    nvl(o.cores, 0) "Cores",
    nvl(o.socks, 0) "Sockets",
    round(nvl(o.memb,0) / 1073741824, 1) "PhysMem(GB)",
    decode(nvl(o.busy,0) + nvl(o.idle,0), 0, 0, nvl(o.busy,0) / (nvl(o.busy,0) + nvl(o.idle,0))) "%busy",
    decode(nvl(o.busy,0) + nvl(o.idle,0), 0, 0, nvl(o.usr,0) / (nvl(o.busy,0) + nvl(o.idle,0))) "%usr",
    decode(nvl(o.busy,0) + nvl(o.idle,0), 0, 0, nvl(o.sys,0) / (nvl(o.busy,0) + nvl(o.idle,0))) "%sys",
    decode(nvl(o.busy,0) + nvl(o.idle,0), 0, 0, nvl(o.wio,0) / (nvl(o.busy,0) + nvl(o.idle,0))) "%wio",
    decode(nvl(o.busy,0) + nvl(o.idle,0), 0, 0, nvl(o.idle,0) / (nvl(o.busy,0) + nvl(o.idle,0))) "%idle"
from    (select sn.snap_id, sn.end_interval_time,
            greatest((sn.end_interval_time - sn.begin_interval_time) * 86400, 1) ela
       from sys._tpr_snapshot sn
      where sn."THREAD#" = :inst_no
        and sn.snap_id between :snap_fr and :snap_to) s
left join (select o.snap_id,
            sum(case when v.stat_name = 'BUSY_TIME' then o.value end) busy,
            sum(case when v.stat_name = 'USER_TIME' then o.value end) usr,
            sum(case when v.stat_name = 'SYS_TIME' then o.value end) sys,
            sum(case when v.stat_name = 'IOWAIT_TIME' then o.value end) wio,
            sum(case when v.stat_name = 'NICE_TIME' then o.value end) nice,
            sum(case when v.stat_name = 'IDLE_TIME' then o.value end) idle,
            max(case when v.stat_name = 'NUM_CPUS' then o.value end) cpus,
            max(case when v.stat_name = 'NUM_CPU_CORES' then o.value end) cores,
            max(case when v.stat_name = 'NUM_CPU_SOCKETS' then o.value end) socks,
            max(case when v.stat_name = 'PHYSICAL_MEMORY_BYTES' then o.value end) memb
           from sys._tpr_osstat2 o
           join v$osstat2 v on v.id = o.id
          where o."THREAD#" = :inst_no
            and o.snap_id between :snap_fr and :snap_to
          group by o.snap_id) o on o.snap_id = s.snap_id
order by s.snap_id
