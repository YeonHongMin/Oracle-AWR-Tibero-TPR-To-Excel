    round(nvl(d.sqlproc_us,0) / 1000000, 3) "SQL Proc(s)",
    round(nvl(d.parse_us,0) / 1000000, 3) "Parse(s)",
    round(nvl(d.hparse_us,0) / 1000000, 3) "Hard Parse(s)",
    round(nvl(d.opt_us,0) / 1000000, 3) "Optimizer(s)",
