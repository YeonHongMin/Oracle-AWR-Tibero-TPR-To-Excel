[dbinfo]
SQL1=dbinfo_sql,dbinfo,[1.1],TRUE
[dbinfo]
select  /* tprsql */
    i.host_name "Host Name",
    (select name from v$database) "DB Name",
    i.instance_name "Instance",
    i.version "Version",
    (select decode(count(distinct "THREAD#"), 1, 'NO', 'YES')
       from sys._tpr_snapshot
      where snap_gid between :gid_fr and :gid_to) "Cluster ?",
    (select to_char(min(begin_interval_time), 'yyyy-mm-dd hh24:mi:ss')
       from sys._tpr_snapshot
      where "THREAD#" = :inst_no and snap_id between :snap_fr and :snap_to) "Snap Begin",
    (select to_char(max(end_interval_time), 'yyyy-mm-dd hh24:mi:ss')
       from sys._tpr_snapshot
      where "THREAD#" = :inst_no and snap_id between :snap_fr and :snap_to) "Snap End",
    :dbid "DB ID",
    i.instance_number "Instance#"
from    v$instance i
[snapinfo]
SQL1=snapinfo_sql,snapinfo,[1.1],TRUE
FORMAT1=snapinfo^[1.3:E.3]^###,##0
[snapinfo]
select  /* tprsql */ snap_id "SnapID",
    to_char(end_interval_time, 'yyyy-mm-dd hh24:mi:ss') "Snap Time",
    round((end_interval_time - begin_interval_time) * 86400) "interval(s)",
    (select to_char(startup_time, 'yyyy-mm-dd hh24:mi:ss') from v$instance) "DB Startup",
    :dbid "DB ID",
    "THREAD#" "Instance#"
from    sys._tpr_snapshot
where snap_id between :snap_fr and :snap_to
  and "THREAD#" = :inst_no
order by snap_id
[param_sga]
SQL1=param_sga_sql,param_sga,[1.1],TRUE
FORMAT1=param_sga^[1.2:E.2]^###,##0
[param_sga]
select  /* tprsql */  name "SGA Parameter",
    nvl(value, 'n/a') "Value"
from    v$parameters
where   upper(name) like '%POOL%'
   or   upper(name) like '%CACHE%SIZE%'
   or   upper(name) like '%BUFFER%'
   or   upper(name) in ('TOTAL_SHM_SIZE','MEMORY_TARGET','SGA_TARGET','PGA_TARGET',
                        'SHARED_POOL_SIZE','DB_BLOCK_SIZE','LOG_BUFFER_SIZE','WORK_AREA_SIZE')
order by name
[param]
SQL1=param_sql,param,[1.1],TRUE
FORMAT1=param^[1.2:E.2]^###,##0
[param]
select  /* tprsql */ name "Parameter Name",
    nvl(value, 'n/a') "Value"
from    v$parameters
order by name
[param_diff]
SQL1=param_diff_sql,param_diff,[1.1],TRUE
[param_diff]
select  /* tprsql */ snap_id "SnapID",
    name "Parameter",
    type "Type",
    dflt_value "Default",
    value "Value",
    status "Status",
    "THREAD#" "Instance#"
from    sys._tpr_modified_param
where snap_id between :snap_fr and :snap_to
  and "THREAD#" = :inst_no
order by snap_id, name
