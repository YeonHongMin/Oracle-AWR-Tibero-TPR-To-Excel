select  /* tprsql */ s.snap_id "SnapID",
       to_char(s.end_interval_time,'yyyy-mm-dd hh24:mi:ss') "Timestamp",
       nvl(dt.dbt,0)/1000000 "DB time",
       decode(nvl(cu.calls,0), 0, 0, (nvl(dt.dbt,0)/1000)/cu.calls) "db time per call",
       decode(nvl(cu.execs,0), 0, 0, (nvl(dt.dbt,0)/1000)/cu.execs) "db time per execute",
       max(decode(rnk, 1, w.tw, 0)) wait_1,
       max(decode(rnk, 2, w.tw, 0)) wait_2,
       max(decode(rnk, 3, w.tw, 0)) wait_3,
       max(decode(rnk, 4, w.tw, 0)) wait_4,
       max(decode(rnk, 5, w.tw, 0)) wait_5,
       max(decode(rnk, 1, w.tm/1000, 0)) time_1,
       max(decode(rnk, 2, w.tm/1000, 0)) time_2,
       max(decode(rnk, 3, w.tm/1000, 0)) time_3,
       max(decode(rnk, 4, w.tm/1000, 0)) time_4,
       max(decode(rnk, 5, w.tm/1000, 0)) time_5,
       max(decode(rnk, 1, decode(w.tw, 0, 0, w.tm/w.tw), 0)) avg_wait_1,
       max(decode(rnk, 2, decode(w.tw, 0, 0, w.tm/w.tw), 0)) avg_wait_2,
       max(decode(rnk, 3, decode(w.tw, 0, 0, w.tm/w.tw), 0)) avg_wait_3,
       max(decode(rnk, 4, decode(w.tw, 0, 0, w.tm/w.tw), 0)) avg_wait_4,
       max(decode(rnk, 5, decode(w.tw, 0, 0, w.tm/w.tw), 0)) avg_wait_5,
       max(decode(rnk, 1, decode(nvl(dt.dbt,0), 0, 0, w.tm/(dt.dbt/1000)), 0)) pctwait_1,
       max(decode(rnk, 2, decode(nvl(dt.dbt,0), 0, 0, w.tm/(dt.dbt/1000)), 0)) pctwait_2,
       max(decode(rnk, 3, decode(nvl(dt.dbt,0), 0, 0, w.tm/(dt.dbt/1000)), 0)) pctwait_3,
       max(decode(rnk, 4, decode(nvl(dt.dbt,0), 0, 0, w.tm/(dt.dbt/1000)), 0)) pctwait_4,
       max(decode(rnk, 5, decode(nvl(dt.dbt,0), 0, 0, w.tm/(dt.dbt/1000)), 0)) pctwait_5
  from (select sn.snap_id, sn.end_interval_time,
            greatest((sn.end_interval_time - sn.begin_interval_time) * 86400, 1) ela
       from sys._tpr_snapshot sn
      where sn."THREAD#" = :inst_no
        and sn.snap_id between :snap_fr and :snap_to) s
  left join (select ev.snap_id, rk.rnk,
                    ev.tw, ev.tm
               from (select e.snap_id, n."DESC" event_name,
                            sum(e.total_waits) tw, sum(e.time_waited) tm
                       from sys._tpr_system_event e
                       join v$event_name n on n."EVENT#" = e.idx
                      where e."THREAD#" = :inst_no
                        and e.snap_id between :snap_fr and :snap_to
                        and n.class <> 'STAT_CLASS_IDLE'
                      group by e.snap_id, n."DESC"
                      union all
                      select j.snap_id, 'DB CPU time', null, sum(j.time)/1000
                        from sys._tpr_jcntstat j
                        join sys._vt_jcntstat_name jn on jn.jcnt# = j.jcnt# and jn.time_name = 'DB CPU time'
                       where j."THREAD#" = :inst_no
                         and j.snap_id between :snap_fr and :snap_to
                       group by j.snap_id) ev
               join (select event_name, rownum rnk
                       from (select event_name, sum(nvl(tm,0)) st
                               from (select n."DESC" event_name, sum(e.time_waited) tm
                                       from sys._tpr_system_event e
                                       join v$event_name n on n."EVENT#" = e.idx
                                      where e."THREAD#" = :inst_no
                                        and e.snap_id between :snap_fr and :snap_to
                                        and n.class <> 'STAT_CLASS_IDLE'
                                      group by n."DESC"
                                      union all
                                      select 'DB CPU time', sum(j.time)/1000
                                        from sys._tpr_jcntstat j
                                        join sys._vt_jcntstat_name jn on jn.jcnt# = j.jcnt# and jn.time_name = 'DB CPU time'
                                       where j."THREAD#" = :inst_no
                                         and j.snap_id between :snap_fr and :snap_to
                                       group by j.snap_id)
                              group by event_name
                              order by st desc, event_name)
                      where rownum <= 5) rk on rk.event_name = ev.event_name) w on w.snap_id = s.snap_id
  left join (select j.snap_id, sum(j.time) dbt
               from sys._tpr_jcntstat j
               join sys._vt_jcntstat_name jn on jn.jcnt# = j.jcnt# and jn.time_name = 'req service time'
              where j."THREAD#" = :inst_no
                and j.snap_id between :snap_fr and :snap_to
              group by j.snap_id) dt on dt.snap_id = s.snap_id
  left join (select j.snap_id,
                    sum(case when jn.value_name = 'req total count' then j.num end) calls,
                    sum(case when jn.value_name = 'execute count' then j.num end) execs
               from sys._tpr_jcntstat j
               join sys._vt_jcntstat_name jn on jn.jcnt# = j.jcnt#
              where j."THREAD#" = :inst_no
                and j.snap_id between :snap_fr and :snap_to
              group by j.snap_id) cu on cu.snap_id = s.snap_id
 group by s.snap_id, s.end_interval_time, dt.dbt, cu.calls, cu.execs
 order by s.snap_id
