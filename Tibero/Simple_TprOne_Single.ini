[load]
select  /* tprsql */ s.snap_id "SnapID",
    to_char(s.end_interval_time, 'yyyy-mm-dd hh24:mi:ss') "Timestamp",
    round(s.ela, 0) "Elapsed(s)",
    round(nvl(d.dbt_us,0) / 1000000 / s.ela, 2) "DB Time(s)",
    round(nvl(d.dbcpu_us,0) / 1000000 / s.ela, 2) "DB CPU(s)",
    round(nvl(d.redo_bytes,0) / 1024 / s.ela, 2) "Redo Size(KB)",
    round(nvl(d.lreads,0) / s.ela, 2) "Logical Reads",
    round(nvl(d.bchg,0) / s.ela, 2) "Block Changes",
    round(nvl(d.preads,0) / s.ela, 2) "Physical Reads",
    round(nvl(d.pwrts,0) / s.ela, 2) "Physical Writes",
    round(nvl(d.preads,0) * (select to_number(value) from v$parameters where name = 'DB_BLOCK_SIZE') / 1048576 / s.ela, 2) "Phys Rd(MB/s)",
    round(nvl(d.pwrts,0) * (select to_number(value) from v$parameters where name = 'DB_BLOCK_SIZE') / 1048576 / s.ela, 2) "Phys Wr(MB/s)",
    round(nvl(d.ucalls,0) / s.ela, 2) "User Calls",
    round(nvl(d.parses,0) / s.ela, 2) "Parses",
    round(nvl(d.hparse,0) / s.ela, 2) "Hard Parses",
    round(nvl(d.sortm,0) / s.ela, 2) "Sorts(Mem)",
    round(nvl(d.sortd,0) / s.ela, 2) "Sorts(Disk)",
    round(nvl(d.logons,0) / s.ela, 2) "Logons",
    round(nvl(d.execs,0) / s.ela, 2) "Executes",
    round(nvl(d.rollb,0) / s.ela, 2) "Rollbacks",
    round((nvl(d.commits,0) + nvl(d.rollb,0)) / s.ela, 2) "Transactions",
    decode(nvl(d.lreads,0), 0, 0, 1 - nvl(d.preads,0) / d.lreads) "Buffer Hit %",
    decode(nvl(d.redo_ent,0), 0, 0, 1 - nvl(d.redo_spc,0) / d.redo_ent) "Redo NoWait %",
    decode(nvl(lc.pins,0), 0, 0, nvl(lc.pinhits,0) / lc.pins) "Lib Hit %",
    decode(nvl(d.sortm,0) + nvl(d.sortd,0), 0, 0, nvl(d.sortm,0) / (d.sortm + d.sortd)) "In-mem Sort %",
    decode(nvl(d.parses,0), 0, 0, 1 - nvl(d.hparse,0) / d.parses) "Soft Parse %",
    decode(nvl(d.execs,0) + nvl(d.parses,0), 0, 0, nvl(d.execs,0) / (d.execs + d.parses)) "Exec to Parse %",
    decode(nvl(la.gets,0), 0, 0, 1 - nvl(la.misses,0) / la.gets) "Latch Hit %",
    decode(nvl(d.dbt_us,0), 0, 0, nvl(d.parse_us,0) / d.dbt_us) "%ParseElap/DBT",
    decode(nvl(d.sqlproc_us,0), 0, 0, 1 - nvl(d.parse_us,0) / d.sqlproc_us) "%NonParse SQL",
    round(nvl(d.parse_us,0) / 1000000 / s.ela, 2) "Parse Elap(s)",
    round(nvl(d.sqlproc_us,0) / 1000000 / s.ela, 2) "SQL Proc(s)"
from    (select sn.snap_id, sn.end_interval_time,
            greatest((sn.end_interval_time - sn.begin_interval_time) * 86400, 1) ela
       from sys._tpr_snapshot sn
      where sn."THREAD#" = :inst_no
        and sn.snap_id between :snap_fr and :snap_to) s
left join (select j.snap_id,
                sum(case when jn.time_name = 'req service time' then j.time end) dbt_us,
                sum(case when jn.time_name = 'DB CPU time' then j.time end) dbcpu_us,
                sum(case when jn.time_name = 'SQL processing time' then j.time end) sqlproc_us,
                sum(case when jn.time_name = 'parse time elapsed' then j.time end) parse_us,
                sum(case when jn.size_name = 'redo log size' then j."SIZE" end) redo_bytes,
                sum(case when jn.value_name = 'redo entries' then j.num end) redo_ent,
                sum(case when jn.value_name = 'redo log space requests' then j.num end) redo_spc,
                sum(case when jn.size_name = 'logical reads' then j."SIZE" end) lreads,
                sum(case when jn.size_name = 'physical reads' then j."SIZE" end) preads,
                sum(case when jn.size_name = 'dbwr written block count' then j."SIZE" end) pwrts,
                sum(case when jn.value_name = 'block changes - current + consistent' then j.num end) bchg,
                sum(case when jn.value_name = 'req total count' then j.num end) ucalls,
                sum(case when jn.value_name = 'parse count (total)' then j.num end) parses,
                sum(case when jn.value_name = 'parse count (hard)' then j.num end) hparse,
                sum(case when jn.value_name = 'logons cumulative' then j.num end) logons,
                sum(case when jn.value_name = 'execute count' then j.num end) execs,
                sum(case when jn.value_name = 'user rollbacks' then j.num end) rollb,
                sum(case when jn.value_name = 'the number of user commits performed' then j.num end) commits,
                sum(case when jn.value_name = 'sorts (memory)' then j.num end) sortm,
                sum(case when jn.value_name = 'sorts (disk)' then j.num end) sortd
           from sys._tpr_jcntstat j
           join sys._vt_jcntstat_name jn on jn.jcnt# = j.jcnt#
          where j."THREAD#" = :inst_no
            and j.snap_id between :snap_fr and :snap_to
          group by j.snap_id) d on d.snap_id = s.snap_id
left join (select c.snap_id, sum(c.pins) pins, sum(c.pinhits) pinhits
             from sys._tpr_librarycache c
            where c."THREAD#" = :inst_no
              and c.snap_id between :snap_fr and :snap_to
            group by c.snap_id) lc on lc.snap_id = s.snap_id
left join (select t.snap_id, sum(t.gets) gets, sum(t.misses) misses
             from sys._tpr_latch t
            where t."THREAD#" = :inst_no
              and t.snap_id between :snap_fr and :snap_to
            group by t.snap_id) la on la.snap_id = s.snap_id
order by s.snap_id
