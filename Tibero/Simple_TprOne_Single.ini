[tac_load]
select  /* tprsql */ s.snap_id "SnapID",
    to_char(s.end_interval_time, 'yyyy-mm-dd hh24:mi:ss') "Timestamp",
    round(d.gc_recv / s.ela, 2) "#1.GC blocks received",
    round(d.gc_srv / s.ela, 2) "#1.GC blocks served",
    round(d.inc_recv / s.ela, 2) "#1.INC msg received",
    round(d.inc_sent / s.ela, 2) "#1.INC msg sent",
    round((nvl(d.inc_pr,0) + nvl(d.inc_ps,0)) / 1048576 / s.ela, 3) "#1.IC traffic(MB/s)",
    round(d.preads * (select to_number(value) from v$parameters where name = 'DB_BLOCK_SIZE') / 1048576 / s.ela, 2) "#1.Phys rd(MB/s)",
    round(d.pwrts * (select to_number(value) from v$parameters where name = 'DB_BLOCK_SIZE') / 1048576 / s.ela, 2) "#1.Phys wr(MB/s)",
    round(d.bast / s.ela, 2) "#1.BAST received",
    round(d.blkfail / s.ela, 2) "#1.blk lock fail"
from    (select sn.snap_id, sn.end_interval_time,
            greatest((sn.end_interval_time - sn.begin_interval_time) * 86400, 1) ela
       from sys._tpr_snapshot sn
      where sn."THREAD#" = :inst_no
        and sn.snap_id between :snap_fr and :snap_to) s
left join (select j.snap_id,
            sum(case when substr(jn.name,1,14) = 'JC_CCC_CR_RCVD' or substr(jn.name,1,15) = 'JC_CCC_CUR_RCVD' then j.num end) gc_recv,
            sum(case when jn.value_name in ('CR block send','current block send') then j.num end) gc_srv,
            sum(case when jn.value_name = 'INC messages received' then j.num end) inc_recv,
            sum(case when jn.value_name = 'INC messages sent' then j.num end) inc_sent,
            sum(case when jn.size_name = 'INC packets received size' then j."SIZE" end) inc_pr,
            sum(case when jn.size_name = 'INC packets sent size' then j."SIZE" end) inc_ps,
            sum(case when jn.size_name = 'physical reads' then j."SIZE" end) preads,
            sum(case when jn.size_name = 'dbwr written block count' then j."SIZE" end) pwrts,
            sum(case when jn.value_name in ('[CCC,PC] bast received','[CWS,PC] bast received') then j.num end) bast,
            sum(case when substr(jn.name,1,18) = 'JC_CCC_NOT_GRANTED' then j.num end) blkfail
           from sys._tpr_jcntstat j
           join sys._vt_jcntstat_name jn on jn.jcnt# = j.jcnt#
          where j."THREAD#" = :inst_no
            and j.snap_id between :snap_fr and :snap_to
          group by j.snap_id) d on d.snap_id = s.snap_id
order by s.snap_id
