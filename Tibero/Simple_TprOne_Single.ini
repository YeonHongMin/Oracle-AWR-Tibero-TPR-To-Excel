e(w.tw,0,0,w.tm/w.tw) end), 2) "avgms:rdundo",    round(max(case when w.event_name = 'block disk read: lob (time)' then decode(w.tw,0,0,w.tm/w.tw) end), 2) "avgms:rdlob"
from    (select sn.snap_id, sn.end_interval_time,
