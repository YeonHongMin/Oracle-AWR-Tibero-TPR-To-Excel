SQL1=sysmetric_sql,sysmetric,[1.1],TRUE
FORMAT1=sysmetric^[1.7:E.7]^###,##0.00
[sysmetric]
select  /* tprsql */ s.snap_id "SnapID",
    to_char(s.end_interval_time, 'yyyy-mm-dd hh24:mi:ss') "Timestamp",
    m.metric_id "Metric ID",
    m.group_id "Group ID",
    m.entity_id "Entity ID",
    m.entity_seq "Entity Seq",
    m.value "Value",
    s."THREAD#" "Instance#"
from    sys._tpr_snapshot s
left join sys._tpr_metric m
       on m.snap_id = s.snap_id
      and m."THREAD#" = s."THREAD#"
where   s."THREAD#" = :inst_no
  and   s.snap_id between :snap_fr and :snap_to
order by s.snap_id, m.metric_id
