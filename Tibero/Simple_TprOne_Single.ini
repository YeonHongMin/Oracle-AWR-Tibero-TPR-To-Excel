[redo_wait]
select  /* tprsql */ s.snap_id "SnapID",
    to_char(s.end_interval_time, 'yyyy-mm-dd hh24:mi:ss') "Timestamp",
    round(max(case when w.event_name = 'log flush wait for commit' then w.tm / 1000 end), 3) "s:logflush_commit",    round(max(case when w.event_name = 'cluster tsn sync wait for commit' then w.tm / 1000 end), 3) "s:tsnsync_commit",    round(max(case when w.event_name = 'log flush wait for space' then w.tm / 1000 end), 3) "s:logflush_space",    round(max(case when w.event_name = 'wait for explicit log flush request' then w.tm / 1000 end), 3) "s:expflush_req",    round(max(case when w.event_name = 'wait for explicit log switch request' then w.tm / 1000 end), 3) "s:expsw_req",    round(max(case when w.event_name = 'log flush wait for switch' then w.tm / 1000 end), 3) "s:logflush_sw",    round(max(case when w.event_name = 'lgwr archive finish wait' then w.tm / 1000 end), 3) "s:lgwr_arch",    round(max(case when w.event_name = 'lgwr log network write wait' then w.tm / 1000 end), 3) "s:lgwr_lnw",    round(max(case when w.event_name = 'lgwr waits for pending io during log switch' then w.tm / 1000 end), 3) "s:lgwr_pendio",    round(max(case when w.event_name = 'lgwr write and update tsn time' then w.tm / 1000 end), 3) "s:lgwr_wrt_tsn",    round(max(case when w.event_name = 'lgwr build and submit time' then w.tm / 1000 end), 3) "s:lgwr_bldsub",    round(max(case when w.event_name = 'submit lgwr aio request time' then w.tm / 1000 end), 3) "s:lgwr_aio",    round(max(case when w.event_name = 'log flush wait for commit' then decode(w.tw,0,0,w.tm/w.tw) end), 2) "ms:logflush_commit",    round(max(case when w.event_name = 'cluster tsn sync wait for commit' then decode(w.tw,0,0,w.tm/w.tw) end), 2) "ms:tsnsync_commit",    round(max(case when w.event_name = 'log flush wait for space' then decode(w.tw,0,0,w.tm/w.tw) end), 2) "ms:logflush_space",    round(max(case when w.event_name = 'wait for explicit log flush request' then decode(w.tw,0,0,w.tm/w.tw) end), 2) "ms:expflush_req",    round(max(case when w.event_name = 'wait for explicit log switch request' then decode(w.tw,0,0,w.tm/w.tw) end), 2) "ms:expsw_req",    round(max(case when w.event_name = 'log flush wait for switch' then decode(w.tw,0,0,w.tm/w.tw) end), 2) "ms:logflush_sw",    round(max(case when w.event_name = 'lgwr archive finish wait' then decode(w.tw,0,0,w.tm/w.tw) end), 2) "ms:lgwr_arch",    round(max(case when w.event_name = 'lgwr log network write wait' then decode(w.tw,0,0,w.tm/w.tw) end), 2) "ms:lgwr_lnw",    round(max(case when w.event_name = 'lgwr waits for pending io during log switch' then decode(w.tw,0,0,w.tm/w.tw) end), 2) "ms:lgwr_pendio",    round(max(case when w.event_name = 'lgwr write and update tsn time' then decode(w.tw,0,0,w.tm/w.tw) end), 2) "ms:lgwr_wrt_tsn",    round(max(case when w.event_name = 'lgwr build and submit time' then decode(w.tw,0,0,w.tm/w.tw) end), 2) "ms:lgwr_bldsub",    round(max(case when w.event_name = 'submit lgwr aio request time' then decode(w.tw,0,0,w.tm/w.tw) end), 2) "ms:lgwr_aio",    round(nvl(d.redo_bytes,0) / 1048576 / s.ela, 2) "Redo(MB/s)",    round(nvl(d.redowrt_us,0) / 1000000 / s.ela, 3) "RedoWrt(s/s)",    round(nvl(d.redo_spc,0) / s.ela, 2) "LogSpcReq",    round(nvl(d.redosw_us,0) / 1000000 / s.ela, 3) "RedoWaitSw(s/s)"
from    (select sn.snap_id, sn.end_interval_time,
            greatest((sn.end_interval_time - sn.begin_interval_time) * 86400, 1) ela
       from sys._tpr_snapshot sn
      where sn."THREAD#" = :inst_no
        and sn.snap_id between :snap_fr and :snap_to) s
left join (select e.snap_id, n."DESC" event_name,
                  sum(e.total_waits) tw, sum(e.time_waited) tm
             from sys._tpr_system_event e
             join v$event_name n on n."EVENT#" = e.idx
            where e."THREAD#" = :inst_no
              and e.snap_id between :snap_fr and :snap_to
              and n."DESC" in ('log flush wait for commit','cluster tsn sync wait for commit','log flush wait for space','wait for explicit log flush request','wait for explicit log switch request','log flush wait for switch','lgwr archive finish wait','lgwr log network write wait','lgwr waits for pending io during log switch','lgwr write and update tsn time','lgwr build and submit time','submit lgwr aio request time')
            group by e.snap_id, n."DESC") w on w.snap_id = s.snap_id
left join (select j.snap_id,
                sum(case when jn.size_name = 'redo log size' then j."SIZE" end) redo_bytes,
                sum(case when jn.time_name = 'redo write time' then j.time end) redowrt_us,
                sum(case when jn.value_name = 'redo log space requests' then j.num end) redo_spc,
                sum(case when jn.time_name = 'redo wait time for logfile switch' then j.time end) redosw_us
           from sys._tpr_jcntstat j
           join sys._vt_jcntstat_name jn on jn.jcnt# = j.jcnt#
          where j."THREAD#" = :inst_no
            and j.snap_id between :snap_fr and :snap_to
          group by j.snap_id) d on d.snap_id = s.snap_id
group by s.snap_id, s.end_interval_time, s.ela, d.redo_bytes, d.redowrt_us, d.redo_spc, d.redosw_us
order by s.snap_id
