[pga_hit]
select  /* tprsql */ s.snap_gid "SnapID",
    to_char(s.end_interval_time, 'yyyy-mm-dd hh24:mi:ss') "Timestamp",
    decode(nvl(sum(case when p."THREAD#" = :inst_no1 and p.name = 'Total workarea memory used' then p.value end),0)
               +nvl(sum(case when p."THREAD#" = :inst_no1 and p.name = 'Total workarea temporary segment used' then p.value end),0), 0, 0,
        sum(case when p."THREAD#" = :inst_no1 and p.name = 'Total workarea memory used' then p.value end)
       /(sum(case when p."THREAD#" = :inst_no1 and p.name = 'Total workarea memory used' then p.value end)
        +sum(case when p."THREAD#" = :inst_no1 and p.name = 'Total workarea temporary segment used' then p.value end))) "#0.in-mem %",    decode(nvl(sum(case when p."THREAD#" = :inst_no2 and p.name = 'Total workarea memory used' then p.value end),0)
               +nvl(sum(case when p."THREAD#" = :inst_no2 and p.name = 'Total workarea temporary segment used' then p.value end),0), 0, 0,
        sum(case when p."THREAD#" = :inst_no2 and p.name = 'Total workarea memory used' then p.value end)
       /(sum(case when p."THREAD#" = :inst_no2 and p.name = 'Total workarea memory used' then p.value end)
        +sum(case when p."THREAD#" = :inst_no2 and p.name = 'Total workarea temporary segment used' then p.value end))) "#1.in-mem %",    decode(nvl(sum(case when p."THREAD#" = :inst_no1 and p.name = 'ALLOCATED pga memory' then p.value end),0), 0, 0,
        sum(case when p."THREAD#" = :inst_no1 and p.name = 'Total ex memory allocated' then p.value end)
       /sum(case when p."THREAD#" = :inst_no1 and p.name = 'ALLOCATED pga memory' then p.value end)) "#0.Ex/PGA %",    decode(nvl(sum(case when p."THREAD#" = :inst_no2 and p.name = 'ALLOCATED pga memory' then p.value end),0), 0, 0,
        sum(case when p."THREAD#" = :inst_no2 and p.name = 'Total ex memory allocated' then p.value end)
       /sum(case when p."THREAD#" = :inst_no2 and p.name = 'ALLOCATED pga memory' then p.value end)) "#1.Ex/PGA %"
from    (select sn.snap_gid, min(sn.end_interval_time) end_interval_time,
            max(greatest((sn.end_interval_time - sn.begin_interval_time) * 86400, 1)) ela
       from sys._tpr_snapshot sn
      where sn.snap_gid between :gid_fr and :gid_to
      group by sn.snap_gid) s
left join (select sn.snap_gid, p."THREAD#", p.name, p.value
             from sys._tpr_pgastat p
             join sys._tpr_snapshot sn on sn.snap_id = p.snap_id and sn."THREAD#" = p."THREAD#"
            where sn.snap_gid between :gid_fr and :gid_to
              and p."THREAD#" in (:inst_no1, :inst_no2)) p on p.snap_gid = s.snap_gid
