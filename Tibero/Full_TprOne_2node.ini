CHART2=archsize,[1.1:E.1/1.6:E.9],ACTIVE,archsize,Size of Archived Log (MB) by Thread - @@hostname@@,22,11,LINE,TRUE,dd hh:mm,Date & Time
FORMAT1=archsize^[1.2:E.5]^##0
FORMAT2=archsize^[1.6:E.9]^###,##0.0
[archsize]
select  /* tprsql */ to_char(h.first_time, 'yyyy-mm-dd') "per Day",
    count(decode(h."THREAD#", 0, 1)) "#0.Archived",
    count(decode(h."THREAD#", 1, 1)) "#1.Archived",
    count(decode(h."THREAD#", 2, 1)) "#2.Archived",
    count(decode(h."THREAD#", 3, 1)) "#3.Archived",
    round(nvl(sum(decode(h."THREAD#", 0, h.filesize)), 0) / 1048576, 1) "#0.Size(Mb)",
    round(nvl(sum(decode(h."THREAD#", 1, h.filesize)), 0) / 1048576, 1) "#1.Size(Mb)",
    round(nvl(sum(decode(h."THREAD#", 2, h.filesize)), 0) / 1048576, 1) "#2.Size(Mb)",
    round(nvl(sum(decode(h."THREAD#", 3, h.filesize)), 0) / 1048576, 1) "#3.Size(Mb)"
from    v$log_history h
where   h.first_time between to_date(:snapdate_from, 'YYYYMMDDHH24MI')
                         and to_date(:snapdate_to,   'YYYYMMDDHH24MI')
group by to_char(h.first_time, 'yyyy-mm-dd')
order by 1
[archsize2]
select  /* tprsql */ a.lable||': '||nvl(i.instance_name, 'inst#'||x.t) title
  from (select 1 no,'arch' lable from dual union all select 2,'size' from dual) a,
       (select level - 1 t from dual connect by level <= 4) x
       left join gv$instance i on i.instance_number = x.t
 order by a.no, x.t
[arch]
SQL1=arch_sql,arch,[1.1],TRUE
FORMAT1=arch^[1.6:E.6]^###,##0.0
[arch]
select  /* tprsql */ a."THREAD#" "Thread#",
    a."SEQUENCE#" "Seq#",
    a.name "Archive Log",
    to_char(a.first_time, 'yyyy-mm-dd hh24:mi:ss') "First Time",
    to_char(a.next_time, 'yyyy-mm-dd hh24:mi:ss') "Next Time",
    round(a.filesize / 1048576, 1) "Size(Mb)",
    a.blocks "Blocks"
from    v$archived_log a
where   a.first_time between to_date(:snapdate_from, 'YYYYMMDDHH24MI')
                         and to_date(:snapdate_to,   'YYYYMMDDHH24MI')
order by a.first_time
