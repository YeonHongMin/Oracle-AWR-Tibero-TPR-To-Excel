FORMAT1=wait5^[1.3:E.8]^###,##0.0
[wait5]
select  /* tprsql */ s.snap_gid "SnapID",
    to_char(s.end_interval_time, 'yyyy-mm-dd hh24:mi:ss') "Timestamp",
    round(nvl(sum(case when d.t = :inst_no1 then d.dbt end),0),3) "#0.DBT(s)",    round(nvl(sum(case when d.t = :inst_no2 then d.dbt end),0),3) "#1.DBT(s)",    round(nvl(sum(case when d.t = :inst_no1 then d.dbc end),0),3) "#0.DBCPU(s)",    round(nvl(sum(case when d.t = :inst_no2 then d.dbc end),0),3) "#1.DBCPU(s)",    round(nvl(sum(case when d.t = :inst_no1 then d.wt end),0),3) "#0.Waits(s)",    round(nvl(sum(case when d.t = :inst_no2 then d.wt end),0),3) "#1.Waits(s)"
from    (select sn.snap_gid, min(sn.end_interval_time) end_interval_time,
            max(greatest((sn.end_interval_time - sn.begin_interval_time) * 86400, 1)) ela
       from sys._tpr_snapshot sn
      where sn.snap_gid between :gid_fr and :gid_to
      group by sn.snap_gid) s
left join (select sn.snap_gid, j."THREAD#" t,
        sum(case when jn.time_name = 'req service time' then j.time/1000000 end) dbt,
        sum(case when jn.time_name = 'DB CPU time' then j.time/1000000 end) dbc,
        cast(null as number) wt
   from sys._tpr_jcntstat j
   join sys._tpr_snapshot sn on sn.snap_id = j.snap_id and sn."THREAD#" = j."THREAD#"
   join sys._vt_jcntstat_name jn on jn.jcnt# = j.jcnt#
  where sn.snap_gid between :gid_fr and :gid_to
    and j."THREAD#" in (:inst_no1, :inst_no2)
  group by sn.snap_gid, j."THREAD#"
  union all
  select sn.snap_gid, e."THREAD#" t,
        cast(null as number) dbt,
        cast(null as number) dbc,
        sum(e.time_waited)/1000 wt
   from sys._tpr_system_event e
   join sys._tpr_snapshot sn on sn.snap_id = e.snap_id and sn."THREAD#" = e."THREAD#"
   join v$event_name n on n."EVENT#" = e.idx
  where sn.snap_gid between :gid_fr and :gid_to
    and e."THREAD#" in (:inst_no1, :inst_no2)
    and n.class <> 'STAT_CLASS_IDLE'
  group by sn.snap_gid, e."THREAD#") d on d.snap_gid = s.snap_gid
group by s.snap_gid, s.end_interval_time
order by s.snap_gid
