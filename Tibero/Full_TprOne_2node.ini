[tac_load]
select  /* tprsql */ s.snap_gid "SnapID",
    to_char(s.end_interval_time, 'yyyy-mm-dd hh24:mi:ss') "Timestamp",
    nvl(sum(case when d.t = :inst_no1 and d.lbl = 'GC recv' then d.v end),0) "#0.GC recv",
    nvl(sum(case when d.t = :inst_no2 and d.lbl = 'GC recv' then d.v end),0) "#1.GC recv",
    nvl(sum(case when d.t = :inst_no1 and d.lbl = 'GC srv' then d.v end),0) "#0.GC srv",
    nvl(sum(case when d.t = :inst_no2 and d.lbl = 'GC srv' then d.v end),0) "#1.GC srv",
    nvl(sum(case when d.t = :inst_no1 and d.lbl = 'INC recv' then d.v end),0) "#0.INC recv",
    nvl(sum(case when d.t = :inst_no2 and d.lbl = 'INC recv' then d.v end),0) "#1.INC recv",
    nvl(sum(case when d.t = :inst_no1 and d.lbl = 'INC sent' then d.v end),0) "#0.INC sent",
    nvl(sum(case when d.t = :inst_no2 and d.lbl = 'INC sent' then d.v end),0) "#1.INC sent",
    nvl(sum(case when d.t = :inst_no1 and d.lbl = 'INC KB' then d.v end),0) "#0.INC KB",
    nvl(sum(case when d.t = :inst_no2 and d.lbl = 'INC KB' then d.v end),0) "#1.INC KB",
    nvl(sum(case when d.t = :inst_no1 and d.lbl = 'INC sntKB' then d.v end),0) "#0.INC sntKB",
    nvl(sum(case when d.t = :inst_no2 and d.lbl = 'INC sntKB' then d.v end),0) "#1.INC sntKB",
    nvl(sum(case when d.t = :inst_no1 and d.lbl = 'Prd' then d.v end),0) "#0.Prd",
    nvl(sum(case when d.t = :inst_no2 and d.lbl = 'Prd' then d.v end),0) "#1.Prd",
    nvl(sum(case when d.t = :inst_no1 and d.lbl = 'Pwr' then d.v end),0) "#0.Pwr",
    nvl(sum(case when d.t = :inst_no2 and d.lbl = 'Pwr' then d.v end),0) "#1.Pwr"
from    (select sn.snap_gid, min(sn.end_interval_time) end_interval_time,
            max(greatest((sn.end_interval_time - sn.begin_interval_time) * 86400, 1)) ela
       from sys._tpr_snapshot sn
      where sn.snap_gid between :gid_fr and :gid_to
      group by sn.snap_gid) s
left join (select 'GC recv' lbl, sn.snap_gid, j."THREAD#" t, sum(j.num) v from sys._tpr_jcntstat j join sys._tpr_snapshot sn on sn.snap_id = j.snap_id and sn."THREAD#" = j."THREAD#" join sys._vt_jcntstat_name jn on jn.jcnt# = j.jcnt# where sn.snap_gid between :gid_fr and :gid_to and j."THREAD#" in (:inst_no1, :inst_no2) and (substr(jn.name,1,14) = 'JC_CCC_CR_RCVD' or substr(jn.name,1,15) = 'JC_CCC_CUR_RCVD') group by sn.snap_gid, j."THREAD#" union all select 'GC srv' lbl, sn.snap_gid, j."THREAD#" t, sum(j.num) v from sys._tpr_jcntstat j join sys._tpr_snapshot sn on sn.snap_id = j.snap_id and sn."THREAD#" = j."THREAD#" join sys._vt_jcntstat_name jn on jn.jcnt# = j.jcnt# where sn.snap_gid between :gid_fr and :gid_to and j."THREAD#" in (:inst_no1, :inst_no2) and (jn.value_name in ('CR block send','current block send')) group by sn.snap_gid, j."THREAD#" union all select 'INC recv' lbl, sn.snap_gid, j."THREAD#" t, sum(j.num) v from sys._tpr_jcntstat j join sys._tpr_snapshot sn on sn.snap_id = j.snap_id and sn."THREAD#" = j."THREAD#" join sys._vt_jcntstat_name jn on jn.jcnt# = j.jcnt# where sn.snap_gid between :gid_fr and :gid_to and j."THREAD#" in (:inst_no1, :inst_no2) and (jn.value_name = 'INC messages received') group by sn.snap_gid, j."THREAD#" union all select 'INC sent' lbl, sn.snap_gid, j."THREAD#" t, sum(j.num) v from sys._tpr_jcntstat j join sys._tpr_snapshot sn on sn.snap_id = j.snap_id and sn."THREAD#" = j."THREAD#" join sys._vt_jcntstat_name jn on jn.jcnt# = j.jcnt# where sn.snap_gid between :gid_fr and :gid_to and j."THREAD#" in (:inst_no1, :inst_no2) and (jn.value_name = 'INC messages sent') group by sn.snap_gid, j."THREAD#" union all select 'INC KB' lbl, sn.snap_gid, j."THREAD#" t, sum(j."SIZE"/1024) v from sys._tpr_jcntstat j join sys._tpr_snapshot sn on sn.snap_id = j.snap_id and sn."THREAD#" = j."THREAD#" join sys._vt_jcntstat_name jn on jn.jcnt# = j.jcnt# where sn.snap_gid between :gid_fr and :gid_to and j."THREAD#" in (:inst_no1, :inst_no2) and (jn.size_name = 'INC messages received size') group by sn.snap_gid, j."THREAD#" union all select 'INC sntKB' lbl, sn.snap_gid, j."THREAD#" t, sum(j."SIZE"/1024) v from sys._tpr_jcntstat j join sys._tpr_snapshot sn on sn.snap_id = j.snap_id and sn."THREAD#" = j."THREAD#" join sys._vt_jcntstat_name jn on jn.jcnt# = j.jcnt# where sn.snap_gid between :gid_fr and :gid_to and j."THREAD#" in (:inst_no1, :inst_no2) and (jn.size_name = 'INC messages sent size') group by sn.snap_gid, j."THREAD#" union all select 'Prd' lbl, sn.snap_gid, j."THREAD#" t, sum(j."SIZE") v from sys._tpr_jcntstat j join sys._tpr_snapshot sn on sn.snap_id = j.snap_id and sn."THREAD#" = j."THREAD#" join sys._vt_jcntstat_name jn on jn.jcnt# = j.jcnt# where sn.snap_gid between :gid_fr and :gid_to and j."THREAD#" in (:inst_no1, :inst_no2) and (jn.size_name = 'physical reads') group by sn.snap_gid, j."THREAD#" union all select 'Pwr' lbl, sn.snap_gid, j."THREAD#" t, sum(j."SIZE") v from sys._tpr_jcntstat j join sys._tpr_snapshot sn on sn.snap_id = j.snap_id and sn."THREAD#" = j."THREAD#" join sys._vt_jcntstat_name jn on jn.jcnt# = j.jcnt# where sn.snap_gid between :gid_fr and :gid_to and j."THREAD#" in (:inst_no1, :inst_no2) and (jn.size_name = 'dbwr written block count') group by sn.snap_gid, j."THREAD#") d on d.snap_gid = s.snap_gid
group by s.snap_gid, s.end_interval_time
order by s.snap_gid
