CHART3=tac_gc_efficiency,[1.2:E.2/1.7:E.8],ACTIVE,tac_gc_efficiency,GC eff disk % by node - @@hostname@@,42,10,LINE,TRUE,dd hh:mm,Date & Time
FORMAT1=tac_gc_efficiency^[1.3:E.8]^##0.0%
[tac_gc_efficiency]
select  /* tprsql */ s.snap_gid "SnapID",
    to_char(s.end_interval_time, 'yyyy-mm-dd hh24:mi:ss') "Timestamp",
    decode(nvl(sum(case when d.t = :inst_no1 then d.lreads end),0),0,0,
        1 - (nvl(sum(case when d.t = :inst_no1 then d.gc_recv end),0)
            +nvl(sum(case when d.t = :inst_no1 then d.preads end),0))
           /sum(case when d.t = :inst_no1 then d.lreads end)) "#0.local %",    decode(nvl(sum(case when d.t = :inst_no2 then d.lreads end),0),0,0,
        1 - (nvl(sum(case when d.t = :inst_no2 then d.gc_recv end),0)
            +nvl(sum(case when d.t = :inst_no2 then d.preads end),0))
           /sum(case when d.t = :inst_no2 then d.lreads end)) "#1.local %",    decode(nvl(sum(case when d.t = :inst_no1 then d.lreads end),0),0,0,
        nvl(sum(case when d.t = :inst_no1 then d.gc_recv end),0)
           /sum(case when d.t = :inst_no1 then d.lreads end)) "#0.remote %",    decode(nvl(sum(case when d.t = :inst_no2 then d.lreads end),0),0,0,
        nvl(sum(case when d.t = :inst_no2 then d.gc_recv end),0)
           /sum(case when d.t = :inst_no2 then d.lreads end)) "#1.remote %",    decode(nvl(sum(case when d.t = :inst_no1 then d.lreads end),0),0,0,
        nvl(sum(case when d.t = :inst_no1 then d.preads end),0)
           /sum(case when d.t = :inst_no1 then d.lreads end)) "#0.disk %",    decode(nvl(sum(case when d.t = :inst_no2 then d.lreads end),0),0,0,
        nvl(sum(case when d.t = :inst_no2 then d.preads end),0)
           /sum(case when d.t = :inst_no2 then d.lreads end)) "#1.disk %"
from    (select sn.snap_gid, min(sn.end_interval_time) end_interval_time,
            max(greatest((sn.end_interval_time - sn.begin_interval_time) * 86400, 1)) ela
       from sys._tpr_snapshot sn
      where sn.snap_gid between :gid_fr and :gid_to
      group by sn.snap_gid) s
left join (select sn.snap_gid, j."THREAD#" t,
        sum(case when substr(jn.name,1,14) = 'JC_CCC_CR_RCVD' or substr(jn.name,1,15) = 'JC_CCC_CUR_RCVD' then j.num end) gc_recv,
        sum(case when jn.size_name = 'logical reads' then j."SIZE" end) lreads,
        sum(case when jn.size_name = 'physical reads' then j."SIZE" end) preads
   from sys._tpr_jcntstat j
   join sys._tpr_snapshot sn on sn.snap_id = j.snap_id and sn."THREAD#" = j."THREAD#"
   join sys._vt_jcntstat_name jn on jn.jcnt# = j.jcnt#
  where sn.snap_gid between :gid_fr and :gid_to
    and j."THREAD#" in (:inst_no1, :inst_no2)
  group by sn.snap_gid, j."THREAD#") d on d.snap_gid = s.snap_gid
group by s.snap_gid, s.end_interval_time
order by s.snap_gid
