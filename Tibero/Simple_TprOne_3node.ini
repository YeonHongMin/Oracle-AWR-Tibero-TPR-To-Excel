[dbinfo]
SQL1=dbinfo_sql,dbinfo,[1.1],TRUE
[dbinfo]
select  /* tprsql */ d.name "DB Name", d.dbid "DB ID",
    'TAC' "Cluster",
    (select count(*) from gv$instance) "Instances",
    i.host_name "Host", i.instance_name "Instance",
    i.version "Version", i.status "Status"
from    v$database d, v$instance i
[snapinfo]
SQL1=snapinfo_sql,snapinfo,[1.1],TRUE
[snapinfo]
select  /* tprsql */ sn."THREAD#" "Thread#",
    min(sn.snap_gid) "First SnapGID",
    max(sn.snap_gid) "Last SnapGID",
    min(sn.snap_id) "First SnapID",
    max(sn.snap_id) "Last SnapID",
    to_char(min(sn.begin_interval_time), 'yyyy-mm-dd hh24:mi:ss') "Begin",
    to_char(max(sn.end_interval_time), 'yyyy-mm-dd hh24:mi:ss') "End"
from    sys._tpr_snapshot sn
where   sn.snap_gid between :gid_fr and :gid_to
  and   sn."THREAD#" in (:inst_no1, :inst_no2, :inst_no3)
group by sn."THREAD#"
order by sn."THREAD#"
[param]
SQL1=param_sql,param,[1.1],TRUE
SQL2=param_sql2,param,[1.2],TRUE,FALSE,LTOR
[param]
select  /* tprsql */ p.name "Parameter",
    max(decode(p.inst_id, :inst_no1, p.value)) "#0",
    max(decode(p.inst_id, :inst_no2, p.value)) "#1",
    max(decode(p.inst_id, :inst_no3, p.value)) "#2"
from    gv$system_parameters p
where   p.inst_id in (:inst_no1, :inst_no2, :inst_no3)
group by p.name
order by p.name
[param_sql2]
select  /* tprsql */ nvl(i.instance_name, 'inst#'||x.inst)||' '||m.lbl title
  from (select :inst_no1 inst, 1 no from dual union all select :inst_no2 inst, 2 no from dual union all select :inst_no3 inst, 3 no from dual) x
  cross join (select 'param' lbl, 1 ord from dual) m
  left join gv$instance i on i.instance_number = x.inst
 order by m.ord, x.inst
