[load]
select  /* tprsql */ s.snap_gid "SnapID",
    to_char(s.end_interval_time, 'yyyy-mm-dd hh24:mi:ss') "Timestamp",
    nvl(sum(case when d.t = :inst_no1 and d.lbl = 'DBTime(s)' then d.v end),0) "#0.DBTime(s)",
    nvl(sum(case when d.t = :inst_no2 and d.lbl = 'DBTime(s)' then d.v end),0) "#1.DBTime(s)",
    nvl(sum(case when d.t = :inst_no3 and d.lbl = 'DBTime(s)' then d.v end),0) "#2.DBTime(s)",
    nvl(sum(case when d.t = :inst_no1 and d.lbl = 'DBCPU(s)' then d.v end),0) "#0.DBCPU(s)",
    nvl(sum(case when d.t = :inst_no2 and d.lbl = 'DBCPU(s)' then d.v end),0) "#1.DBCPU(s)",
    nvl(sum(case when d.t = :inst_no3 and d.lbl = 'DBCPU(s)' then d.v end),0) "#2.DBCPU(s)",
    nvl(sum(case when d.t = :inst_no1 and d.lbl = 'Redo(KB)' then d.v end),0) "#0.Redo(KB)",
    nvl(sum(case when d.t = :inst_no2 and d.lbl = 'Redo(KB)' then d.v end),0) "#1.Redo(KB)",
    nvl(sum(case when d.t = :inst_no3 and d.lbl = 'Redo(KB)' then d.v end),0) "#2.Redo(KB)",
    nvl(sum(case when d.t = :inst_no1 and d.lbl = 'LReads' then d.v end),0) "#0.LReads",
    nvl(sum(case when d.t = :inst_no2 and d.lbl = 'LReads' then d.v end),0) "#1.LReads",
    nvl(sum(case when d.t = :inst_no3 and d.lbl = 'LReads' then d.v end),0) "#2.LReads",
    nvl(sum(case when d.t = :inst_no1 and d.lbl = 'PReads' then d.v end),0) "#0.PReads",
    nvl(sum(case when d.t = :inst_no2 and d.lbl = 'PReads' then d.v end),0) "#1.PReads",
    nvl(sum(case when d.t = :inst_no3 and d.lbl = 'PReads' then d.v end),0) "#2.PReads",
    nvl(sum(case when d.t = :inst_no1 and d.lbl = 'UCalls' then d.v end),0) "#0.UCalls",
    nvl(sum(case when d.t = :inst_no2 and d.lbl = 'UCalls' then d.v end),0) "#1.UCalls",
    nvl(sum(case when d.t = :inst_no3 and d.lbl = 'UCalls' then d.v end),0) "#2.UCalls",
    nvl(sum(case when d.t = :inst_no1 and d.lbl = 'Execs' then d.v end),0) "#0.Execs",
    nvl(sum(case when d.t = :inst_no2 and d.lbl = 'Execs' then d.v end),0) "#1.Execs",
    nvl(sum(case when d.t = :inst_no3 and d.lbl = 'Execs' then d.v end),0) "#2.Execs",
    nvl(sum(case when d.t = :inst_no1 and d.lbl = 'Parses' then d.v end),0) "#0.Parses",
    nvl(sum(case when d.t = :inst_no2 and d.lbl = 'Parses' then d.v end),0) "#1.Parses",
    nvl(sum(case when d.t = :inst_no3 and d.lbl = 'Parses' then d.v end),0) "#2.Parses"
from    (select sn.snap_gid, min(sn.end_interval_time) end_interval_time,
            max(greatest((sn.end_interval_time - sn.begin_interval_time) * 86400, 1)) ela
       from sys._tpr_snapshot sn
      where sn.snap_gid between :gid_fr and :gid_to
      group by sn.snap_gid) s
left join (select 'DBTime(s)' lbl, j."THREAD#" t, sn.snap_gid, sum(j.time/1000000) v from sys._tpr_jcntstat j join sys._tpr_snapshot sn on sn.snap_id = j.snap_id and sn."THREAD#" = j."THREAD#" join sys._vt_jcntstat_name jn on jn.jcnt# = j.jcnt# where sn.snap_gid between :gid_fr and :gid_to and j."THREAD#" in (:inst_no1, :inst_no2, :inst_no3) and jn.time_name = 'req service time' group by sn.snap_gid, j."THREAD#" union all select 'DBCPU(s)' lbl, j."THREAD#" t, sn.snap_gid, sum(j.time/1000000) v from sys._tpr_jcntstat j join sys._tpr_snapshot sn on sn.snap_id = j.snap_id and sn."THREAD#" = j."THREAD#" join sys._vt_jcntstat_name jn on jn.jcnt# = j.jcnt# where sn.snap_gid between :gid_fr and :gid_to and j."THREAD#" in (:inst_no1, :inst_no2, :inst_no3) and jn.time_name = 'DB CPU time' group by sn.snap_gid, j."THREAD#" union all select 'Redo(KB)' lbl, j."THREAD#" t, sn.snap_gid, sum(j."SIZE"/1024) v from sys._tpr_jcntstat j join sys._tpr_snapshot sn on sn.snap_id = j.snap_id and sn."THREAD#" = j."THREAD#" join sys._vt_jcntstat_name jn on jn.jcnt# = j.jcnt# where sn.snap_gid between :gid_fr and :gid_to and j."THREAD#" in (:inst_no1, :inst_no2, :inst_no3) and jn.size_name = 'redo size' group by sn.snap_gid, j."THREAD#" union all select 'LReads' lbl, j."THREAD#" t, sn.snap_gid, sum(j."SIZE") v from sys._tpr_jcntstat j join sys._tpr_snapshot sn on sn.snap_id = j.snap_id and sn."THREAD#" = j."THREAD#" join sys._vt_jcntstat_name jn on jn.jcnt# = j.jcnt# where sn.snap_gid between :gid_fr and :gid_to and j."THREAD#" in (:inst_no1, :inst_no2, :inst_no3) and jn.size_name = 'logical reads' group by sn.snap_gid, j."THREAD#" union all select 'PReads' lbl, j."THREAD#" t, sn.snap_gid, sum(j."SIZE") v from sys._tpr_jcntstat j join sys._tpr_snapshot sn on sn.snap_id = j.snap_id and sn."THREAD#" = j."THREAD#" join sys._vt_jcntstat_name jn on jn.jcnt# = j.jcnt# where sn.snap_gid between :gid_fr and :gid_to and j."THREAD#" in (:inst_no1, :inst_no2, :inst_no3) and jn.size_name = 'physical reads' group by sn.snap_gid, j."THREAD#" union all select 'UCalls' lbl, j."THREAD#" t, sn.snap_gid, sum(j.num) v from sys._tpr_jcntstat j join sys._tpr_snapshot sn on sn.snap_id = j.snap_id and sn."THREAD#" = j."THREAD#" join sys._vt_jcntstat_name jn on jn.jcnt# = j.jcnt# where sn.snap_gid between :gid_fr and :gid_to and j."THREAD#" in (:inst_no1, :inst_no2, :inst_no3) and jn.value_name = 'req total count' group by sn.snap_gid, j."THREAD#" union all select 'Execs' lbl, j."THREAD#" t, sn.snap_gid, sum(j.num) v from sys._tpr_jcntstat j join sys._tpr_snapshot sn on sn.snap_id = j.snap_id and sn."THREAD#" = j."THREAD#" join sys._vt_jcntstat_name jn on jn.jcnt# = j.jcnt# where sn.snap_gid between :gid_fr and :gid_to and j."THREAD#" in (:inst_no1, :inst_no2, :inst_no3) and jn.value_name = 'execute count' group by sn.snap_gid, j."THREAD#" union all select 'Parses' lbl, j."THREAD#" t, sn.snap_gid, sum(j.num) v from sys._tpr_jcntstat j join sys._tpr_snapshot sn on sn.snap_id = j.snap_id and sn."THREAD#" = j."THREAD#" join sys._vt_jcntstat_name jn on jn.jcnt# = j.jcnt# where sn.snap_gid between :gid_fr and :gid_to and j."THREAD#" in (:inst_no1, :inst_no2, :inst_no3) and jn.value_name = 'parse count (total)' group by sn.snap_gid, j."THREAD#") d on d.snap_gid = s.snap_gid
       and d.lbl in ('DBTime(s)','DBCPU(s)','Redo(KB)','LReads','PReads','UCalls','Execs','Parses')
group by s.snap_gid, s.end_interval_time
order by s.snap_gid
[load_sql2]
select  /* tprsql */ nvl(i.instance_name, 'inst#'||x.inst)||' '||m.lbl title
  from (select :inst_no1 inst, 1 no from dual union all select :inst_no2 inst, 2 no from dual union all select :inst_no3 inst, 3 no from dual) x
  cross join (select 'DBTime(s)' lbl, 1 ord from dual union all select 'DBCPU(s)' lbl, 2 ord from dual union all select 'Redo(KB)' lbl, 3 ord from dual union all select 'LReads' lbl, 4 ord from dual union all select 'PReads' lbl, 5 ord from dual union all select 'UCalls' lbl, 6 ord from dual union all select 'Execs' lbl, 7 ord from dual union all select 'Parses' lbl, 8 ord from dual) m
  left join gv$instance i on i.instance_number = x.inst
 order by m.ord, x.inst
