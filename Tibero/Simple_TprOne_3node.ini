SQL2=load_sql2,load,[1.3],TRUE,FALSE,LTOR
CHART1=load,[1.2:E.2/1.3:E.5],ACTIVE,load,DBTime(s) by node,2,28,LINE,TRUE,dd hh:mm,Date & Time
