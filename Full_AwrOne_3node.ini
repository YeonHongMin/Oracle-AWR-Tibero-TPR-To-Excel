[archsize]
SQL1=archsize_sql,archsize,[1.1],TRUE
SQL2=archsize2,archsize,[1.2],TRUE,FALSE,LTOR
FORMAT4=archsize^[1.2:E.5]^###,##0
FORMAT5=archsize^[1.6:E.9]^###,##0.0
CHART2=archsize,[1.1:E.1/1.2:E.5], ACTIVE,archsize,# of Archived Log - @@hostname@@, 2,11,LINE,TRUE,MM-dd,Date & Time
CHART3=archsize,[1.1:E.1/1.6:E.9], ACTIVE,archsize,Size of Archived Log (Mb) - @@hostname@@,24,11,LINE,TRUE,MM-dd,Date & Time
[archsize]
select  /*+ awrsql */ to_char(first_time,'yyyy-mm-dd') "per Day"
        ,nvl(sum(decode(thread#,1,1,0)),0) "Log Count"
        ,nvl(sum(decode(thread#,2,1,0)),0) "Log Count.#2"
        ,nvl(sum(decode(thread#,3,1,0)),0) "Log Count.#3"
        ,nvl(sum(decode(thread#,4,1,0)),0) "Log Count.#4"
        ,nvl(sum(decode(thread#,1,blocks*block_size,0)),0)/1048576 "Size(Mb)"
        ,nvl(sum(decode(thread#,2,blocks*block_size,0)),0)/1048576 "Size(Mb).#2"
        ,nvl(sum(decode(thread#,3,blocks*block_size,0)),0)/1048576 "Size(Mb).#3"
        ,nvl(sum(decode(thread#,4,blocks*block_size,0)),0)/1048576 "Size(Mb).#4"
from    v$archived_log
where   first_time >= trunc(to_date(:snapdate_to,'YYYYMMDDHH24MI')-33)
  and   first_time <  trunc(to_date(:snapdate_to,'YYYYMMDDHH24MI'))+1
  and   standby_dest = 'NO'
group by to_char(first_time,'yyyy-mm-dd')
order by 1
[archsize2]
select  /*+ awrsql */ a.lable||nvl(t.instance, 'Thread#'||d.thread#) title
from    (select 'cnt-' lable, 1 ano from dual union all
         select 'siz-' lable, 2 ano from dual) a,
        (select 1 thread# from dual union all
         select 2 thread# from dual union all
         select 3 thread# from dual union all
         select 4 thread# from dual) d,
        v$thread t
where   d.thread# = t.thread#(+)
order by a.ano, d.thread#
[arch]
select  /*+ awrsql */ *
from    v$archived_log
where   first_time >= trunc(to_date(:snapdate_to,'YYYYMMDDHH24MI')-7)
  and   first_time <  trunc(to_date(:snapdate_to,'YYYYMMDDHH24MI'))+1
  and   standby_dest = 'NO'
order by thread#, sequence#, dest_id
