               +sum(case when inst=:inst_no3 and name='extra bytes read/written' then delta else 0 end)),0,0,
                sum(case when inst=:inst_no3 and name='bytes processed' then delta else 0 end)
              /(sum(case when inst=:inst_no3 and name='bytes processed' then delta else 0 end)
               +sum(case when inst=:inst_no3 and name='extra bytes read/written' then delta else 0 end)))      "#3.PGA Cache Hit %",
        sum(case when inst=:inst_no1 and name='bytes processed' then delta else 0 end)/1048576                 "#1.W/A MB Processed",
        sum(case when inst=:inst_no2 and name='bytes processed' then delta else 0 end)/1048576                 "#2.W/A MB Processed",
        sum(case when inst=:inst_no3 and name='bytes processed' then delta else 0 end)/1048576                 "#3.W/A MB Processed",
        sum(case when inst=:inst_no1 and name='extra bytes read/written' then delta else 0 end)/1048576        "#1.Extra W/A MB Read/Write",
        sum(case when inst=:inst_no2 and name='extra bytes read/written' then delta else 0 end)/1048576        "#2.Extra W/A MB Read/Write",
        sum(case when inst=:inst_no3 and name='extra bytes read/written' then delta else 0 end)/1048576        "#3.Extra W/A MB Read/Write"
  from (
         select p.instance_number, p.snap_id, p.name,
                greatest(p.value - lag(p.value) over (partition by p.dbid, p.instance_number, p.con_id, s0.startup_time, p.name order by p.snap_id), 0) delta
           from dba_hist_pgastat p,
                dba_hist_snapshot s0
          where p.dbid = s0.dbid and p.instance_number = s0.instance_number and p.snap_id = s0.snap_id
            and p.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
            and p.name in ('bytes processed','extra bytes read/written')
            and p.snap_id between :snap_fr and :snap_to
            and p.instance_number in (:inst_no1,:inst_no2,:inst_no3)
            and p.dbid = :dbid
       ) v1,
       (
       select instance_number inst, snap_id, to_char(end_interval_time, 'yyyy-mm-dd hh24:mi:ss') snap_time
         from dba_hist_snapshot
        where snap_id between 1+ :snap_fr and :snap_to
          and instance_number in (:inst_no1,:inst_no2,:inst_no3)
          and dbid = :dbid
       ) sn
 where v1.snap_id(+) = sn.snap_id
   and v1.instance_number(+) = sn.inst
group by sn.snap_id
order by sn.snap_id
