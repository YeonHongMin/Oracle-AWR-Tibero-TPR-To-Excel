                                +max(case when inst=:inst_no3 and stat_name='sorts (disk)' then delta_val else 0 end)))      "#3.In-memory Sort %",
       max(case when inst=:inst_no1 and delta_pins <> 0 then delta_pinhits/delta_pins else 0 end)     "#1.Library Hit %",
       max(case when inst=:inst_no2 and delta_pins <> 0 then delta_pinhits/delta_pins else 0 end)     "#2.Library Hit %",
       max(case when inst=:inst_no3 and delta_pins <> 0 then delta_pinhits/delta_pins else 0 end)     "#3.Library Hit %",
       decode(max(case when inst=:inst_no1 and stat_name='parse count (total)' then delta_val else 0 end), 0, 0,
                  1-(max(case when inst=:inst_no1 and stat_name='parse count (hard)' then delta_val else 0 end)
                    /max(case when inst=:inst_no1 and stat_name='parse count (total)' then delta_val else 0 end)))  "#1.Soft Parse %",
       decode(max(case when inst=:inst_no2 and stat_name='parse count (total)' then delta_val else 0 end), 0, 0,
                  1-(max(case when inst=:inst_no2 and stat_name='parse count (hard)' then delta_val else 0 end)
                    /max(case when inst=:inst_no2 and stat_name='parse count (total)' then delta_val else 0 end)))  "#2.Soft Parse %",
       decode(max(case when inst=:inst_no3 and stat_name='parse count (total)' then delta_val else 0 end), 0, 0,
                  1-(max(case when inst=:inst_no3 and stat_name='parse count (hard)' then delta_val else 0 end)
                    /max(case when inst=:inst_no3 and stat_name='parse count (total)' then delta_val else 0 end)))  "#3.Soft Parse %",
       decode(max(case when inst=:inst_no1 and stat_name='execute count' then delta_val else 0 end), 0, 0,
                  1-(max(case when inst=:inst_no1 and stat_name='parse count (total)' then delta_val else 0 end)
                    /max(case when inst=:inst_no1 and stat_name='execute count' then delta_val else 0 end))) "#1.Exec to Parse %",
       decode(max(case when inst=:inst_no2 and stat_name='execute count' then delta_val else 0 end), 0, 0,
                  1-(max(case when inst=:inst_no2 and stat_name='parse count (total)' then delta_val else 0 end)
                    /max(case when inst=:inst_no2 and stat_name='execute count' then delta_val else 0 end))) "#2.Exec to Parse %",
       decode(max(case when inst=:inst_no3 and stat_name='execute count' then delta_val else 0 end), 0, 0,
                  1-(max(case when inst=:inst_no3 and stat_name='parse count (total)' then delta_val else 0 end)
                    /max(case when inst=:inst_no3 and stat_name='execute count' then delta_val else 0 end))) "#3.Exec to Parse %",
       max(case when inst=:inst_no1 and delta_gets <> 0 then 1-(delta_misses/delta_gets) else 0 end) "#1.Latch Hit %",
       max(case when inst=:inst_no2 and delta_gets <> 0 then 1-(delta_misses/delta_gets) else 0 end) "#2.Latch Hit %",
       max(case when inst=:inst_no3 and delta_gets <> 0 then 1-(delta_misses/delta_gets) else 0 end) "#3.Latch Hit %",
       decode(max(case when inst=:inst_no1 and stat_name='parse time elapsed' then delta_val else 0 end), 0, 0,
                  max(case when inst=:inst_no1 and stat_name='parse time cpu' then delta_val else 0 end)
                 /max(case when inst=:inst_no1 and stat_name='parse time elapsed' then delta_val else 0 end)) "#1.% Parse CPU to Ela",
       decode(max(case when inst=:inst_no2 and stat_name='parse time elapsed' then delta_val else 0 end), 0, 0,
                  max(case when inst=:inst_no2 and stat_name='parse time cpu' then delta_val else 0 end)
                 /max(case when inst=:inst_no2 and stat_name='parse time elapsed' then delta_val else 0 end)) "#2.% Parse CPU to Ela",
       decode(max(case when inst=:inst_no3 and stat_name='parse time elapsed' then delta_val else 0 end), 0, 0,
                  max(case when inst=:inst_no3 and stat_name='parse time cpu' then delta_val else 0 end)
                 /max(case when inst=:inst_no3 and stat_name='parse time elapsed' then delta_val else 0 end)) "#3.% Parse CPU to Ela",
       decode(max(case when inst=:inst_no1 and stat_name='CPU used by this session' then delta_val else 0 end), 0, 0,
                  1-(max(case when inst=:inst_no1 and stat_name='parse time cpu' then delta_val else 0 end)
                    /max(case when inst=:inst_no1 and stat_name='CPU used by this session' then delta_val else 0 end))) "#1.% Non-Parse CPU",
       decode(max(case when inst=:inst_no2 and stat_name='CPU used by this session' then delta_val else 0 end), 0, 0,
                  1-(max(case when inst=:inst_no2 and stat_name='parse time cpu' then delta_val else 0 end)
                    /max(case when inst=:inst_no2 and stat_name='CPU used by this session' then delta_val else 0 end))) "#2.% Non-Parse CPU",
       decode(max(case when inst=:inst_no3 and stat_name='CPU used by this session' then delta_val else 0 end), 0, 0,
                  1-(max(case when inst=:inst_no3 and stat_name='parse time cpu' then delta_val else 0 end)
                    /max(case when inst=:inst_no3 and stat_name='CPU used by this session' then delta_val else 0 end))) "#3.% Non-Parse CPU"
 from (select sy.stat_name,
              sy.snap_id,
              sy.instance_number inst,
              to_char(sn.end_interval_time,'yyyy-mm-dd hh24:mi:ss') snap_time,
              case when sy.value - lag(sy.value) over (partition by sy.dbid, sy.instance_number, sy.con_id, sn.startup_time, sy.stat_name order by sy.snap_id) >= 0
                   then sy.value - lag(sy.value) over (partition by sy.dbid, sy.instance_number, sy.con_id, sn.startup_time, sy.stat_name order by sy.snap_id)
                   else null end delta_val,
              case when
                (extract (day    from sn.end_interval_time - lag(sn.end_interval_time) over (partition by sy.dbid, sy.instance_number, sy.con_id, sn.startup_time, sy.stat_name order by sy.snap_id))* 86400 +
                 extract (hour   from sn.end_interval_time - lag(sn.end_interval_time) over (partition by sy.dbid, sy.instance_number, sy.con_id, sn.startup_time, sy.stat_name order by sy.snap_id))*  3600 +
                 extract (minute from sn.end_interval_time - lag(sn.end_interval_time) over (partition by sy.dbid, sy.instance_number, sy.con_id, sn.startup_time, sy.stat_name order by sy.snap_id))*    60 +
                 extract (second from sn.end_interval_time - lag(sn.end_interval_time) over (partition by sy.dbid, sy.instance_number, sy.con_id, sn.startup_time, sy.stat_name order by sy.snap_id))) > 0
                and (sy.value - lag(sy.value) over (partition by sy.dbid, sy.instance_number, sy.con_id, sn.startup_time, sy.stat_name order by sy.snap_id)) >= 0
                then
                  (sy.value - lag(sy.value) over (partition by sy.dbid, sy.instance_number, sy.con_id, sn.startup_time, sy.stat_name order by sy.snap_id))
                  /(extract (day    from sn.end_interval_time - lag(sn.end_interval_time) over (partition by sy.dbid, sy.instance_number, sy.con_id, sn.startup_time, sy.stat_name order by sy.snap_id))* 86400 +
                    extract (hour   from sn.end_interval_time - lag(sn.end_interval_time) over (partition by sy.dbid, sy.instance_number, sy.con_id, sn.startup_time, sy.stat_name order by sy.snap_id))*  3600 +
                    extract (minute from sn.end_interval_time - lag(sn.end_interval_time) over (partition by sy.dbid, sy.instance_number, sy.con_id, sn.startup_time, sy.stat_name order by sy.snap_id))*    60 +
                    extract (second from sn.end_interval_time - lag(sn.end_interval_time) over (partition by sy.dbid, sy.instance_number, sy.con_id, sn.startup_time, sy.stat_name order by sy.snap_id))
                   )
                else null end delta,
              wa.delta_wa,
              libcache.delta_pins,
              libcache.delta_pinhits,
              latch.delta_gets,
              latch.delta_misses
         from dba_hist_sysstat sy,
              dba_hist_snapshot sn,
             (select snap_id, instance_number, dbid,
                     greatest(wait_cnt - lag(wait_cnt) over (partition by dbid, instance_number, startup_time order by snap_id), 0) delta_wa
                from (select w.snap_id, w.instance_number, w.dbid, s0.startup_time, sum(nvl(w.wait_count,0)) wait_cnt
                        from dba_hist_waitstat w, dba_hist_snapshot s0
                       where w.dbid = s0.dbid and w.instance_number = s0.instance_number and w.snap_id = s0.snap_id
                         and w.snap_id between :snap_fr and :snap_to
                         and w.instance_number in (:inst_no1,:inst_no2,:inst_no3) and w.dbid = :dbid
                         and w.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
                       group by w.snap_id, w.instance_number, w.dbid, s0.startup_time)) wa,
             (select snap_id, instance_number, dbid,
                     greatest(pins - lag(pins) over (partition by dbid, instance_number, startup_time order by snap_id), 0) delta_pins,
                     greatest(pinhits - lag(pinhits) over (partition by dbid, instance_number, startup_time order by snap_id), 0) delta_pinhits
                from (select l.snap_id, l.instance_number, l.dbid, s0.startup_time, sum(nvl(l.pins,0)) pins, sum(nvl(l.pinhits,0)) pinhits
                        from dba_hist_librarycache l, dba_hist_snapshot s0
                       where l.dbid = s0.dbid and l.instance_number = s0.instance_number and l.snap_id = s0.snap_id
                         and l.snap_id between :snap_fr and :snap_to
                         and l.instance_number in (:inst_no1,:inst_no2,:inst_no3) and l.dbid = :dbid
                         and l.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
                       group by l.snap_id, l.instance_number, l.dbid, s0.startup_time)) libcache,
             (select snap_id, instance_number, dbid,
                     greatest(gets - lag(gets) over (partition by dbid, instance_number, startup_time order by snap_id), 0) delta_gets,
                     greatest(misses - lag(misses) over (partition by dbid, instance_number, startup_time order by snap_id), 0) delta_misses
                from (select la.snap_id, la.instance_number, la.dbid, s0.startup_time, sum(nvl(la.gets,0)) gets, sum(nvl(la.misses,0)) misses
                        from dba_hist_latch la, dba_hist_snapshot s0
                       where la.dbid = s0.dbid and la.instance_number = s0.instance_number and la.snap_id = s0.snap_id
                         and la.snap_id between :snap_fr and :snap_to
                         and la.instance_number in (:inst_no1,:inst_no2,:inst_no3) and la.dbid = :dbid
                         and la.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
                       group by la.snap_id, la.instance_number, la.dbid, s0.startup_time)) latch
        where sy.snap_id = sn.snap_id
          and sy.instance_number = sn.instance_number
          and sy.dbid = sn.dbid
          and sy.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
          and wa.snap_id(+) = sn.snap_id
          and wa.instance_number(+) = sn.instance_number
          and wa.dbid(+) = sn.dbid
          and libcache.snap_id(+) = sn.snap_id
          and libcache.instance_number(+) = sn.instance_number
          and libcache.dbid(+) = sn.dbid
          and latch.snap_id(+) = sn.snap_id
          and latch.instance_number(+) = sn.instance_number
          and latch.dbid(+) = sn.dbid
          and sy.stat_name in (
                       'redo size'            ,
                       'session logical reads',
                       'db block changes'     ,
                       'physical reads'       ,
                       'physical reads direct',
                       'physical writes'      ,
                       'physical writes direct',
                       'physical read bytes'  ,
                       'physical write bytes' ,
                       'user calls'           ,
                       'parse count (total)'  ,
                       'parse count (hard)'   ,
                       'sorts (memory)'       ,
                       'sorts (disk)'         ,
                       'logons cumulative'    ,
                       'execute count'        ,
                       'user commits'         ,
                       'user rollbacks'       ,
                       'consistent gets from cache',
                       'db block gets from cache',
                       'redo log space requests',
                       'redo entries',
                       'physical reads cache',
                       'parse time cpu',
                       'parse time elapsed',
                       'CPU used by this session'
                      )
          and sn.snap_id between :snap_fr and :snap_to
          and sn.instance_number in (:inst_no1,:inst_no2,:inst_no3)
          and sn.dbid = :dbid)
 where snap_id > :snap_fr
group by snap_id
order by snap_id
