[rac_load]
select  /*+ awrsql */ snap_id "SnapID",
       min(snap_time) "Timestamp",
        max(case when inst=:inst_no1 and stat_name='gc cr blocks received' then delta else 0 end)
       +max(case when inst=:inst_no1 and stat_name='gc current blocks received' then delta else 0 end) "#1.GC blocks received",
        max(case when inst=:inst_no2 and stat_name='gc cr blocks received' then delta else 0 end)
       +max(case when inst=:inst_no2 and stat_name='gc current blocks received' then delta else 0 end) "#2.GC blocks received",
        max(case when inst=:inst_no3 and stat_name='gc cr blocks received' then delta else 0 end)
       +max(case when inst=:inst_no3 and stat_name='gc current blocks received' then delta else 0 end) "#3.GC blocks received",
        max(case when inst=:inst_no1 and stat_name='gc cr blocks served' then delta else 0 end)
       +max(case when inst=:inst_no1 and stat_name='gc current blocks served' then delta else 0 end) "#1.GC blocks served",
        max(case when inst=:inst_no2 and stat_name='gc cr blocks served' then delta else 0 end)
       +max(case when inst=:inst_no2 and stat_name='gc current blocks served' then delta else 0 end) "#2.GC blocks served",
        max(case when inst=:inst_no3 and stat_name='gc cr blocks served' then delta else 0 end)
       +max(case when inst=:inst_no3 and stat_name='gc current blocks served' then delta else 0 end) "#3.GC blocks served",
        max(case when inst=:inst_no1 and      name='gcs msgs received' then delta_dm else 0 end)
       +max(case when inst=:inst_no1 and      name='ges msgs received' then delta_dm else 0 end) "#1.GCS/GES msg received",
        max(case when inst=:inst_no2 and      name='gcs msgs received' then delta_dm else 0 end)
       +max(case when inst=:inst_no2 and      name='ges msgs received' then delta_dm else 0 end) "#2.GCS/GES msg received",
        max(case when inst=:inst_no3 and      name='gcs msgs received' then delta_dm else 0 end)
       +max(case when inst=:inst_no3 and      name='ges msgs received' then delta_dm else 0 end) "#3.GCS/GES msg received",
        max(case when inst=:inst_no1 and stat_name='gcs messages sent' then delta else 0 end)
       +max(case when inst=:inst_no1 and stat_name='ges messages sent' then delta else 0 end) "#1.GCS/GES msg sent",
        max(case when inst=:inst_no2 and stat_name='gcs messages sent' then delta else 0 end)
       +max(case when inst=:inst_no2 and stat_name='ges messages sent' then delta else 0 end) "#2.GCS/GES msg sent",
        max(case when inst=:inst_no3 and stat_name='gcs messages sent' then delta else 0 end)
       +max(case when inst=:inst_no3 and stat_name='ges messages sent' then delta else 0 end) "#3.GCS/GES msg sent",
       max(case when inst=:inst_no1 and stat_name='DBWR fusion writes' then delta else 0 end) "#1.DBWR fusion writes",
       max(case when inst=:inst_no2 and stat_name='DBWR fusion writes' then delta else 0 end) "#2.DBWR fusion writes",
       max(case when inst=:inst_no3 and stat_name='DBWR fusion writes' then delta else 0 end) "#3.DBWR fusion writes",
       ((max(case when inst=:inst_no1 and stat_name='gc cr blocks received' then delta else 0 end)
        +max(case when inst=:inst_no1 and stat_name='gc current blocks received' then delta else 0 end)
        +max(case when inst=:inst_no1 and stat_name='gc cr blocks served' then delta else 0 end)
        +max(case when inst=:inst_no1 and stat_name='gc current blocks served' then delta else 0 end)
        ) * (select max(to_number(value)) from dba_hist_parameter where parameter_name='db_block_size' and dbid=:dbid and instance_number=:inst_no1 and snap_id=:snap_to and (con_id in (0, 1) or con_id = to_number(sys_context('USERENV','CON_ID'))))
       +(max(case when inst=:inst_no1 and stat_name='gcs messages sent' then delta else 0 end)
        +max(case when inst=:inst_no1 and stat_name='ges messages sent' then delta else 0 end)
        +max(case when inst=:inst_no1 and      name='gcs msgs received' then delta_dm else 0 end)
        +max(case when inst=:inst_no1 and      name='ges msgs received' then delta_dm else 0 end)
        ) * 200 ) / 1048576 "#1.Interconnect traffic(Mb)",
       ((max(case when inst=:inst_no2 and stat_name='gc cr blocks received' then delta else 0 end)
        +max(case when inst=:inst_no2 and stat_name='gc current blocks received' then delta else 0 end)
        +max(case when inst=:inst_no2 and stat_name='gc cr blocks served' then delta else 0 end)
        +max(case when inst=:inst_no2 and stat_name='gc current blocks served' then delta else 0 end)
        ) * (select max(to_number(value)) from dba_hist_parameter where parameter_name='db_block_size' and dbid=:dbid and instance_number=:inst_no2 and snap_id=:snap_to and (con_id in (0, 1) or con_id = to_number(sys_context('USERENV','CON_ID'))))
       +(max(case when inst=:inst_no2 and stat_name='gcs messages sent' then delta else 0 end)
        +max(case when inst=:inst_no2 and stat_name='ges messages sent' then delta else 0 end)
        +max(case when inst=:inst_no2 and      name='gcs msgs received' then delta_dm else 0 end)
        +max(case when inst=:inst_no2 and      name='ges msgs received' then delta_dm else 0 end)
        ) * 200 ) / 1048576 "#2.Interconnect traffic(Mb)",
       ((max(case when inst=:inst_no3 and stat_name='gc cr blocks received' then delta else 0 end)
        +max(case when inst=:inst_no3 and stat_name='gc current blocks received' then delta else 0 end)
        +max(case when inst=:inst_no3 and stat_name='gc cr blocks served' then delta else 0 end)
        +max(case when inst=:inst_no3 and stat_name='gc current blocks served' then delta else 0 end)
        ) * (select max(to_number(value)) from dba_hist_parameter where parameter_name='db_block_size' and dbid=:dbid and instance_number=:inst_no3 and snap_id=:snap_to and (con_id in (0, 1) or con_id = to_number(sys_context('USERENV','CON_ID'))))
       +(max(case when inst=:inst_no3 and stat_name='gcs messages sent' then delta else 0 end)
        +max(case when inst=:inst_no3 and stat_name='ges messages sent' then delta else 0 end)
        +max(case when inst=:inst_no3 and      name='gcs msgs received' then delta_dm else 0 end)
        +max(case when inst=:inst_no3 and      name='ges msgs received' then delta_dm else 0 end)
        ) * 200 ) / 1048576 "#3.Interconnect traffic(Mb)",
       max(case when inst=:inst_no1 and stat_name='physical read bytes'  then delta else 0 end)/1048576 "#1.Phys read(MB/s)",
       max(case when inst=:inst_no2 and stat_name='physical read bytes'  then delta else 0 end)/1048576 "#2.Phys read(MB/s)",
       max(case when inst=:inst_no3 and stat_name='physical read bytes'  then delta else 0 end)/1048576 "#3.Phys read(MB/s)",
       max(case when inst=:inst_no1 and stat_name='physical write bytes' then delta else 0 end)/1048576 "#1.Phys write(MB/s)",
       max(case when inst=:inst_no2 and stat_name='physical write bytes' then delta else 0 end)/1048576 "#2.Phys write(MB/s)",
       max(case when inst=:inst_no3 and stat_name='physical write bytes' then delta else 0 end)/1048576 "#3.Phys write(MB/s)",
       max(case when inst=:inst_no1 and stat_name='gc blocks lost' then delta_val else 0 end) "#1.gc lost",
       max(case when inst=:inst_no2 and stat_name='gc blocks lost' then delta_val else 0 end) "#2.gc lost",
       max(case when inst=:inst_no3 and stat_name='gc blocks lost' then delta_val else 0 end) "#3.gc lost",
       max(case when inst=:inst_no1 and stat_name='gc blocks corrupt' then delta_val else 0 end) "#1.gc corrupt",
       max(case when inst=:inst_no2 and stat_name='gc blocks corrupt' then delta_val else 0 end) "#2.gc corrupt",
       max(case when inst=:inst_no3 and stat_name='gc blocks corrupt' then delta_val else 0 end) "#3.gc corrupt"
 from (
       select x.snap_id, x.inst, x.snap_time, x.stat_name,
              x.dval delta_val,
              case when x.secs > 0 and x.dval >= 0 then x.dval / x.secs else null end delta,
              cast(null as varchar2(64)) name,
              cast(null as number) delta_dm_val,
              cast(null as number) delta_dm
         from (select sy.snap_id,
                      sy.instance_number inst,
                      to_char(sn.end_interval_time,'yyyy-mm-dd hh24:mi:ss') snap_time,
                      sy.stat_name,
                      sy.value - lag(sy.value) over (partition by sy.dbid, sy.instance_number, sy.con_id, sn.startup_time, sy.stat_name order by sy.snap_id) dval,
                      (extract (day    from sn.end_interval_time - lag(sn.end_interval_time) over (partition by sy.dbid, sy.instance_number, sy.con_id, sn.startup_time, sy.stat_name order by sy.snap_id)) * 86400 +
                       extract (hour   from sn.end_interval_time - lag(sn.end_interval_time) over (partition by sy.dbid, sy.instance_number, sy.con_id, sn.startup_time, sy.stat_name order by sy.snap_id)) *  3600 +
                       extract (minute from sn.end_interval_time - lag(sn.end_interval_time) over (partition by sy.dbid, sy.instance_number, sy.con_id, sn.startup_time, sy.stat_name order by sy.snap_id)) *    60 +
                       extract (second from sn.end_interval_time - lag(sn.end_interval_time) over (partition by sy.dbid, sy.instance_number, sy.con_id, sn.startup_time, sy.stat_name order by sy.snap_id))) secs
                 from dba_hist_sysstat sy,
                      dba_hist_snapshot sn
                where sy.snap_id = sn.snap_id
                  and sy.instance_number = sn.instance_number
                  and sy.dbid = sn.dbid
                  and sy.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
                  and sy.stat_name in (
                       'DBWR fusion writes'   ,
                       'gcs messages sent'    ,
                       'ges messages sent'    ,
                       'gc cr blocks received',
                       'gc current blocks received',
                       'gc cr blocks served',
                       'gc current blocks served',
                       'gc blocks lost',
                       'gc blocks corrupt',
                       'physical read bytes',
                       'physical write bytes'
                      )
                  and sn.snap_id between :snap_fr and :snap_to
                  and sn.instance_number in (:inst_no1,:inst_no2,:inst_no3)
                  and sn.dbid = :dbid) x
       union all
       select y.snap_id, y.inst, y.snap_time,
              cast(null as varchar2(64)) stat_name,
              cast(null as number) delta_val,
              cast(null as number) delta,
              y.name,
              case when y.dval >= 0 and y.dval < 1e15 then y.dval else null end delta_dm_val,
              case when y.secs > 0 and y.dval >= 0 and y.dval < 1e15 then y.dval / y.secs else null end delta_dm
         from (select dm.snap_id,
                      dm.instance_number inst,
                      to_char(sn.end_interval_time,'yyyy-mm-dd hh24:mi:ss') snap_time,
                      dm.name,
                      dm.value - lag(dm.value) over (partition by dm.dbid, dm.instance_number, dm.con_id, sn.startup_time, dm.name order by dm.snap_id) dval,
                      (extract (day    from sn.end_interval_time - lag(sn.end_interval_time) over (partition by dm.dbid, dm.instance_number, dm.con_id, sn.startup_time, dm.name order by dm.snap_id)) * 86400 +
                       extract (hour   from sn.end_interval_time - lag(sn.end_interval_time) over (partition by dm.dbid, dm.instance_number, dm.con_id, sn.startup_time, dm.name order by dm.snap_id)) *  3600 +
                       extract (minute from sn.end_interval_time - lag(sn.end_interval_time) over (partition by dm.dbid, dm.instance_number, dm.con_id, sn.startup_time, dm.name order by dm.snap_id)) *    60 +
                       extract (second from sn.end_interval_time - lag(sn.end_interval_time) over (partition by dm.dbid, dm.instance_number, dm.con_id, sn.startup_time, dm.name order by dm.snap_id))) secs
                 from dba_hist_dlm_misc dm,
                      dba_hist_snapshot sn
                where dm.snap_id = sn.snap_id
                  and dm.instance_number = sn.instance_number
                  and dm.dbid = sn.dbid
                  and dm.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
                  and dm.name in ('gcs msgs received','ges msgs received')
                  and sn.snap_id between :snap_fr and :snap_to
                  and sn.instance_number in (:inst_no1,:inst_no2,:inst_no3)
                  and sn.dbid = :dbid) y
      )
 where snap_id > :snap_fr
group by snap_id
order by snap_id
