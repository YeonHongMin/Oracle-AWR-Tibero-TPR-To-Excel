             /max(case when inst=:inst_no3 and name='msgs sent queued on ksxp' then delta_dm_val else 0 end)))   "#3.msg snt q time on ksxp(ms)",
       decode(max(case when inst=:inst_no1 and name='msgs received queued' then delta_dm_val else 0 end), 0, 0,
             (max(case when inst=:inst_no1 and name='msgs received queue time (ms)' then delta_dm_val else 0 end)
             /max(case when inst=:inst_no1 and name='msgs received queued' then delta_dm_val else 0 end)))       "#1.msg rcvd queue time(ms)",
       decode(max(case when inst=:inst_no2 and name='msgs received queued' then delta_dm_val else 0 end), 0, 0,
             (max(case when inst=:inst_no2 and name='msgs received queue time (ms)' then delta_dm_val else 0 end)
             /max(case when inst=:inst_no2 and name='msgs received queued' then delta_dm_val else 0 end)))       "#2.msg rcvd queue time(ms)",
       decode(max(case when inst=:inst_no3 and name='msgs received queued' then delta_dm_val else 0 end), 0, 0,
             (max(case when inst=:inst_no3 and name='msgs received queue time (ms)' then delta_dm_val else 0 end)
             /max(case when inst=:inst_no3 and name='msgs received queued' then delta_dm_val else 0 end)))       "#3.msg rcvd queue time(ms)",
       decode(max(case when inst=:inst_no1 and name='gcs msgs received' then delta_dm_val else 0 end), 0, 0,
             (max(case when inst=:inst_no1 and name='gcs msgs process time(ms)' then delta_dm_val else 0 end)
             /max(case when inst=:inst_no1 and name='gcs msgs received' then delta_dm_val else 0 end)))          "#1.GCS msg process time(ms)",
       decode(max(case when inst=:inst_no2 and name='gcs msgs received' then delta_dm_val else 0 end), 0, 0,
             (max(case when inst=:inst_no2 and name='gcs msgs process time(ms)' then delta_dm_val else 0 end)
             /max(case when inst=:inst_no2 and name='gcs msgs received' then delta_dm_val else 0 end)))          "#2.GCS msg process time(ms)",
       decode(max(case when inst=:inst_no3 and name='gcs msgs received' then delta_dm_val else 0 end), 0, 0,
             (max(case when inst=:inst_no3 and name='gcs msgs process time(ms)' then delta_dm_val else 0 end)
             /max(case when inst=:inst_no3 and name='gcs msgs received' then delta_dm_val else 0 end)))          "#3.GCS msg process time(ms)",
       decode(max(case when inst=:inst_no1 and name='ges msgs received' then delta_dm_val else 0 end), 0, 0,
             (max(case when inst=:inst_no1 and name='ges msgs process time(ms)' then delta_dm_val else 0 end)
             /max(case when inst=:inst_no1 and name='ges msgs received' then delta_dm_val else 0 end)))          "#1.GES msg process time(ms)",
       decode(max(case when inst=:inst_no2 and name='ges msgs received' then delta_dm_val else 0 end), 0, 0,
             (max(case when inst=:inst_no2 and name='ges msgs process time(ms)' then delta_dm_val else 0 end)
             /max(case when inst=:inst_no2 and name='ges msgs received' then delta_dm_val else 0 end)))          "#2.GES msg process time(ms)",
       decode(max(case when inst=:inst_no3 and name='ges msgs received' then delta_dm_val else 0 end), 0, 0,
             (max(case when inst=:inst_no3 and name='ges msgs process time(ms)' then delta_dm_val else 0 end)
             /max(case when inst=:inst_no3 and name='ges msgs received' then delta_dm_val else 0 end)))          "#3.GES msg process time(ms)"
 from (select dm.snap_id,
              dm.instance_number inst,
              to_char(sn.end_interval_time,'yyyy-mm-dd hh24:mi:ss') snap_time,
              dm.name,
              case when (dm.value - lag(dm.value) over (partition by dm.dbid, dm.instance_number, dm.con_id, sn.startup_time, dm.name order by dm.snap_id)) >= 0
                    and (dm.value - lag(dm.value) over (partition by dm.dbid, dm.instance_number, dm.con_id, sn.startup_time, dm.name order by dm.snap_id)) < 1e15
                   then dm.value - lag(dm.value) over (partition by dm.dbid, dm.instance_number, dm.con_id, sn.startup_time, dm.name order by dm.snap_id)
                   else 0 end delta_dm_val
         from dba_hist_dlm_misc dm,
              dba_hist_snapshot sn
        where dm.snap_id = sn.snap_id
          and dm.instance_number = sn.instance_number
          and dm.dbid = sn.dbid
          and dm.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
          and dm.name in (
               'gcs msgs received',
               'gcs msgs process time(ms)',
               'ges msgs received',
               'ges msgs process time(ms)',
               'msgs sent queued',
               'msgs sent queue time (ms)',
               'msgs sent queued on ksxp',
               'msgs sent queue time on ksxp (ms)',
               'msgs received queue time (ms)',
               'msgs received queued'
              )
          and sn.snap_id between :snap_fr and :snap_to
          and sn.instance_number in (:inst_no1,:inst_no2,:inst_no3)
          and sn.dbid = :dbid)
 where snap_id > :snap_fr
group by snap_id
order by snap_id
