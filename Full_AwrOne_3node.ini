[dbinfo]
SQL1=dbinfo_sql,dbinfo,[1.1],TRUE
[dbinfo]
select /*+ awrsql */ distinct
    host_name "Host Name",
    db_name   "DB Name",
    instance_name   "Instance",
    version   "Version",
    parallel  "Cluster ?",
    (select to_char(min(begin_interval_time), 'yyyy-mm-dd hh24:mi:ss')
       from dba_hist_snapshot
      where snap_id between 1+ :snap_fr and :snap_to
        and instance_number = x.instance_number
        and dbid = x.dbid) "Snap Begin",
    (select to_char(max(end_interval_time), 'yyyy-mm-dd hh24:mi:ss')
       from dba_hist_snapshot
      where snap_id between 1+ :snap_fr and :snap_to
        and instance_number = x.instance_number
        and dbid = x.dbid) "Snap End",
    dbid      "DB ID",
    instance_number "Instance#"
from    dba_hist_database_instance x
where instance_number in (:inst_no1,:inst_no2,:inst_no3)
  and dbid = :dbid
  and parallel=(select min(decode(value,'TRUE','YES','NO')) from dba_hist_parameter
                 where parameter_name='cluster_database' and dbid=:dbid and instance_number=:inst_no1 and snap_id=:snap_to
                   and (con_id in (0, 1) or con_id = to_number(sys_context('USERENV','CON_ID'))))
order by instance_number
[snapinfo]
SQL1=snapinfo_sql,snapinfo,[1.1],TRUE
FORMAT1=snapinfo^[1.5:E.5]^###,##0
[snapinfo]
select /*+ awrsql */ snap_id "SnapID",
    instance_number "Inst#",
    to_char(end_interval_time, 'yyyy-mm-dd hh24:mi:ss') "Snap Time",
    snap_level "Snap Level",
    extract (day    from (end_interval_time-begin_interval_time) )* 86400 +
        extract (hour   from (end_interval_time-begin_interval_time) )*  3600 +
        extract (minute from (end_interval_time-begin_interval_time) )*    60 +
        extract (second from (end_interval_time-begin_interval_time) ) "interval(s)",
    to_char(startup_time, 'yyyy-mm-dd hh24:mi:ss')  "DB Startup",
    dbid "DB ID"
from    dba_hist_snapshot
where snap_id between :snap_fr and :snap_to
  and instance_number in (:inst_no1,:inst_no2,:inst_no3)
  and dbid = :dbid
order by snap_id, instance_number
[param_sga]
SQL1=param_sga_sql,param_sga,[1.1],FALSE
SQL2=param_sga_sql2,param_sga,[1.2],TRUE,FALSE,LTOR
FORMAT1=param_sga^[1.2:E.4]^###,##0
[param_sga]
select  /*+ awrsql */  parameter_name "SGA Parameter",
    nvl(max(decode(instance_number,:inst_no1,value)),'n/a') "Inst#1",
    nvl(max(decode(instance_number,:inst_no2,value)),'n/a') "Inst#2",
    nvl(max(decode(instance_number,:inst_no3,value)),'n/a') "Inst#3"
from    dba_hist_parameter
where   parameter_name in (
             'db_block_buffers','db_block_size','db_cache_size','db_2k_cache_size','db_4k_cache_size',
             'db_8k_cache_size','db_16k_cache_size','db_32k_cache_size','db_keep_cache_size','db_recycle_cache_size',
             'java_pool_size','large_pool_size','log_buffer',
             'pga_aggregate_target',
             'shared_pool_size','sga_max_size','sga_target',
             'statistics_level','workarea_size_policy'
                )
  and   snap_id = :snap_to
  and instance_number in (:inst_no1,:inst_no2,:inst_no3)
  and   dbid = :dbid
  and   (con_id in (0, 1) or con_id = to_number(sys_context('USERENV','CON_ID')))
group by parameter_name
order by parameter_name
[param_sga_sql2]
select  nvl(p.value,'inst#'||x.instance_number) title
from    (
         select :inst_no1 instance_number from dual union all
         select :inst_no2 instance_number from dual union all
         select :inst_no3 instance_number from dual union all
         select null instance_number from dual where 1=0) x
     ,  (select instance_number, min(value) value from dba_hist_parameter where parameter_name = 'instance_name' and snap_id = :snap_to and dbid = :dbid and (con_id in (0, 1) or con_id = to_number(sys_context('USERENV','CON_ID'))) group by instance_number) p
where   p.instance_number(+) = x.instance_number
order by x.instance_number
[param]
SQL1=param_sql,param,[1.1],TRUE
SQL2=param_sql2,param,[1.2],TRUE,FALSE,LTOR
FORMAT1=param^[1.2:E.4]^###,##0
FORMAT2=param^[1.1:E.1]^###,##0
[param]
select  /*+ awrsql */  parameter_name "parameter",
    nvl(max(decode(instance_number,:inst_no1,value)),'n/a') "Inst#1",
    nvl(max(decode(instance_number,:inst_no2,value)),'n/a') "Inst#2",
    nvl(max(decode(instance_number,:inst_no3,value)),'n/a') "Inst#3",
    max(decode(instance_number,:inst_no1,isdefault))  "default?:Inst#1",
    max(decode(instance_number,:inst_no2,isdefault))  "default?:Inst#2",
    max(decode(instance_number,:inst_no3,isdefault))  "default?:Inst#3",
    max(decode(instance_number,:inst_no1,ismodified)) "modified?:Inst#1",
    max(decode(instance_number,:inst_no2,ismodified)) "modified?:Inst#2",
    max(decode(instance_number,:inst_no3,ismodified)) "modified?:Inst#3"
from    dba_hist_parameter
where   snap_id = :snap_to
  and   instance_number in (:inst_no1,:inst_no2,:inst_no3)
  and   dbid = :dbid
  and   (con_id in (0, 1) or con_id = to_number(sys_context('USERENV','CON_ID')))
group by parameter_name
order by parameter_name
[param_sql2]
select  /*+ awrsql */ value||lable title
  from (
       select 1 no, ''             lable from dual union all
       select 2   , ' (default?)'        from dual union all
       select 3   , ' (modified?)'       from dual
       ) a,
       (
       select x.instance_number, nvl(p.value,'inst#'||x.instance_number) value
         from (
               select :inst_no1 instance_number from dual union all
               select :inst_no2 instance_number from dual union all
               select :inst_no3 instance_number from dual union all
               select null instance_number from dual where 1=0
               ) x
            , (select instance_number, min(value) value from dba_hist_parameter where parameter_name = 'instance_name' and snap_id = :snap_to and dbid = :dbid and (con_id in (0, 1) or con_id = to_number(sys_context('USERENV','CON_ID'))) group by instance_number) p
        where p.instance_number(+) = x.instance_number
       ) b
order by a.no, b.instance_number
