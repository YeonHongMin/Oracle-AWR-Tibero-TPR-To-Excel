       select 24  , '' from dual union all
       select 25  , '' from dual union all
       select 26  , '' from dual union all
       select 27  , '' from dual union all
       select 28  , '' from dual
       ) a,
       (
       select x.instance_number, nvl(p.value,'inst#'||x.instance_number) value
         from (
               select :inst_no1 instance_number from dual union all
               select :inst_no2 instance_number from dual union all
               select :inst_no3 instance_number from dual union all
               select null instance_number from dual where 1=0
               ) x
            , (select instance_number, min(value) value from dba_hist_parameter where parameter_name = 'instance_name' and snap_id = :snap_to and dbid = :dbid and (con_id in (0, 1) or con_id = to_number(sys_context('USERENV','CON_ID'))) group by instance_number) p
        where p.instance_number(+) = x.instance_number
       ) b
order by a.no, b.instance_number
