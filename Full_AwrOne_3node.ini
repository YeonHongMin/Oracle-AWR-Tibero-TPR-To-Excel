select /*+ awrsql */ sn.snap_id,
       min(sn.snap_time) "Timestamp",
       max(case when sn.inst=:inst_no1 then nvl(v_dbtime.db_time_delta,0) else 0 end)/1000000 "#1.DB time",
       max(case when sn.inst=:inst_no2 then nvl(v_dbtime.db_time_delta,0) else 0 end)/1000000 "#2.DB time",
       max(case when sn.inst=:inst_no3 then nvl(v_dbtime.db_time_delta,0) else 0 end)/1000000 "#3.DB time",
       max(case when sn.inst=:inst_no1 then nvl(v_dbtime.db_cpu_delta,0) else 0 end)/1000000 "#1.DB CPU",
       max(case when sn.inst=:inst_no2 then nvl(v_dbtime.db_cpu_delta,0) else 0 end)/1000000 "#2.DB CPU",
       max(case when sn.inst=:inst_no3 then nvl(v_dbtime.db_cpu_delta,0) else 0 end)/1000000 "#3.DB CPU",
       decode(max(case when sn.inst=:inst_no1 then nvl(v_call.call_delta,0) else 0 end),0,0,
        max(case when sn.inst=:inst_no1 then nvl(v_dbtime.db_time_delta,0) else 0 end)
        /max(case when sn.inst=:inst_no1 then v_call.call_delta else 0 end)/1000) "#1.resp time/call",
       decode(max(case when sn.inst=:inst_no2 then nvl(v_call.call_delta,0) else 0 end),0,0,
        max(case when sn.inst=:inst_no2 then nvl(v_dbtime.db_time_delta,0) else 0 end)
        /max(case when sn.inst=:inst_no2 then v_call.call_delta else 0 end)/1000) "#2.resp time/call",
       decode(max(case when sn.inst=:inst_no3 then nvl(v_call.call_delta,0) else 0 end),0,0,
        max(case when sn.inst=:inst_no3 then nvl(v_dbtime.db_time_delta,0) else 0 end)
        /max(case when sn.inst=:inst_no3 then v_call.call_delta else 0 end)/1000) "#3.resp time/call",
       decode(max(case when sn.inst=:inst_no1 then nvl(v_call.exec_delta,0) else 0 end),0,0,
        max(case when sn.inst=:inst_no1 then nvl(v_dbtime.db_time_delta,0) else 0 end)
        /max(case when sn.inst=:inst_no1 then v_call.exec_delta else 0 end)/1000) "#1.resp time/exec",
       decode(max(case when sn.inst=:inst_no2 then nvl(v_call.exec_delta,0) else 0 end),0,0,
        max(case when sn.inst=:inst_no2 then nvl(v_dbtime.db_time_delta,0) else 0 end)
        /max(case when sn.inst=:inst_no2 then v_call.exec_delta else 0 end)/1000) "#2.resp time/exec",
       decode(max(case when sn.inst=:inst_no3 then nvl(v_call.exec_delta,0) else 0 end),0,0,
        max(case when sn.inst=:inst_no3 then nvl(v_dbtime.db_time_delta,0) else 0 end)
        /max(case when sn.inst=:inst_no3 then v_call.exec_delta else 0 end)/1000) "#3.resp time/exec"
  from (select instance_number, snap_id,
               sum(decode(stat_name, 'DB time', delta, 0)) db_time_delta,
               sum(decode(stat_name, 'DB CPU',  delta, 0)) db_cpu_delta
          from (select tm.instance_number, tm.snap_id, tm.stat_name,
                       greatest(tm.value - lag(tm.value) over (partition by tm.dbid, tm.instance_number, tm.con_id, s0.startup_time, tm.stat_name order by tm.snap_id), 0) delta
                  from dba_hist_sys_time_model tm,
                       dba_hist_snapshot s0
                 where tm.dbid = s0.dbid and tm.instance_number = s0.instance_number and tm.snap_id = s0.snap_id
                   and tm.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
                   and tm.stat_name in ('DB time','DB CPU')
                   and tm.snap_id between :snap_fr and :snap_to
                   and tm.instance_number in (:inst_no1,:inst_no2,:inst_no3)
                   and tm.dbid = :dbid)
         where snap_id > :snap_fr
         group by instance_number, snap_id) v_dbtime,
       (select instance_number, snap_id,
               sum(case when stat_name in ('user calls','recursive calls') then delta else 0 end) call_delta,
               sum(case when stat_name = 'execute count' then delta else 0 end) exec_delta
          from (select sy.instance_number, sy.snap_id, sy.stat_name,
                       greatest(sy.value - lag(sy.value) over (partition by sy.dbid, sy.instance_number, sy.con_id, s0.startup_time, sy.stat_name order by sy.snap_id), 0) delta
                  from dba_hist_sysstat sy,
                       dba_hist_snapshot s0
                 where sy.dbid = s0.dbid and sy.instance_number = s0.instance_number and sy.snap_id = s0.snap_id
                   and sy.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
                   and sy.stat_name in ('user calls', 'recursive calls', 'execute count')
                   and sy.snap_id between :snap_fr and :snap_to
                   and sy.instance_number in (:inst_no1,:inst_no2,:inst_no3)
                   and sy.dbid = :dbid)
         where snap_id > :snap_fr
         group by instance_number, snap_id) v_call,
       (select instance_number inst, snap_id,
               to_char(end_interval_time,'yyyy-mm-dd hh24:mi:ss') snap_time
          from dba_hist_snapshot
         where snap_id between 1+ :snap_fr and :snap_to
           and instance_number in (:inst_no1,:inst_no2,:inst_no3)
           and dbid = :dbid) sn
 where v_call.snap_id(+) = sn.snap_id
   and v_dbtime.snap_id(+) = sn.snap_id
   and v_call.instance_number(+) = sn.inst
   and v_dbtime.instance_number(+) = sn.inst
 group by sn.snap_id
 order by sn.snap_id
