[rac_gccr_srv]
select  /*+ awrsql */   b.snap_id   "SnapID"
        ,min(b.snap_time) "Timestamp"
    ,max(case when inst=:inst_no1 then (cr_requests+current_requests)/interval else 0 end)   "#1.req:total"
    ,max(case when inst=:inst_no2 then (cr_requests+current_requests)/interval else 0 end)   "#2.req:total"
    ,max(case when inst=:inst_no3 then (cr_requests+current_requests)/interval else 0 end)   "#3.req:total"
    ,max(case when inst=:inst_no1 then errors else 0 end)                        "#1.errors"
    ,max(case when inst=:inst_no2 then errors else 0 end)                        "#2.errors"
    ,max(case when inst=:inst_no3 then errors else 0 end)                        "#3.errors"
    ,decode(max(case when inst=:inst_no1 then (cr_requests+current_requests) else 0 end),0,0,
            max(case when inst=:inst_no1 then fairness_down_converts else 0 end)
           /max(case when inst=:inst_no1 then (cr_requests+current_requests) else 0 end))    "#1.fair.downconvert%"
    ,decode(max(case when inst=:inst_no2 then (cr_requests+current_requests) else 0 end),0,0,
            max(case when inst=:inst_no2 then fairness_down_converts else 0 end)
           /max(case when inst=:inst_no2 then (cr_requests+current_requests) else 0 end))    "#2.fair.downconvert%"
    ,decode(max(case when inst=:inst_no3 then (cr_requests+current_requests) else 0 end),0,0,
            max(case when inst=:inst_no3 then fairness_down_converts else 0 end)
           /max(case when inst=:inst_no3 then (cr_requests+current_requests) else 0 end))    "#3.fair.downconvert%"
    ,decode(max(case when inst=:inst_no1 then cr_requests else 0 end),0,0,
            max(case when inst=:inst_no1 then light_works else 0 end)
           /max(case when inst=:inst_no1 then cr_requests else 0 end))                       "#1.cr light-weight%"
    ,decode(max(case when inst=:inst_no2 then cr_requests else 0 end),0,0,
            max(case when inst=:inst_no2 then light_works else 0 end)
           /max(case when inst=:inst_no2 then cr_requests else 0 end))                       "#2.cr light-weight%"
    ,decode(max(case when inst=:inst_no3 then cr_requests else 0 end),0,0,
            max(case when inst=:inst_no3 then light_works else 0 end)
           /max(case when inst=:inst_no3 then cr_requests else 0 end))                       "#3.cr light-weight%"
    ,decode(max(case when inst=:inst_no1 then (cr_requests+current_requests) else 0 end),0,0,
            max(case when inst=:inst_no1 then fail_results else 0 end)
           /max(case when inst=:inst_no1 then (cr_requests+current_requests) else 0 end))    "#1.request fail%"
    ,decode(max(case when inst=:inst_no2 then (cr_requests+current_requests) else 0 end),0,0,
            max(case when inst=:inst_no2 then fail_results else 0 end)
           /max(case when inst=:inst_no2 then (cr_requests+current_requests) else 0 end))    "#2.request fail%"
    ,decode(max(case when inst=:inst_no3 then (cr_requests+current_requests) else 0 end),0,0,
            max(case when inst=:inst_no3 then fail_results else 0 end)
           /max(case when inst=:inst_no3 then (cr_requests+current_requests) else 0 end))    "#3.request fail%"
from    (
        select c.instance_number inst, c.snap_id,
               greatest(c.cr_requests - lag(c.cr_requests) over (partition by c.dbid, c.instance_number, c.con_id, s0.startup_time order by c.snap_id), 0) cr_requests,
               greatest(c.current_requests - lag(c.current_requests) over (partition by c.dbid, c.instance_number, c.con_id, s0.startup_time order by c.snap_id), 0) current_requests,
               greatest(c.fail_results - lag(c.fail_results) over (partition by c.dbid, c.instance_number, c.con_id, s0.startup_time order by c.snap_id), 0) fail_results,
               greatest(c.fairness_down_converts - lag(c.fairness_down_converts) over (partition by c.dbid, c.instance_number, c.con_id, s0.startup_time order by c.snap_id), 0) fairness_down_converts,
               greatest(c.light_works - lag(c.light_works) over (partition by c.dbid, c.instance_number, c.con_id, s0.startup_time order by c.snap_id), 0) light_works,
               greatest(c.errors - lag(c.errors) over (partition by c.dbid, c.instance_number, c.con_id, s0.startup_time order by c.snap_id), 0) errors
        from   dba_hist_cr_block_server c,
               dba_hist_snapshot s0
        where  c.dbid = s0.dbid
        and    c.instance_number = s0.instance_number
        and    c.snap_id = s0.snap_id
        and    c.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
        and    c.snap_id between :snap_fr and :snap_to
        and    c.instance_number in (:inst_no1,:inst_no2,:inst_no3)
        and    c.dbid = :dbid
        ) a,
        ( select instance_number inst_no, snap_id, snap_time, interval
            from (select instance_number, snap_id,
                         to_char(end_interval_time, 'yyyy-mm-dd hh24:mi:ss') snap_time,
                         extract(day    from (end_interval_time - lag(end_interval_time) over (partition by dbid, instance_number, startup_time order by snap_id)))*86400 +
                         extract(hour   from (end_interval_time - lag(end_interval_time) over (partition by dbid, instance_number, startup_time order by snap_id)))*3600 +
                         extract(minute from (end_interval_time - lag(end_interval_time) over (partition by dbid, instance_number, startup_time order by snap_id)))*60 +
                         extract(second from (end_interval_time - lag(end_interval_time) over (partition by dbid, instance_number, startup_time order by snap_id))) interval
                    from dba_hist_snapshot
                   where snap_id between :snap_fr and :snap_to
                     and instance_number in (:inst_no1,:inst_no2,:inst_no3)
                     and dbid = :dbid)
           where snap_id > :snap_fr
             and interval > 0
        ) b
where   a.snap_id = b.snap_id
  and   a.inst = b.inst_no
group by b.snap_id
order by b.snap_id
