      ,max(case when inst=:inst_no1 then db_block_gets+consistent_gets else 0 end) "#1.buffer gets"
      ,max(case when inst=:inst_no2 then db_block_gets+consistent_gets else 0 end) "#2.buffer gets"
      ,max(case when inst=:inst_no3 then db_block_gets+consistent_gets else 0 end) "#3.buffer gets"
      ,max(case when inst=:inst_no1 then free_buffer_wait              else 0 end) "#1.free buf wait"
      ,max(case when inst=:inst_no2 then free_buffer_wait              else 0 end) "#2.free buf wait"
      ,max(case when inst=:inst_no3 then free_buffer_wait              else 0 end) "#3.free buf wait"
      ,max(case when inst=:inst_no1 then write_complete_wait           else 0 end) "#1.wrt complete wait"
      ,max(case when inst=:inst_no2 then write_complete_wait           else 0 end) "#2.wrt complete wait"
      ,max(case when inst=:inst_no3 then write_complete_wait           else 0 end) "#3.wrt complete wait"
      ,max(case when inst=:inst_no1 then buffer_busy_wait              else 0 end) "#1.buf busy wait"
      ,max(case when inst=:inst_no2 then buffer_busy_wait              else 0 end) "#2.buf busy wait"
      ,max(case when inst=:inst_no3 then buffer_busy_wait              else 0 end) "#3.buf busy wait"
      ,max(case when inst=:inst_no1 then physical_reads                else 0 end) "#1.ph. read"
      ,max(case when inst=:inst_no2 then physical_reads                else 0 end) "#2.ph. read"
      ,max(case when inst=:inst_no3 then physical_reads                else 0 end) "#3.ph. read"
      ,max(case when inst=:inst_no1 then physical_writes               else 0 end) "#1.ph. write"
      ,max(case when inst=:inst_no2 then physical_writes               else 0 end) "#2.ph. write"
      ,max(case when inst=:inst_no3 then physical_writes               else 0 end) "#3.ph. write"
 from  (select bp.instance_number, bp.snap_id,
               bp.name, bp.block_size,
               greatest(bp.db_block_gets       - lag(bp.db_block_gets)       over (partition by bp.dbid, bp.instance_number, bp.con_id, s0.startup_time, bp.id order by bp.snap_id), 0) db_block_gets,
               greatest(bp.consistent_gets     - lag(bp.consistent_gets)     over (partition by bp.dbid, bp.instance_number, bp.con_id, s0.startup_time, bp.id order by bp.snap_id), 0) consistent_gets,
               greatest(bp.physical_reads      - lag(bp.physical_reads)      over (partition by bp.dbid, bp.instance_number, bp.con_id, s0.startup_time, bp.id order by bp.snap_id), 0) physical_reads,
               greatest(bp.physical_writes     - lag(bp.physical_writes)     over (partition by bp.dbid, bp.instance_number, bp.con_id, s0.startup_time, bp.id order by bp.snap_id), 0) physical_writes,
               greatest(bp.free_buffer_wait    - lag(bp.free_buffer_wait)    over (partition by bp.dbid, bp.instance_number, bp.con_id, s0.startup_time, bp.id order by bp.snap_id), 0) free_buffer_wait,
               greatest(bp.write_complete_wait - lag(bp.write_complete_wait) over (partition by bp.dbid, bp.instance_number, bp.con_id, s0.startup_time, bp.id order by bp.snap_id), 0) write_complete_wait,
               greatest(bp.buffer_busy_wait    - lag(bp.buffer_busy_wait)    over (partition by bp.dbid, bp.instance_number, bp.con_id, s0.startup_time, bp.id order by bp.snap_id), 0) buffer_busy_wait
          from dba_hist_buffer_pool_stat bp,
               dba_hist_snapshot s0
         where bp.dbid = s0.dbid and bp.instance_number = s0.instance_number and bp.snap_id = s0.snap_id
           and bp.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
           and bp.name = 'DEFAULT'
           and bp.snap_id between :snap_fr and :snap_to
           and bp.instance_number in (:inst_no1,:inst_no2,:inst_no3)
           and bp.dbid = :dbid
       ) v1,
       (
       select instance_number inst, snap_id, to_char(end_interval_time, 'yyyy-mm-dd hh24:mi:ss') snap_time
         from dba_hist_snapshot
        where snap_id between 1+ :snap_fr and :snap_to
          and instance_number in (:inst_no1,:inst_no2,:inst_no3)
          and dbid = :dbid
       ) sn
 where v1.snap_id(+) = sn.snap_id
   and v1.instance_number(+) = sn.inst
group by sn.snap_id
order by sn.snap_id
