[wait15_raw]
select /* awrsql */ sn.snap_id,
       to_char(sn.end_interval_time,'yyyy-mm-dd hh24:mi:ss') "Timestamp",
       v1.event_name,
       v1.wait_class "Wait Class",
       v1.delta_wait "Waits",
       v1.delta_time/1000000 "Wait Time(s)",
       decode(v1.delta_wait,  0, 0, v1.delta_time/v1.delta_wait/1000) "Avg wait(ms)",
       decode(v_dbtime.delta, 0, 0, v1.delta_time/v_dbtime.delta) "% DB time",
       v1.rank
  from    ( select *
              from (
                   select v.*,
                          row_number() over( partition by snap_id order by delta_time desc ) rank
                     from (
                          select snap_id,
                                 event_name,
                                 wait_class,
                                 greatest(nvl(total_waits - lag(total_waits) over ( partition by awr_startup_time, event_name order by snap_id), 0), 0) delta_wait,
                                 greatest(nvl(time_waited_micro - lag(time_waited_micro) over ( partition by awr_startup_time, event_name order by snap_id), 0), 0) delta_time
                            from (select t.*, s0.startup_time awr_startup_time from dba_hist_system_event t, dba_hist_snapshot s0 where t.dbid = s0.dbid and t.instance_number = s0.instance_number and t.snap_id = s0.snap_id and t.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end)
                           where wait_class != 'Idle'
                             and snap_id between :snap_fr and :snap_to
                             and instance_number = :inst_no
                             and dbid = :dbid
                           union all
                          select snap_id,
                                 decode(stat_name, 'DB CPU', 'CPU time', stat_name) event_name,
                                 'N/A' wait_class,
                                 0   delta_wait,
                                 greatest(nvl(value - lag(value) over ( partition by awr_startup_time, stat_name order by snap_id ), 0), 0)  delta_time
                            from (select t.*, s0.startup_time awr_startup_time from dba_hist_sys_time_model t, dba_hist_snapshot s0 where t.dbid = s0.dbid and t.instance_number = s0.instance_number and t.snap_id = s0.snap_id and t.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end)
                           where stat_name = 'DB CPU'
                             and snap_id between :snap_fr and :snap_to
                             and instance_number = :inst_no
                             and dbid = :dbid
                          ) v
                   )
             where rank <= 15
          ) v1,
          ( select snap_id,
                   greatest(nvl(value - lag(value) over ( partition by awr_startup_time, stat_name order by snap_id ), 0), 0)  delta
              from (select t.*, s0.startup_time awr_startup_time from dba_hist_sys_time_model t, dba_hist_snapshot s0 where t.dbid = s0.dbid and t.instance_number = s0.instance_number and t.snap_id = s0.snap_id and t.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end)
             where stat_name = 'DB time'
               and snap_id between :snap_fr and :snap_to
               and instance_number = :inst_no
               and dbid = :dbid
          ) v_dbtime,
          ( select snap_id,
                   end_interval_time
              from dba_hist_snapshot
             where snap_id between 1+ :snap_fr and :snap_to
               and instance_number = :inst_no
               and dbid = :dbid
          ) sn
 where v1.snap_id = sn.snap_id
   and v_dbtime.snap_id = sn.snap_id
 order by sn.snap_id, v1.rank
