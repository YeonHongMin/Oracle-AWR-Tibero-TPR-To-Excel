[latch]
select /* awrsql */
       s.snap_id  "SnapID",
       s.snap_time "Timestamp",
       max(decode(top_5.rank, 1, d.d_wait_time/s.interval, 0))/1000 rank1_wait_t,
       max(decode(top_5.rank, 2, d.d_wait_time/s.interval, 0))/1000 rank2_wait_t,
       max(decode(top_5.rank, 3, d.d_wait_time/s.interval, 0))/1000 rank3_wait_t,
       max(decode(top_5.rank, 4, d.d_wait_time/s.interval, 0))/1000 rank4_wait_t,
       max(decode(top_5.rank, 5, d.d_wait_time/s.interval, 0))/1000 rank5_wait_t,
       max(decode(top_5.rank, 1, decode(d.d_gets, 0, 0, d.d_misses/d.d_gets), 0)) rank1_missratio,
       max(decode(top_5.rank, 2, decode(d.d_gets, 0, 0, d.d_misses/d.d_gets), 0)) rank2_missratio,
       max(decode(top_5.rank, 3, decode(d.d_gets, 0, 0, d.d_misses/d.d_gets), 0)) rank3_missratio,
       max(decode(top_5.rank, 4, decode(d.d_gets, 0, 0, d.d_misses/d.d_gets), 0)) rank4_missratio,
       max(decode(top_5.rank, 5, decode(d.d_gets, 0, 0, d.d_misses/d.d_gets), 0)) rank5_missratio,
       max(decode(top_5.rank, 1, d.d_misses, 0)) rank1_misses,
       max(decode(top_5.rank, 2, d.d_misses, 0)) rank2_misses,
       max(decode(top_5.rank, 3, d.d_misses, 0)) rank3_misses,
       max(decode(top_5.rank, 4, d.d_misses, 0)) rank4_misses,
       max(decode(top_5.rank, 5, d.d_misses, 0)) rank5_misses
  from (select snap_id, snap_time, interval
          from (select snap_id,
                       to_char(end_interval_time,'yyyy-mm-dd hh24:mi:ss') snap_time,
                       extract(day    from (end_interval_time - lag(end_interval_time) over (partition by dbid, instance_number, startup_time order by snap_id)))*86400 +
                       extract(hour   from (end_interval_time - lag(end_interval_time) over (partition by dbid, instance_number, startup_time order by snap_id)))*3600 +
                       extract(minute from (end_interval_time - lag(end_interval_time) over (partition by dbid, instance_number, startup_time order by snap_id)))*60 +
                       extract(second from (end_interval_time - lag(end_interval_time) over (partition by dbid, instance_number, startup_time order by snap_id))) interval
                  from dba_hist_snapshot
                 where snap_id between :snap_fr and :snap_to
                   and instance_number = :inst_no
                   and dbid = :dbid)
         where snap_id > :snap_fr
           and interval > 0) s,
       (select la.snap_id, la.con_id, la.latch_hash,
               greatest(nvl(la.wait_time - lag(la.wait_time) over (partition by la.dbid, la.instance_number, la.con_id, s0.startup_time, la.latch_hash order by la.snap_id), 0), 0) d_wait_time,
               greatest(nvl(la.gets      - lag(la.gets)      over (partition by la.dbid, la.instance_number, la.con_id, s0.startup_time, la.latch_hash order by la.snap_id), 0), 0) d_gets,
               greatest(nvl(la.misses    - lag(la.misses)    over (partition by la.dbid, la.instance_number, la.con_id, s0.startup_time, la.latch_hash order by la.snap_id), 0), 0) d_misses
          from dba_hist_latch la,
               dba_hist_snapshot s0
         where la.dbid = s0.dbid and la.instance_number = s0.instance_number and la.snap_id = s0.snap_id
           and la.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
           and la.snap_id between :snap_fr and :snap_to
           and la.instance_number = :inst_no
           and la.dbid = :dbid) d,
       (select con_id, latch_hash, rownum rank
          from (select con_id, latch_hash, sum(d_wait_time) wait_tim
                  from (select la.snap_id, la.con_id, la.latch_hash,
                               greatest(nvl(la.wait_time - lag(la.wait_time) over (partition by la.dbid, la.instance_number, la.con_id, s0.startup_time, la.latch_hash order by la.snap_id), 0), 0) d_wait_time
                          from dba_hist_latch la,
                               dba_hist_snapshot s0
                         where la.dbid = s0.dbid and la.instance_number = s0.instance_number and la.snap_id = s0.snap_id
                           and la.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
                           and la.snap_id between :snap_fr and :snap_to
                           and la.instance_number = :inst_no
                           and la.dbid = :dbid)
                 where snap_id > :snap_fr
                 group by con_id, latch_hash
                 order by wait_tim desc, latch_hash)
         where rownum <= 5) top_5
 where d.snap_id > :snap_fr
   and d.latch_hash = top_5.latch_hash
   and d.con_id = top_5.con_id
   and d.snap_id = s.snap_id
 group by s.snap_id, s.snap_time
 order by s.snap_id
[latch_sql2]
select /* awrsql */ aa.lable || n.latch_name title
  from dba_hist_latch_name n,
       (select con_id, latch_hash, rownum rank
          from (select con_id, latch_hash, sum(d_wait_time) wait_tim
                  from (select la.snap_id, la.con_id, la.latch_hash,
                               greatest(nvl(la.wait_time - lag(la.wait_time) over (partition by la.dbid, la.instance_number, la.con_id, s0.startup_time, la.latch_hash order by la.snap_id), 0), 0) d_wait_time
                          from dba_hist_latch la,
                               dba_hist_snapshot s0
                         where la.dbid = s0.dbid and la.instance_number = s0.instance_number and la.snap_id = s0.snap_id
                           and la.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
                           and la.snap_id between :snap_fr and :snap_to
                           and la.instance_number = :inst_no
                           and la.dbid = :dbid)
                 where snap_id > :snap_fr
                 group by con_id, latch_hash
                 order by wait_tim desc, latch_hash)
         where rownum <= 5) top_5,
       (select 1 no, '' lable from dual union all
        select 2   , ''       from dual union all
        select 3   , 'misses: ' from dual) aa
 where top_5.latch_hash = n.latch_hash
   and top_5.con_id = n.con_id
   and n.dbid = :dbid
 order by aa.no, top_5.rank
