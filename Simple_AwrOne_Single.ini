       select 4,'%: ' from dual) a,
       (select event_name, rownum rank
          from (select event_name, sum(nvl(delta,0)) sum_delta
                  from (select se.snap_id,
                               se.event_name,
                               greatest(se.time_waited_micro - lag(se.time_waited_micro) over (partition by se.dbid, se.instance_number, se.con_id, s0.startup_time, se.event_name order by se.snap_id), 0) delta
                          from dba_hist_system_event se,
                               dba_hist_snapshot s0
                         where se.dbid = s0.dbid and se.instance_number = s0.instance_number and se.snap_id = s0.snap_id
                           and se.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
                           and se.wait_class != 'Idle'
                           and se.snap_id between :snap_fr and :snap_to
                           and se.instance_number = :inst_no
                           and se.dbid = :dbid
                        union all
                        select tm.snap_id,
                               decode(tm.stat_name, 'DB CPU', 'CPU time', tm.stat_name) event_name,
                               greatest(tm.value - lag(tm.value) over (partition by tm.dbid, tm.instance_number, tm.con_id, s0.startup_time, tm.stat_name order by tm.snap_id), 0) delta
                          from dba_hist_sys_time_model tm,
                               dba_hist_snapshot s0
                         where tm.dbid = s0.dbid and tm.instance_number = s0.instance_number and tm.snap_id = s0.snap_id
                           and tm.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
                           and tm.stat_name = 'DB CPU'
                           and tm.snap_id between :snap_fr and :snap_to
                           and tm.instance_number = :inst_no
                           and tm.dbid = :dbid)
