    sum(case when pool='shared pool'  and name='KGLNA' then bytes/1048576 else 0 end) "lib.KGLNA(M)",
    sum(case when pool='shared pool'  and name='KGLSG' then bytes/1048576 else 0 end) "lib.KGLSG(M)",
    sum(case when pool='shared pool'  and name='KGLDA' then bytes/1048576 else 0 end) "lib.KGLDA(M)",
    sum(case when pool='shared pool'  and name='KGLA'  then bytes/1048576 else 0 end) "lib.KGLA(M)",
    sum(case when pool='shared pool'  and name='KGLS'  then bytes/1048576 else 0 end) "lib.KGLS(M)",
    sum(case when pool='shared pool'  and name='PRTMV' then bytes/1048576 else 0 end) "lib.PRTMV(M)",
    sum(case when pool='shared pool'  and name='KQR L PO' then bytes/1048576 else 0 end) "lib.KQR_L_PO(M)",
    sum(case when pool='shared pool'  and name='gcs shadows' then bytes/1048576 else 0 end) "lib.ges_shad(M)",
    sum(case when pool='shared pool'  and name='gcs resources' then bytes/1048576 else 0 end) "lib.gcs_res(M)",
    sum(case when pool='shared pool'  and name='Checkpoint queue' then bytes/1048576 else 0 end) "lib.ckpt_q(M)",
    sum(case when pool='shared pool'  and name not in
                  ('SQLA','library cache','KGLH0','KGLHD','KGLNA','KGLSG','KGLDA','KGLA','KGLS','PRTMV',
                   'free memory','gcs resources','gcs shadows','Checkpoint queue','KQR L PO','SQLP')
             then bytes/1048576 else 0 end) "lib.others(M)",
    sum(case when pool='shared pool'  and name='free memory' then bytes/1048576 else 0 end) "lib.free(M)"
from    (
    select  snap_id,
            nvl(pool,'null') pool,
            name,
            bytes
    from    dba_hist_sgastat
    where   snap_id between 1+ :snap_fr and :snap_to
        and instance_number = :inst_no
        and dbid = :dbid
        and con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
    ) a,
        ( select snap_id,
                 to_char(end_interval_time, 'yyyy-mm-dd hh24:mi:ss') snap_time
            from dba_hist_snapshot
           where snap_id between 1+ :snap_fr and :snap_to
             and instance_number = :inst_no
             and dbid = :dbid
        ) b
where   a.snap_id(+) = b.snap_id
group by b.snap_id, b.snap_time
order by b.snap_id
