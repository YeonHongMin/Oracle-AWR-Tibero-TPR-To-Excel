                       to_number(null) delta_wait,
                       greatest(tm.value - lag(tm.value) over (partition by tm.dbid, tm.instance_number, tm.con_id, s0.startup_time, tm.stat_name order by tm.snap_id), 0) delta_time
                  from dba_hist_sys_time_model tm,
                       dba_hist_snapshot s0
                 where tm.dbid = s0.dbid and tm.instance_number = s0.instance_number and tm.snap_id = s0.snap_id
                   and tm.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
                   and tm.stat_name = 'DB CPU'
                   and tm.snap_id between :snap_fr and :snap_to
                   and tm.instance_number = :inst_no
                   and tm.dbid = :dbid) v_wait
         where v_wait.event_name = v_rank.event_name
           and v_wait.snap_id > :snap_fr) v1,
       (select tm.snap_id,
               greatest(tm.value - lag(tm.value) over (partition by tm.dbid, tm.instance_number, tm.con_id, s0.startup_time, tm.stat_name order by tm.snap_id), 0) delta
          from dba_hist_sys_time_model tm,
               dba_hist_snapshot s0
         where tm.dbid = s0.dbid and tm.instance_number = s0.instance_number and tm.snap_id = s0.snap_id
           and tm.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
           and tm.stat_name = 'DB time'
           and tm.snap_id between :snap_fr and :snap_to
           and tm.instance_number = :inst_no
           and tm.dbid = :dbid) v_dbtime,
       (select snap_id,
               sum(case when stat_name in ('user calls','recursive calls') then delta else 0 end) call_delta,
