[rac_gc_efficiency]
select  /*+ awrsql */  snap_id "SnapID",
       min(snap_time) "Timestamp",
       decode(max(case when inst=:inst_no and stat_name='consistent gets from cache' then delta_val else 0 end)
             +max(case when inst=:inst_no and stat_name='db block gets from cache' then delta_val else 0 end), 0, 0,
          1-((max(case when inst=:inst_no and stat_name='physical reads cache' then delta_val else 0 end)
             +max(case when inst=:inst_no and stat_name='gc cr blocks received' then delta_val else 0 end)
             +max(case when inst=:inst_no and stat_name='gc current blocks received' then delta_val else 0 end)
             )/(max(case when inst=:inst_no and stat_name='consistent gets from cache' then delta_val else 0 end)
               +max(case when inst=:inst_no and stat_name='db block gets from cache' then delta_val else 0 end)
               ))) "#1.buf.access - local cache %",
       decode(max(case when inst=:inst_no and stat_name='consistent gets from cache' then delta_val else 0 end)
             +max(case when inst=:inst_no and stat_name='db block gets from cache' then delta_val else 0 end), 0, 0,
            ((max(case when inst=:inst_no and stat_name='gc cr blocks received' then delta_val else 0 end)
             +max(case when inst=:inst_no and stat_name='gc current blocks received' then delta_val else 0 end)
             )/(max(case when inst=:inst_no and stat_name='consistent gets from cache' then delta_val else 0 end)
               +max(case when inst=:inst_no and stat_name='db block gets from cache' then delta_val else 0 end)
               ))) "#1.buf.access - remote cache %",
       decode(max(case when inst=:inst_no and stat_name='consistent gets from cache' then delta_val else 0 end)
             +max(case when inst=:inst_no and stat_name='db block gets from cache' then delta_val else 0 end), 0, 0,
             (max(case when inst=:inst_no and stat_name='physical reads cache' then delta_val else 0 end)
             /(max(case when inst=:inst_no and stat_name='consistent gets from cache' then delta_val else 0 end)
              +max(case when inst=:inst_no and stat_name='db block gets from cache' then delta_val else 0 end)
              ))) "#1.buf.access - disk %"
 from (
       select x.snap_id, x.inst, x.snap_time, x.stat_name,
               x.dval delta_val,
               case when x.secs > 0 then x.dval / x.secs else null end delta
         from (select sy.snap_id,
                      sy.instance_number inst,
                      to_char(sn.end_interval_time,'yyyy-mm-dd hh24:mi:ss') snap_time,
                      sy.stat_name,
                      nvl(sy.value,0) - nvl(lag(sy.value) over( partition by sy.awr_startup_time, sy.instance_number,sy.stat_name order by sy.snap_id ),0) dval,
                      (extract (day    from sn.end_interval_time - sn.begin_interval_time) * 86400 +
                      extract (hour   from sn.end_interval_time - sn.begin_interval_time) *  3600 +
                      extract (minute from sn.end_interval_time - sn.begin_interval_time) *    60 +
                      extract (second from sn.end_interval_time - sn.begin_interval_time)) secs
                 from (select t.*, s0.startup_time awr_startup_time from dba_hist_sysstat t, dba_hist_snapshot s0 where t.dbid = s0.dbid and t.instance_number = s0.instance_number and t.snap_id = s0.snap_id and t.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end) sy,
                      dba_hist_snapshot sn
                where sy.snap_id = sn.snap_id
                  and sy.instance_number = sn.instance_number
                  and sy.dbid = sn.dbid
                  and sy.stat_name in (
                          'consistent gets from cache',
                          'db block gets from cache',
                          'physical reads cache',
                          'gc cr blocks received',
                          'gc current blocks received'
                      )
                  and sy.snap_id between :snap_fr and :snap_to
                  and sy.instance_number = :inst_no
                  and sy.dbid = :dbid
                  and sn.snap_id between :snap_fr and :snap_to
                  and sn.instance_number = :inst_no
                  and sn.dbid = :dbid) x
      )
 where snap_id > :snap_fr
group by snap_id
order by snap_id
