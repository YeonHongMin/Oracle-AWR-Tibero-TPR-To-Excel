                 where sy.dbid = s0.dbid and sy.instance_number = s0.instance_number and sy.snap_id = s0.snap_id
                   and sy.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
                   and sy.stat_name in ('user calls', 'recursive calls', 'execute count')
                   and sy.snap_id between :snap_fr and :snap_to
                   and sy.instance_number = :inst_no
                   and sy.dbid = :dbid)
         where snap_id > :snap_fr
         group by snap_id) v_call,
       (select snap_id, end_interval_time
          from dba_hist_snapshot
         where snap_id between 1+ :snap_fr and :snap_to
           and instance_number = :inst_no
