[enq]
select /* awrsql */ sn.snap_id
      , to_char(sn.end_interval_time,'yyyy-mm-dd hh24:mi:ss') Time_stamp
      , max(decode(top_5.rank, 1, d.wait_tm, 0))/1000 rank1_wait_tm
      , max(decode(top_5.rank, 2, d.wait_tm, 0))/1000 rank2_wait_tm
      , max(decode(top_5.rank, 3, d.wait_tm, 0))/1000 rank3_wait_tm
      , max(decode(top_5.rank, 4, d.wait_tm, 0))/1000 rank4_wait_tm
      , max(decode(top_5.rank, 5, d.wait_tm, 0))/1000 rank5_wait_tm
  from (select snap_id, end_interval_time
          from dba_hist_snapshot
         where snap_id between 1+ :snap_fr and :snap_to
           and instance_number = :inst_no
           and dbid = :dbid) sn,
       (select e.snap_id, e.eq_type, e.req_reason,
               greatest(nvl(e.cum_wait_time - lag(e.cum_wait_time) over (partition by e.dbid, e.instance_number, e.con_id, s0.startup_time, e.eq_type, e.req_reason order by e.snap_id), 0), 0) wait_tm,
               greatest(nvl(e.total_wait#   - lag(e.total_wait#)   over (partition by e.dbid, e.instance_number, e.con_id, s0.startup_time, e.eq_type, e.req_reason order by e.snap_id), 0), 0) wait_cnt
          from dba_hist_enqueue_stat e,
               dba_hist_snapshot s0
         where e.dbid = s0.dbid and e.instance_number = s0.instance_number and e.snap_id = s0.snap_id
           and e.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
           and e.snap_id between :snap_fr and :snap_to
           and e.instance_number = :inst_no
           and e.dbid = :dbid) d,
       (select ety, req_reason, rownum rank
          from (select eq_type ety, req_reason, sum(wait_tm) wttm
                  from (select e.snap_id, e.eq_type, e.req_reason,
                               greatest(nvl(e.cum_wait_time - lag(e.cum_wait_time) over (partition by e.dbid, e.instance_number, e.con_id, s0.startup_time, e.eq_type, e.req_reason order by e.snap_id), 0), 0) wait_tm,
                               greatest(nvl(e.total_wait#   - lag(e.total_wait#)   over (partition by e.dbid, e.instance_number, e.con_id, s0.startup_time, e.eq_type, e.req_reason order by e.snap_id), 0), 0) wait_cnt
                          from dba_hist_enqueue_stat e,
                               dba_hist_snapshot s0
                         where e.dbid = s0.dbid and e.instance_number = s0.instance_number and e.snap_id = s0.snap_id
                           and e.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
                           and e.snap_id between :snap_fr and :snap_to
                           and e.instance_number = :inst_no
                           and e.dbid = :dbid)
                 where snap_id > :snap_fr
                 group by eq_type, req_reason
                having sum(wait_cnt) > 0
                 order by wttm desc, eq_type, req_reason)
         where rownum <= 5) top_5
 where d.snap_id > :snap_fr
   and d.eq_type = top_5.ety
   and d.req_reason = top_5.req_reason
   and d.snap_id = sn.snap_id
 group by sn.snap_id, to_char(sn.end_interval_time,'yyyy-mm-dd hh24:mi:ss')
 order by sn.snap_id
[enq_sql2]
select /* awrsql */ top_5.rank||':'||top_5.ety || '-' || to_char(nvl(l.name,' '))
            || decode(upper(top_5.req_reason), 'CONTENTION', null, '-', null, ' ('||top_5.req_reason||')') Enqueu_type
  from v$lock_type l,
       (select ety, req_reason, wttm, rownum rank
          from (select eq_type ety, req_reason, sum(wait_tm) wttm
                  from (select e.snap_id, e.eq_type, e.req_reason,
                               greatest(nvl(e.cum_wait_time - lag(e.cum_wait_time) over (partition by e.dbid, e.instance_number, e.con_id, s0.startup_time, e.eq_type, e.req_reason order by e.snap_id), 0), 0) wait_tm,
                               greatest(nvl(e.total_wait#   - lag(e.total_wait#)   over (partition by e.dbid, e.instance_number, e.con_id, s0.startup_time, e.eq_type, e.req_reason order by e.snap_id), 0), 0) wait_cnt
                          from dba_hist_enqueue_stat e,
                               dba_hist_snapshot s0
                         where e.dbid = s0.dbid and e.instance_number = s0.instance_number and e.snap_id = s0.snap_id
                           and e.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
                           and e.snap_id between :snap_fr and :snap_to
                           and e.instance_number = :inst_no
                           and e.dbid = :dbid)
                 where snap_id > :snap_fr
                 group by eq_type, req_reason
                having sum(wait_cnt) > 0
                 order by wttm desc, eq_type, req_reason)
         where rownum <= 5) top_5
 where l.type(+) = top_5.ety
