[logswitch]
select  /*+ awrsql */ to_char(trunc(first_time,'hh24'),'mm-dd hh24:mi:ss') "Switch Time"
        ,sum(case when thread#=1 then 1 else 0 end) "Thread#1"
        ,sum(case when thread#=2 then 1 else 0 end) "Thread#2"
        ,sum(case when thread#=3 then 1 else 0 end) "Thread#3"
        ,sum(case when thread#=4 then 1 else 0 end) "Thread#4"
from    v$log_history
where   first_time >= trunc(to_date(:snapdate_to,'YYYYMMDDHH24MI')-7)
  and   first_time <  trunc(to_date(:snapdate_to,'YYYYMMDDHH24MI'))+1
group by trunc(first_time,'hh24')
order by trunc(first_time,'hh24')
[logswitch2]
select  /*+ awrsql */ nvl(t.instance, 'Thread#'||d.thread#) name
from    (select 1 thread# from dual union all
         select 2 thread# from dual union all
         select 3 thread# from dual union all
         select 4 thread# from dual) d,
        v$thread t
where   d.thread# = t.thread#(+)
order by d.thread#
[log_switch_f]
select  /* awrsql */  thread#,
    sum(less5)  "Log Switch interval <= 5 min",
    sum(bet5_10)    "5 ~ 10 min",
    sum(bet10_30)   "10 ~ 30 min",
    sum(over30) "> 30 min",
    count(*)    "7-day Total"
from    (
        select
         thread#,
         case when (first_time-lag(first_time) over (partition by thread# order by first_time))*24*60 <=  5 then 1
              when (first_time-lag(first_time) over (partition by thread# order by first_time)) is null then null else 0 end less5,
         case when (first_time-lag(first_time) over (partition by thread# order by first_time))*24*60 >   5
               and (first_time-lag(first_time) over (partition by thread# order by first_time))*24*60 <= 10 then 1 else 0 end bet5_10,
         case when (first_time-lag(first_time) over (partition by thread# order by first_time))*24*60 >  10
               and (first_time-lag(first_time) over (partition by thread# order by first_time))*24*60 <= 30 then 1 else 0 end bet10_30,
         case when (first_time-lag(first_time) over (partition by thread# order by first_time))*24*60 >  30 then 1 else 0 end over30
        from v$log_history
        where first_time >= trunc(to_date(:snapdate_to,'YYYYMMDDHH24MI')-7)
          and first_time <  trunc(to_date(:snapdate_to,'YYYYMMDDHH24MI'))+1
        )
where less5 is not null
group by thread#
order by thread#
