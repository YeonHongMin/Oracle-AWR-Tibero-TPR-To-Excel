  from (
         select sn.snap_id,
                sn.end_interval_time,
                (extract(day    from (sn.end_interval_time - lag(sn.end_interval_time) over (partition by se.dbid, se.instance_number, se.con_id, sn.startup_time, se.event_name order by se.snap_id)))*86400 +
                 extract(hour   from (sn.end_interval_time - lag(sn.end_interval_time) over (partition by se.dbid, se.instance_number, se.con_id, sn.startup_time, se.event_name order by se.snap_id)))*3600 +
                 extract(minute from (sn.end_interval_time - lag(sn.end_interval_time) over (partition by se.dbid, se.instance_number, se.con_id, sn.startup_time, se.event_name order by se.snap_id)))*60 +
                 extract(second from (sn.end_interval_time - lag(sn.end_interval_time) over (partition by se.dbid, se.instance_number, se.con_id, sn.startup_time, se.event_name order by se.snap_id)))) interval,
