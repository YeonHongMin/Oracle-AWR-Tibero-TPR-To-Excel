       max(decode(r.resource_name, 'processes', current_utilization, 0)) processes_curr,
       max(decode(r.resource_name, 'processes', max_utilization, 0)) processes_max,
       max(decode(r.resource_name, 'processes', case when regexp_like(trim(r.limit_value), '^[0-9]+$') then to_number(trim(r.limit_value)) else to_number(null) end)) processes_limit,
       max(decode(r.resource_name, 'sessions', current_utilization, 0)) sessions_curr,
       max(decode(r.resource_name, 'sessions', max_utilization, 0)) sessions_max,
       max(decode(r.resource_name, 'sessions', case when regexp_like(trim(r.limit_value), '^[0-9]+$') then to_number(trim(r.limit_value)) else to_number(null) end)) sessions_limit,
       max(decode(r.resource_name, 'enqueue_locks', current_utilization, 0)) enqueue_curr,
       max(decode(r.resource_name, 'enqueue_locks', max_utilization, 0)) enqueue_max,
       max(decode(r.resource_name, 'enqueue_locks', case when regexp_like(trim(r.limit_value), '^[0-9]+$') then to_number(trim(r.limit_value)) else to_number(null) end)) enqueue_limit,
       max(decode(r.resource_name, 'max_rollback_segments', current_utilization, 0)) max_rollback_curr,
       max(decode(r.resource_name, 'max_rollback_segments', max_utilization, 0)) max_rollback_max,
       max(decode(r.resource_name, 'max_rollback_segments', case when regexp_like(trim(r.limit_value), '^[0-9]+$') then to_number(trim(r.limit_value)) else to_number(null) end)) max_rollback_limit,
       max(decode(r.resource_name, 'parallel_max_servers', current_utilization, 0)) pq_servers_curr,
       max(decode(r.resource_name, 'parallel_max_servers', max_utilization, 0)) pq_servers_max,
       max(decode(r.resource_name, 'parallel_max_servers', case when regexp_like(trim(r.limit_value), '^[0-9]+$') then to_number(trim(r.limit_value)) else to_number(null) end)) pq_servers_limit,
       max(decode(r.resource_name, 'gcs_resources', current_utilization, 0)) gcs_resources_curr,
       max(decode(r.resource_name, 'gcs_resources', max_utilization, 0)) gcs_resources_max,
       max(decode(r.resource_name, 'gcs_resources', case when regexp_like(trim(r.limit_value), '^[0-9]+$') then to_number(trim(r.limit_value)) else to_number(null) end)) gcs_resources_limit,
       max(decode(r.resource_name, 'gcs_shadows', current_utilization, 0)) gcs_shadows_curr,
       max(decode(r.resource_name, 'gcs_shadows', max_utilization, 0)) gcs_shadows_max,
       max(decode(r.resource_name, 'gcs_shadows', case when regexp_like(trim(r.limit_value), '^[0-9]+$') then to_number(trim(r.limit_value)) else to_number(null) end)) gcs_shadows_limit,
       max(decode(r.resource_name, 'ges_procs', current_utilization, 0)) ges_procs_curr,
