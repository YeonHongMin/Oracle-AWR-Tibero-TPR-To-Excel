                  from (select t.*, s0.startup_time awr_startup_time from dba_hist_sys_time_model t, dba_hist_snapshot s0 where t.dbid = s0.dbid and t.instance_number = s0.instance_number and t.snap_id = s0.snap_id and t.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end) stm,
                       dba_hist_snapshot sn
                 where stm.snap_id = sn.snap_id
                   and stm.instance_number = sn.instance_number
                   and stm.dbid = sn.dbid
                   and sn.snap_id between :snap_fr and :snap_to
                   and sn.instance_number = :inst_no
                   and sn.dbid = :dbid
               )
        )
where snap_id > :snap_fr
group by snap_id, to_char(end_interval_time,'yyyy-mm-dd hh24:mi:ss')
order by snap_id
