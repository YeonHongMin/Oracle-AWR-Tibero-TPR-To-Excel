select /*+ awrsql no_merge(v1) */
       sn.snap_id,
       to_char(sn.end_interval_time,'yyyy-mm-dd hh24:mi:ss') "Timestamp",
       nvl(v_dbtime.delta,0)/1000000 "DB time",
       decode(nvl(v_call.call_delta,0), 0, 0, (nvl(v_dbtime.delta,0)/1000)/v_call.call_delta) "db time per call",
       decode(nvl(v_call.exec_delta,0), 0, 0, (nvl(v_dbtime.delta,0)/1000)/v_call.exec_delta) "db time per execute",
       max(decode(rank,  1, v1.delta_wait, 0)) wait_1,
       max(decode(rank,  2, v1.delta_wait, 0)) wait_2,
       max(decode(rank,  3, v1.delta_wait, 0)) wait_3,
       max(decode(rank,  4, v1.delta_wait, 0)) wait_4,
       max(decode(rank,  5, v1.delta_wait, 0)) wait_5,
       max(decode(rank,  1, v1.delta_time/1000000, 0)) time_1,
       max(decode(rank,  2, v1.delta_time/1000000, 0)) time_2,
       max(decode(rank,  3, v1.delta_time/1000000, 0)) time_3,
       max(decode(rank,  4, v1.delta_time/1000000, 0)) time_4,
       max(decode(rank,  5, v1.delta_time/1000000, 0)) time_5,
       max(decode(rank,  1, v1.avg_wait, 0)) avg_wait_1,
       max(decode(rank,  2, v1.avg_wait, 0)) avg_wait_2,
       max(decode(rank,  3, v1.avg_wait, 0)) avg_wait_3,
       max(decode(rank,  4, v1.avg_wait, 0)) avg_wait_4,
       max(decode(rank,  5, v1.avg_wait, 0)) avg_wait_5,
       max(decode(rank,  1, decode(nvl(v_dbtime.delta,0), 0, 0, nvl(v1.delta_time,0)/v_dbtime.delta), 0)) pctwait_1,
       max(decode(rank,  2, decode(nvl(v_dbtime.delta,0), 0, 0, nvl(v1.delta_time,0)/v_dbtime.delta), 0)) pctwait_2,
       max(decode(rank,  3, decode(nvl(v_dbtime.delta,0), 0, 0, nvl(v1.delta_time,0)/v_dbtime.delta), 0)) pctwait_3,
       max(decode(rank,  4, decode(nvl(v_dbtime.delta,0), 0, 0, nvl(v1.delta_time,0)/v_dbtime.delta), 0)) pctwait_4,
       max(decode(rank,  5, decode(nvl(v_dbtime.delta,0), 0, 0, nvl(v1.delta_time,0)/v_dbtime.delta), 0)) pctwait_5
  from (select v_wait.snap_id,
               v_rank.rank,
               v_wait.event_name,
               v_wait.delta_wait,
               v_wait.delta_time,
               decode(nvl(v_wait.delta_wait,0), 0, 0, v_wait.delta_time/v_wait.delta_wait/1000) avg_wait
          from (select event_name, rownum rank
                  from (select event_name, sum(nvl(delta,0)) sum_delta
                          from (select se.snap_id,
                                       se.event_name,
                                       greatest(se.time_waited_micro - lag(se.time_waited_micro) over (partition by se.dbid, se.instance_number, se.con_id, s0.startup_time, se.event_name order by se.snap_id), 0) delta
                                  from dba_hist_system_event se,
                                       dba_hist_snapshot s0
                                 where se.dbid = s0.dbid and se.instance_number = s0.instance_number and se.snap_id = s0.snap_id
                                   and se.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
                                   and se.wait_class != 'Idle'
                                   and se.snap_id between :snap_fr and :snap_to
                                   and se.instance_number = :inst_no
                                   and se.dbid = :dbid
                                union all
                                select tm.snap_id,
                                       decode(tm.stat_name, 'DB CPU', 'CPU time', tm.stat_name) event_name,
                                       greatest(tm.value - lag(tm.value) over (partition by tm.dbid, tm.instance_number, tm.con_id, s0.startup_time, tm.stat_name order by tm.snap_id), 0) delta
                                  from dba_hist_sys_time_model tm,
                                       dba_hist_snapshot s0
                                 where tm.dbid = s0.dbid and tm.instance_number = s0.instance_number and tm.snap_id = s0.snap_id
                                   and tm.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
                                   and tm.stat_name = 'DB CPU'
                                   and tm.snap_id between :snap_fr and :snap_to
                                   and tm.instance_number = :inst_no
                                   and tm.dbid = :dbid)
                         where snap_id > :snap_fr
                         group by event_name
                         order by sum_delta desc, event_name)
                 where rownum <= 5) v_rank,
               (select se.snap_id,
                       se.event_name,
                       greatest(se.total_waits - lag(se.total_waits) over (partition by se.dbid, se.instance_number, se.con_id, s0.startup_time, se.event_name order by se.snap_id), 0) delta_wait,
                       greatest(se.time_waited_micro - lag(se.time_waited_micro) over (partition by se.dbid, se.instance_number, se.con_id, s0.startup_time, se.event_name order by se.snap_id), 0) delta_time
                  from dba_hist_system_event se,
                       dba_hist_snapshot s0
                 where se.dbid = s0.dbid and se.instance_number = s0.instance_number and se.snap_id = s0.snap_id
                   and se.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
                   and se.wait_class != 'Idle'
                   and se.snap_id between :snap_fr and :snap_to
                   and se.instance_number = :inst_no
                   and se.dbid = :dbid
                union all
                select tm.snap_id,
                       decode(tm.stat_name, 'DB CPU', 'CPU time', tm.stat_name) event_name,
                       to_number(null) delta_wait,
                       greatest(tm.value - lag(tm.value) over (partition by tm.dbid, tm.instance_number, tm.con_id, s0.startup_time, tm.stat_name order by tm.snap_id), 0) delta_time
                  from dba_hist_sys_time_model tm,
                       dba_hist_snapshot s0
                 where tm.dbid = s0.dbid and tm.instance_number = s0.instance_number and tm.snap_id = s0.snap_id
                   and tm.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
                   and tm.stat_name = 'DB CPU'
                   and tm.snap_id between :snap_fr and :snap_to
                   and tm.instance_number = :inst_no
                   and tm.dbid = :dbid) v_wait
         where v_wait.event_name = v_rank.event_name
           and v_wait.snap_id > :snap_fr) v1,
       (select tm.snap_id,
               greatest(tm.value - lag(tm.value) over (partition by tm.dbid, tm.instance_number, tm.con_id, s0.startup_time, tm.stat_name order by tm.snap_id), 0) delta
          from dba_hist_sys_time_model tm,
               dba_hist_snapshot s0
         where tm.dbid = s0.dbid and tm.instance_number = s0.instance_number and tm.snap_id = s0.snap_id
           and tm.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
           and tm.stat_name = 'DB time'
           and tm.snap_id between :snap_fr and :snap_to
           and tm.instance_number = :inst_no
           and tm.dbid = :dbid) v_dbtime,
       (select snap_id,
               sum(case when stat_name in ('user calls','recursive calls') then delta else 0 end) call_delta,
               sum(case when stat_name = 'execute count' then delta else 0 end) exec_delta
          from (select sy.snap_id, sy.stat_name,
                       greatest(sy.value - lag(sy.value) over (partition by sy.dbid, sy.instance_number, sy.con_id, s0.startup_time, sy.stat_name order by sy.snap_id), 0) delta
                  from dba_hist_sysstat sy,
