[libcache]
select  /* awrsql */  b.snap_id     "SnapID",
        b.snap_time   "Timestamp",
    max(decode(namespace,'SQL AREA',reloads,0))        "reload: sql",
    max(decode(namespace,'TABLE/PROCEDURE',reloads,0)) "reload: tab/proc",
    max(decode(namespace,'TRIGGER',reloads,0))         "reload: trg",
    max(decode(namespace,'BODY',reloads,0))            "reload: body",
    max(decode(namespace,'SQL AREA',invalidations,0))        "invalid: sql",
    max(decode(namespace,'TABLE/PROCEDURE',invalidations,0)) "invalid: tab/proc",
    max(decode(namespace,'TRIGGER',invalidations,0))         "invalid: trg",
    max(decode(namespace,'BODY',invalidations,0))            "invalid: body"
from    (
    select  snap_id,
            namespace,
            gets-lag(gets,1) over (partition by awr_startup_time, namespace order by namespace,snap_id) gets,
        gethits-lag(gethits,1) over (partition by awr_startup_time, namespace order by namespace,snap_id) gethits,
        pins-lag(pins,1) over (partition by awr_startup_time, namespace order by namespace,snap_id) pins,
        pinhits-lag(pinhits,1) over (partition by awr_startup_time, namespace order by namespace,snap_id) pinhits,
        reloads-lag(reloads,1) over (partition by awr_startup_time, namespace order by namespace,snap_id) reloads,
        invalidations-lag(invalidations,1) over (partition by awr_startup_time, namespace order by namespace,snap_id) invalidations
    from (select t.*, s0.startup_time awr_startup_time from dba_hist_librarycache t, dba_hist_snapshot s0 where t.dbid = s0.dbid and t.instance_number = s0.instance_number and t.snap_id = s0.snap_id and t.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end)
    where snap_id between :snap_fr and :snap_to
          and instance_number = :inst_no
          and dbid = :dbid
          and namespace in ('SQL AREA','TABLE/PROCEDURE','TRIGGER','BODY')
    ) a,
        ( select snap_id,
                 to_char(end_interval_time, 'yyyy-mm-dd hh24:mi:ss') snap_time
            from dba_hist_snapshot
           where snap_id between 1+ :snap_fr and :snap_to
             and instance_number = :inst_no
             and dbid = :dbid
        ) b
where   a.snap_id=b.snap_id
group by b.snap_id, b.snap_time
order by b.snap_time
