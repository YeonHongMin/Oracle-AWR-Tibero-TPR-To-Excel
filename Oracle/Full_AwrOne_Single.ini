                         where se.dbid = s0.dbid and se.instance_number = s0.instance_number and se.snap_id = s0.snap_id
                           and se.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
                           and se.wait_class != 'Idle'
                           and se.snap_id between :snap_fr and :snap_to
                           and se.instance_number = :inst_no
                           and se.dbid = :dbid
                        union all
                        select tm.snap_id,
