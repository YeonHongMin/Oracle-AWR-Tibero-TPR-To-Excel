[bufpool_other]
select  /* awrsql */ snap_id "SnapID"
      , snap_time "Timestamp"
      , block_size/1024||'k'||substr(name,1,1) "Pools"
      , lpad(case
              when set_msize <= 9999 then to_char(set_msize)||' '
              when trunc(set_msize/1000) <= 9999 then to_char(trunc(set_msize/1000))||'K'
              when trunc(set_msize/1000000) <= 9999 then to_char(trunc(set_msize/1000000))||'M'
              when trunc(set_msize/1000000000) <= 9999 then to_char(trunc(set_msize/1000000000))||'G'
              when trunc(set_msize/1000000000000) <= 9999 then to_char(trunc(set_msize/1000000000000))||'T'
              else substr(to_char(trunc(set_msize/1000000000000000))||'P', 1, 5) end, 7, ' ') "numbufs"
      , decode(d_gets, 0, 0, 1 - (d_phr / d_gets)) "%Hit"
      , d_gets "buffer gets"
      , d_phr  "ph. read"
      , d_phw  "ph. write"
      , d_fbw  "free buffer wait"
      , d_wcw  "write complete wait"
      , d_bbw  "buffer busy wait"
  from (select bp.snap_id,
               to_char(s0.end_interval_time,'yyyy-mm-dd hh24:mi:ss') snap_time,
               bp.block_size, bp.name, bp.set_msize,
               greatest(nvl(bp.db_block_gets       - lag(bp.db_block_gets)       over (partition by bp.dbid, bp.instance_number, bp.con_id, s0.startup_time, bp.id order by bp.snap_id), 0), 0)
             + greatest(nvl(bp.consistent_gets     - lag(bp.consistent_gets)     over (partition by bp.dbid, bp.instance_number, bp.con_id, s0.startup_time, bp.id order by bp.snap_id), 0), 0) d_gets,
               greatest(nvl(bp.physical_reads      - lag(bp.physical_reads)      over (partition by bp.dbid, bp.instance_number, bp.con_id, s0.startup_time, bp.id order by bp.snap_id), 0), 0) d_phr,
               greatest(nvl(bp.physical_writes     - lag(bp.physical_writes)     over (partition by bp.dbid, bp.instance_number, bp.con_id, s0.startup_time, bp.id order by bp.snap_id), 0), 0) d_phw,
               greatest(nvl(bp.free_buffer_wait    - lag(bp.free_buffer_wait)    over (partition by bp.dbid, bp.instance_number, bp.con_id, s0.startup_time, bp.id order by bp.snap_id), 0), 0) d_fbw,
               greatest(nvl(bp.write_complete_wait - lag(bp.write_complete_wait) over (partition by bp.dbid, bp.instance_number, bp.con_id, s0.startup_time, bp.id order by bp.snap_id), 0), 0) d_wcw,
               greatest(nvl(bp.buffer_busy_wait    - lag(bp.buffer_busy_wait)    over (partition by bp.dbid, bp.instance_number, bp.con_id, s0.startup_time, bp.id order by bp.snap_id), 0), 0) d_bbw
          from dba_hist_buffer_pool_stat bp,
               dba_hist_snapshot s0
         where bp.dbid = s0.dbid and bp.instance_number = s0.instance_number and bp.snap_id = s0.snap_id
           and bp.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
           and bp.snap_id between :snap_fr and :snap_to
           and bp.instance_number = :inst_no
           and bp.dbid = :dbid
           and substr(bp.name,1,1) <> 'D')
 where snap_id > :snap_fr
 order by snap_id, name
