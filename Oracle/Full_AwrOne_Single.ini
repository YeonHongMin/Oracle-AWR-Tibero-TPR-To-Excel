[param_diff]
select  /* awrsql */ b.snap_id     "SnapID",
        b.snap_time   "Timestamp",
        a.parameter_name "parameter",
        nvl(a.pre_value,'null') "value(before)",
        nvl(a.value,'null') "value"
from    (
        select snap_id, parameter_name, value, pre_value
          from (select /*+ index_rs(p) */ p.snap_id, p.parameter_name, p.value,
                       lag(p.value,1) over (partition by p.con_id, p.parameter_name order by p.snap_id) pre_value,
                       max(case when p.ismodified <> 'FALSE' then 1 else 0 end) over (partition by p.con_id, p.parameter_name) ever_mod
                  from dba_hist_parameter p
                 where p.snap_id between :snap_fr and :snap_to
                   and p.instance_number = :inst_no
                   and p.dbid = :dbid
                   and (p.con_id in (0, 1) or p.con_id = to_number(sys_context('USERENV','CON_ID'))))
         where ever_mod = 1
        ) a,
        ( select snap_id,
                 to_char(end_interval_time, 'yyyy-mm-dd hh24:mi:ss') snap_time
            from dba_hist_snapshot
           where snap_id between :snap_fr and :snap_to
             and instance_number = :inst_no
             and dbid = :dbid
        ) b
where   a.snap_id = b.snap_id
  and   a.pre_value is not null
  and   a.value <> a.pre_value
  and   a.snap_id > :snap_fr
