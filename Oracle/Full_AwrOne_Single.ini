       decode(max(decode(name, 'ges msgs received',        delta_dm_val, 0)), 0, 0,
             (max(decode(name, 'ges msgs process time(ms)',delta_dm_val, 0))
             /max(decode(name, 'ges msgs received',        delta_dm_val, 0)))
             ) "Avg GES msg process time(ms)",
       decode(max(decode(name, 'messages sent directly',   delta_dm_val, 0)) +
              max(decode(name, 'messages sent indirectly', delta_dm_val, 0)) +
              max(decode(name, 'messages flow controlled', delta_dm_val, 0)), 0, 0,
             (max(decode(name, 'messages sent directly',   delta_dm_val, 0))
            /(max(decode(name, 'messages sent directly',   delta_dm_val, 0)) +
              max(decode(name, 'messages sent indirectly', delta_dm_val, 0)) +
              max(decode(name, 'messages flow controlled', delta_dm_val, 0))))
             ) "% of direct sent msgs",
       decode(max(decode(name, 'messages sent directly',   delta_dm_val, 0)) +
              max(decode(name, 'messages sent indirectly', delta_dm_val, 0)) +
              max(decode(name, 'messages flow controlled', delta_dm_val, 0)), 0, 0,
             (max(decode(name, 'messages sent indirectly', delta_dm_val, 0))
            /(max(decode(name, 'messages sent directly',   delta_dm_val, 0)) +
              max(decode(name, 'messages sent indirectly', delta_dm_val, 0)) +
              max(decode(name, 'messages flow controlled', delta_dm_val, 0))))
             ) "% of indirect sent msgs",
       decode(max(decode(name, 'messages sent directly',   delta_dm_val, 0)) +
              max(decode(name, 'messages sent indirectly', delta_dm_val, 0)) +
              max(decode(name, 'messages flow controlled', delta_dm_val, 0)), 0, 0,
             (max(decode(name, 'messages flow controlled', delta_dm_val, 0))
            /(max(decode(name, 'messages sent directly',   delta_dm_val, 0)) +
              max(decode(name, 'messages sent indirectly', delta_dm_val, 0)) +
              max(decode(name, 'messages flow controlled', delta_dm_val, 0))))
             ) "% of flow controlled msgs",
       max(case when name='messages sent directly'   then delta_dm_val else 0 end) "msg(direct)",
       max(case when name='messages sent indirectly' then delta_dm_val else 0 end) "msg(indirect)",
       max(case when name='messages flow controlled' then delta_dm_val else 0 end) "msg(controlled)"
 from (
       select y.snap_id snap_id,
              y.inst inst,
              y.snap_time snap_time,
              y.end_interval_time end_interval_time,
              cast(null as varchar2(64)) stat_name,
              cast(null as number) delta_val,
              cast(null as number) delta,
              y.name name,
              y.dval delta_dm_val,
              case when y.secs > 0 then y.dfull / y.secs else null end delta_dm,
              cast(null as number) delta_cbs,
              cast(null as number) delta_cusf1,
              cast(null as number) delta_cusf10,
              cast(null as number) delta_cusf100,
              cast(null as number) delta_cusf1000,
              cast(null as number) delta_cusf10000
         from (select dm.snap_id,
                      dm.instance_number inst,
                      to_char(sn.end_interval_time,'yyyy-mm-dd hh24:mi:ss') snap_time,
                      sn.end_interval_time,
                      dm.name,
                      greatest(nvl(dm.value - lag(dm.value) over( partition by dm.awr_startup_time, dm.instance_number,dm.name order by dm.snap_id ), 0), 0) dval,
                      nvl(dm.value,0) - nvl(lag(dm.value) over( partition by dm.awr_startup_time, dm.instance_number,dm.name order by dm.snap_id ),0) dfull,
                      (extract (day    from sn.end_interval_time - sn.begin_interval_time) * 86400 +
                      extract (hour   from sn.end_interval_time - sn.begin_interval_time) *  3600 +
                      extract (minute from sn.end_interval_time - sn.begin_interval_time) *    60 +
                      extract (second from sn.end_interval_time - sn.begin_interval_time)) secs
                 from (select t.*, s0.startup_time awr_startup_time from dba_hist_dlm_misc t, dba_hist_snapshot s0 where t.dbid = s0.dbid and t.instance_number = s0.instance_number and t.snap_id = s0.snap_id and t.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end) dm,
                            dba_hist_snapshot sn
                       where dm.snap_id = sn.snap_id
                         and dm.instance_number = sn.instance_number
                         and dm.dbid = sn.dbid
                         and dm.name in (
                          'messages sent directly',
                          'messages flow controlled',
                          'messages sent indirectly',
                          'gcs msgs received',
                          'gcs msgs process time(ms)',
                          'ges msgs received',
                          'ges msgs process time(ms)',
                          'msgs sent queued',
                          'msgs sent queue time (ms)',
                          'msgs sent queued on ksxp',
                          'msgs sent queue time on ksxp (ms)',
                          'msgs received queue time (ms)',
                          'msgs received queued'
                             )
                          and dm.snap_id between :snap_fr and :snap_to
                          and dm.instance_number = :inst_no
                          and dm.dbid = :dbid
                          and sn.snap_id between :snap_fr and :snap_to
                          and sn.instance_number = :inst_no
                          and sn.dbid = :dbid) y
      )
 where snap_id > :snap_fr
group by snap_id, to_char(end_interval_time,'yyyy-mm-dd hh24:mi:ss')
order by snap_id
[rac_gesstat]
SQL1=rac_gesstat_sql,rac_gesstat,[1.1],TRUE
FORMAT1=rac_gesstat^[1.4:E.4]^###,##0
FORMAT2=rac_gesstat^[1.5:E.5]^###,##0.0
[rac_gesstat]
select  /* awrsql */ b.snap_id   "SnapID",
        b.snap_time "Timestamp",
        a.name      "GES Statistic",
        a.value     "Value",
        case when b.interval > 0 and a.value is not null then a.value / b.interval else null end "perSecond"
from    (
        select d.snap_id, d.name,
               case when (d.value - lag(d.value,1) over (partition by d.dbid, d.instance_number, d.con_id, s0.startup_time, d.name order by d.snap_id)) >= 0
                     and (d.value - lag(d.value,1) over (partition by d.dbid, d.instance_number, d.con_id, s0.startup_time, d.name order by d.snap_id)) < 1e15
                    then d.value - lag(d.value,1) over (partition by d.dbid, d.instance_number, d.con_id, s0.startup_time, d.name order by d.snap_id)
                    else null end value
          from dba_hist_dlm_misc d,
               dba_hist_snapshot s0
         where d.dbid = s0.dbid and d.instance_number = s0.instance_number and d.snap_id = s0.snap_id
           and d.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
           and d.name in ('messages sent directly','messages sent indirectly','messages sent pbatched',
                          'messages received actual','gcs msgs received','ges msgs received',
                          'messages flow controlled','flow control messages sent','flow control messages received',
                          'msgs sent queue time (ms)','msgs received queue time (ms)',
                          'msgs sent queue time on ksxp (ms)','msgs received kernel queue time (ns)')
           and d.snap_id between :snap_fr and :snap_to
           and d.instance_number = :inst_no
           and d.dbid = :dbid
        ) a,
        ( select snap_id, snap_time, interval
            from (select snap_id,
                         to_char(end_interval_time, 'yyyy-mm-dd hh24:mi:ss') snap_time,
                         extract (day    from (end_interval_time - lag(end_interval_time) over (partition by dbid, instance_number, startup_time order by snap_id)))* 86400 +
                         extract (hour   from (end_interval_time - lag(end_interval_time) over (partition by dbid, instance_number, startup_time order by snap_id)))*  3600 +
                         extract (minute from (end_interval_time - lag(end_interval_time) over (partition by dbid, instance_number, startup_time order by snap_id)))*    60 +
                         extract (second from (end_interval_time - lag(end_interval_time) over (partition by dbid, instance_number, startup_time order by snap_id))) interval
                    from dba_hist_snapshot
                   where snap_id between :snap_fr and :snap_to
                     and instance_number = :inst_no
                     and dbid = :dbid)
           where snap_id > :snap_fr
        ) b
where   a.snap_id = b.snap_id
order by a.name, b.snap_id
