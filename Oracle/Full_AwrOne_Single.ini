[undo]
select  /* awrsql */  e.snap_id "SnapID"
     , to_char(s.end_interval_time,'yyyy-mm-dd hh24:mi:ss') "Timestamp"
     , undotsn "Undo TS#"
     , sum(undoblks)/1000           "undoblks(K)"
     , sum(txncount)                "tx cnt"
     , max(maxquerylen)             "Max Qry Len (s)"
     , max(maxconcurrency)          "Max Tx Concy"
     ,         round(min(tuned_undoretention)/60,1)
       ||'/'|| round(max(tuned_undoretention)/60,1)   "Min/Max TR (mins)"
     ,         sum(ssolderrcnt)
       ||'/'|| sum(nospaceerrcnt)            "STO/OOS"
     ,         sum(unxpstealcnt)
       ||'/'|| sum(unxpblkrelcnt)
       ||'/'|| sum(unxpblkreucnt)
       ||'/'|| sum(expstealcnt)
       ||'/'|| sum(expblkrelcnt)
       ||'/'|| sum(expblkreucnt)    "uS/uR/uU/eS/eR/eU"
      ,sum(ssolderrcnt)  "snapshot too old"
      ,sum(nospaceerrcnt) "out of space"
      ,max(MAXQUERYSQLID) "sql_id(long query)"
  from (select * from dba_hist_undostat where con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end) e
      ,DBA_HIST_SNAPSHOT S
 where e.dbid            = :dbid
   and e.instance_number = :inst_no
   and e.snap_id    between :snap_fr and :snap_to
   and e.snap_id = s.snap_id
   and s.INSTANCE_NUMBER = :inst_no
   and s.dbid = :dbid
   and s.snap_id between 1+ :snap_fr and :snap_to
 group by e.snap_id,to_char(s.end_interval_time,'yyyy-mm-dd hh24:mi:ss'),undotsn
 order by e.snap_id
