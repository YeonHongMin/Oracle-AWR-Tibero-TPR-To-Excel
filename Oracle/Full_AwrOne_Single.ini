           fairness_down_converts-lag(fairness_down_converts) over (order by snap_id) fairness_down_converts,
           flushes-lag(flushes) over (order by snap_id) flushes,
           light_works-lag(light_works) over (order by snap_id) light_works,
           errors-lag(errors) over (order by snap_id) errors
        from (select t.*, s0.startup_time awr_startup_time from dba_hist_cr_block_server t, dba_hist_snapshot s0 where t.dbid = s0.dbid and t.instance_number = s0.instance_number and t.snap_id = s0.snap_id and t.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end)
        where  snap_id between :snap_fr and :snap_to
        and    instance_number = :inst_no
        and    dbid = :dbid
        ) a,
        ( select snap_id,
                 to_char(end_interval_time, 'yyyy-mm-dd hh24:mi:ss') snap_time
            from dba_hist_snapshot
           where snap_id between 1+ :snap_fr and :snap_to
             and instance_number = :inst_no
             and dbid = :dbid
        ) b
where   a.snap_id=b.snap_id
order by snap_time
