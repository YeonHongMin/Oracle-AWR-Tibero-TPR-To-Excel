select  /*+ awrsql */ ev.snap_id "SnapID",
        to_char(sn.end_interval_time,'yyyy-mm-dd hh24:mi:ss') "Timestamp",
        nvl(ev.lfs_s,0)    "log file sync s",
        nvl(ev.lfpw_s,0)   "log par write s",
        nvl(ev.lbs_s,0)    "log buffer space s",
        nvl(ev.lswc_s,0)   "lsw ckpt incompl s",
        nvl(ev.lswa_s,0)   "lsw arch needed s",
        nvl(ev.lswcmp_s,0) "lsw completion s",
        nvl(ev.lfsr_s,0)   "log seq read s",
        nvl(ev.larch_s,0)  "Log archive IO s",
        nvl(ev.lgwrc_s,0)  "LGWR redo copy s",
        nvl(ev.gcsfs_s,0)  "gcs log flush sync s",
        nvl(ev.lral_s,0)   "latch redo alloc s",
        nvl(ev.lrwr_s,0)   "latch redo write s",
        nvl(ev.lfs_ms,0)   "log file sync ms",
        nvl(ev.lfpw_ms,0)  "log par write ms",
        nvl(ev.lbs_ms,0)   "log buffer space ms",
        nvl(ev.lswc_ms,0)  "lsw ckpt incompl ms",
        nvl(ev.lswa_ms,0)  "lsw arch needed ms",
        nvl(ev.lswcmp_ms,0)"lsw completion ms",
        nvl(ev.lfsr_ms,0)  "log seq read ms",
        nvl(ev.larch_ms,0) "Log archive IO ms",
        nvl(ev.lgwrc_ms,0) "LGWR redo copy ms",
        nvl(ev.gcsfs_ms,0) "gcs log flush sync ms",
        nvl(ev.lral_ms,0)  "latch redo alloc ms",
        nvl(ev.lrwr_ms,0)  "latch redo write ms",
        nvl(st.redo_mb,0)  "redo MB",
        nvl(st.wast_mb,0)  "wastage MB",
        nvl(st.synch_s,0)  "redo synch s",
        nvl(st.lsrw_s,0)   "log space wait s"
from   dba_hist_snapshot sn,
       (select snap_id,
               max(decode(event_name,'log file sync',                           t_us/1000000,0)) lfs_s,
               max(decode(event_name,'log file parallel write',                 t_us/1000000,0)) lfpw_s,
               max(decode(event_name,'log buffer space',                        t_us/1000000,0)) lbs_s,
               max(decode(event_name,'log file switch (checkpoint incomplete)', t_us/1000000,0)) lswc_s,
               max(decode(event_name,'log file switch (archiving needed)',      t_us/1000000,0)) lswa_s,
               max(decode(event_name,'log file switch completion',              t_us/1000000,0)) lswcmp_s,
               max(decode(event_name,'log file sequential read',                t_us/1000000,0)) lfsr_s,
               max(decode(event_name,'Log archive I/O',                         t_us/1000000,0)) larch_s,
               max(decode(event_name,'LGWR wait for redo copy',                 t_us/1000000,0)) lgwrc_s,
               max(decode(event_name,'gcs log flush sync',                      t_us/1000000,0)) gcsfs_s,
               max(decode(event_name,'latch: redo allocation',                  t_us/1000000,0)) lral_s,
               max(decode(event_name,'latch: redo writing',                     t_us/1000000,0)) lrwr_s,
               max(decode(event_name,'log file sync',                           decode(w_dlt,0,0,t_us/w_dlt/1000),0)) lfs_ms,
               max(decode(event_name,'log file parallel write',                 decode(w_dlt,0,0,t_us/w_dlt/1000),0)) lfpw_ms,
               max(decode(event_name,'log buffer space',                        decode(w_dlt,0,0,t_us/w_dlt/1000),0)) lbs_ms,
               max(decode(event_name,'log file switch (checkpoint incomplete)', decode(w_dlt,0,0,t_us/w_dlt/1000),0)) lswc_ms,
               max(decode(event_name,'log file switch (archiving needed)',      decode(w_dlt,0,0,t_us/w_dlt/1000),0)) lswa_ms,
               max(decode(event_name,'log file switch completion',              decode(w_dlt,0,0,t_us/w_dlt/1000),0)) lswcmp_ms,
               max(decode(event_name,'log file sequential read',                decode(w_dlt,0,0,t_us/w_dlt/1000),0)) lfsr_ms,
               max(decode(event_name,'Log archive I/O',                         decode(w_dlt,0,0,t_us/w_dlt/1000),0)) larch_ms,
               max(decode(event_name,'LGWR wait for redo copy',                 decode(w_dlt,0,0,t_us/w_dlt/1000),0)) lgwrc_ms,
               max(decode(event_name,'gcs log flush sync',                      decode(w_dlt,0,0,t_us/w_dlt/1000),0)) gcsfs_ms,
               max(decode(event_name,'latch: redo allocation',                  decode(w_dlt,0,0,t_us/w_dlt/1000),0)) lral_ms,
               max(decode(event_name,'latch: redo writing',                     decode(w_dlt,0,0,t_us/w_dlt/1000),0)) lrwr_ms
        from   (select se.snap_id,
                       se.event_name,
                       greatest(se.time_waited_micro - lag(se.time_waited_micro) over (partition by se.dbid, se.instance_number, se.con_id, s0.startup_time, se.event_name order by se.snap_id), 0) t_us,
                       greatest(se.total_waits - lag(se.total_waits) over (partition by se.dbid, se.instance_number, se.con_id, s0.startup_time, se.event_name order by se.snap_id), 0) w_dlt
                from   dba_hist_system_event se,
                       dba_hist_snapshot s0
                where  se.dbid = s0.dbid and se.instance_number = s0.instance_number and se.snap_id = s0.snap_id
                  and  se.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
                  and  se.event_name in ('log file sync','log file parallel write','log buffer space',
                                         'log file switch (checkpoint incomplete)','log file switch (archiving needed)',
                                         'log file switch completion','log file sequential read','Log archive I/O',
                                         'LGWR wait for redo copy','gcs log flush sync',
                                         'latch: redo allocation','latch: redo writing')
                  and  se.snap_id between :snap_fr and :snap_to
                  and  se.instance_number = :inst_no
                  and  se.dbid = :dbid)
        where  snap_id > :snap_fr
        group  by snap_id) ev,
       (select snap_id,
               max(decode(stat_name,'redo size',                dlt/1048576,0)) redo_mb,
               max(decode(stat_name,'redo wastage',             dlt/1048576,0)) wast_mb,
               max(decode(stat_name,'redo synch time (usec)',   dlt/1000000,0)) synch_s,
               max(decode(stat_name,'redo log space wait time', dlt/100,0))     lsrw_s
        from   (select ss.snap_id,
                       ss.stat_name,
                       greatest(ss.value - lag(ss.value) over (partition by ss.dbid, ss.instance_number, ss.con_id, s0.startup_time, ss.stat_name order by ss.snap_id), 0) dlt
                from   dba_hist_sysstat ss,
                       dba_hist_snapshot s0
                where  ss.dbid = s0.dbid and ss.instance_number = s0.instance_number and ss.snap_id = s0.snap_id
                  and  ss.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
                  and  ss.stat_name in ('redo size','redo wastage','redo synch time (usec)','redo log space wait time')
                  and  ss.snap_id between :snap_fr and :snap_to
                  and  ss.instance_number = :inst_no
                  and  ss.dbid = :dbid)
        where  snap_id > :snap_fr
        group  by snap_id) st
where  sn.snap_id = ev.snap_id(+)
  and  sn.snap_id = st.snap_id(+)
  and  sn.dbid = :dbid
  and  sn.instance_number = :inst_no
  and  sn.snap_id > :snap_fr
  and  sn.snap_id <= :snap_to
order  by sn.snap_id
