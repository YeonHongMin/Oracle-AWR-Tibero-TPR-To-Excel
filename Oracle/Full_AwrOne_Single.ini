[service_stat_sql2]
select /* awrsql */ decode(service_name,null,'N/A','SYS$BACKGROUND','SYS$B/G',service_name) title
  from
     ( select service_name, sum(nvl(delta,0))
         from
            ( select snap_id,
                     service_name,
                     greatest(nvl(value - lag(value)
                              over ( partition by con_id, awr_startup_time, service_name order by snap_id), 0), 0) delta
                from (select t.*, s0.startup_time awr_startup_time from dba_hist_service_stat t, dba_hist_snapshot s0 where t.dbid = s0.dbid and t.instance_number = s0.instance_number and t.snap_id = s0.snap_id)
               where stat_name = 'DB time'
                 and snap_id between :snap_fr and :snap_to
                 and instance_number = :inst_no
                 and dbid = :dbid
            )
       group by service_name
       union all
       select '', 0 from dual
       union all
       select '', 0 from dual
       order by 2 desc, 1
     )
 where rownum <= 5
