[sql_stat]
select  /* awrsql */  case when executions <   10                       then '*'||to_char(executions)
             when executions >=  10 and executions <  100 then '+10   ~ 99'
             when executions >= 100 and executions < 1000 then '+100  ~ 999'
             when executions >=1000 and executions <10000 then '+1000 ~ 9999'
                                                          else '+10000~'
        end                                             "Executions",
        count(*)                                        "SQL Count",
        ratio_to_report(count(*)) over ()               "% Count",
        sum(sharable_mem)/1024/1024                     "Memory (Mb)",
        ratio_to_report(sum(sharable_mem)) over ()      "% Memory"
from    v$sql
group by
        case when executions <   10                       then '*'||to_char(executions)
              when executions >=  10 and executions <  100 then '+10   ~ 99'
              when executions >= 100 and executions < 1000 then '+100  ~ 999'
              when executions >=1000 and executions <10000 then '+1000 ~ 9999'
                                                           else '+10000~'
        end
order by 1
[sql_loadtime]
SQL2=sql_loadtime,sql_loadtime,[1.1],TRUE
FORMAT3=sql_loadtime^[1.2:E.2/1.4:E.4]^###,##0
FORMAT4=sql_loadtime^[1.3:E.3/1.5:E.5]^##0%
FORMAT5=sql_loadtime^[1.6:E.6]^###,##0.0
[sql_loadtime]
select  /* awrsql */  b.lable         "Load Time Range",
    nvl(sql_cnt,0)      "SQL Count",
        nvl(ratio_sql_cnt,0)    "% Count",
    nvl(mem,0)/1024     "Memory (Kb)",
    nvl(ratio_mem,0)    "% Memory",
    nvl(avg_exec,0)     "Avg Exec Count"
from (
    select  case when ((sysdate-to_date(last_load_time,'yyyy-mm-dd/hh24:mi:ss'))*24*60) <= 1                 then '(0) 00 ~ 01 (Min)'
                 when ((sysdate-to_date(last_load_time,'yyyy-mm-dd/hh24:mi:ss'))*24*60) between 1   and 5    then '(1) 01 ~ 05 (Min)'
                 when ((sysdate-to_date(last_load_time,'yyyy-mm-dd/hh24:mi:ss'))*24*60) between 5   and 10   then '(2) 05 ~ 10 (Min)'
                 when ((sysdate-to_date(last_load_time,'yyyy-mm-dd/hh24:mi:ss'))*24*60) between 10  and 30   then '(3) 10 ~ 30 (Min)'
                 when ((sysdate-to_date(last_load_time,'yyyy-mm-dd/hh24:mi:ss'))*24*60) between 30  and 60   then '(4) 30 ~ 60 (Min)'
                 when ((sysdate-to_date(last_load_time,'yyyy-mm-dd/hh24:mi:ss'))*24*60) between 60  and 120  then '(5) 01 ~ 02 (Hr)'
                 when ((sysdate-to_date(last_load_time,'yyyy-mm-dd/hh24:mi:ss'))*24*60) between 120 and 360  then '(6) 02 ~ 06 (Hr)'
                 when ((sysdate-to_date(last_load_time,'yyyy-mm-dd/hh24:mi:ss'))*24*60) between 360 and 720  then '(7) 06 ~ 12 (Hr)'
                 when ((sysdate-to_date(last_load_time,'yyyy-mm-dd/hh24:mi:ss'))*24*60) between 720 and 1440 then '(8) 12 ~ 24 (Hr)'
                 when ((sysdate-to_date(last_load_time,'yyyy-mm-dd/hh24:mi:ss'))*24*60) > 1440               then '(9) 24 ~    (Hr)'
                 when last_load_time is null then '<null>'
            end lable,
            count(*)                                    sql_cnt,
            ratio_to_report(count(*)) over ()           ratio_sql_cnt,
            sum(sharable_mem)                           mem,
            ratio_to_report(sum(sharable_mem)) over ()  ratio_mem,
            avg(executions)                             avg_exec
    from    v$sql
    group by
           case when ((sysdate-to_date(last_load_time,'yyyy-mm-dd/hh24:mi:ss'))*24*60) <= 1                 then '(0) 00 ~ 01 (Min)'
                when ((sysdate-to_date(last_load_time,'yyyy-mm-dd/hh24:mi:ss'))*24*60) between 1   and 5    then '(1) 01 ~ 05 (Min)'
                when ((sysdate-to_date(last_load_time,'yyyy-mm-dd/hh24:mi:ss'))*24*60) between 5   and 10   then '(2) 05 ~ 10 (Min)'
                when ((sysdate-to_date(last_load_time,'yyyy-mm-dd/hh24:mi:ss'))*24*60) between 10  and 30   then '(3) 10 ~ 30 (Min)'
                when ((sysdate-to_date(last_load_time,'yyyy-mm-dd/hh24:mi:ss'))*24*60) between 30  and 60   then '(4) 30 ~ 60 (Min)'
                when ((sysdate-to_date(last_load_time,'yyyy-mm-dd/hh24:mi:ss'))*24*60) between 60  and 120  then '(5) 01 ~ 02 (Hr)'
                when ((sysdate-to_date(last_load_time,'yyyy-mm-dd/hh24:mi:ss'))*24*60) between 120 and 360  then '(6) 02 ~ 06 (Hr)'
                when ((sysdate-to_date(last_load_time,'yyyy-mm-dd/hh24:mi:ss'))*24*60) between 360 and 720  then '(7) 06 ~ 12 (Hr)'
                when ((sysdate-to_date(last_load_time,'yyyy-mm-dd/hh24:mi:ss'))*24*60) between 720 and 1440 then '(8) 12 ~ 24 (Hr)'
                when ((sysdate-to_date(last_load_time,'yyyy-mm-dd/hh24:mi:ss'))*24*60) > 1440               then '(9) 24 ~    (Hr)'
                when last_load_time is null then '<null>'
           end
    ) a,
    (
    select '(0) 00 ~ 01 (Min)' lable from dual union all
    select '(1) 01 ~ 05 (Min)'       from dual union all
    select '(2) 05 ~ 10 (Min)'       from dual union all
    select '(3) 10 ~ 30 (Min)'       from dual union all
    select '(4) 30 ~ 60 (Min)'       from dual union all
    select '(5) 01 ~ 02 (Hr)'        from dual union all
    select '(6) 02 ~ 06 (Hr)'        from dual union all
    select '(7) 06 ~ 12 (Hr)'        from dual union all
    select '(8) 12 ~ 24 (Hr)'        from dual union all
    select '(9) 24 ~    (Hr)'        from dual union all
    select '<null>'                  from dual
    ) b
where a.lable(+) = b.lable
order by 1
