          where sq.snap_id = sn.snap_id
            and sq.instance_number = sn.instance_number
            and sq.dbid = sn.dbid
            and st.sql_id(+) = sq.sql_id
            and st.dbid(+) = sq.dbid
            and sn.snap_id between :snap_fr and :snap_to
            and sn.instance_number = :inst_no
