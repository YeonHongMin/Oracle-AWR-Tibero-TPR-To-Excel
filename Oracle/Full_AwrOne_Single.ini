FORMAT1=service_stat_dbtime^[1.3:E.7]^###,##0
CHART1=service_stat_dbtime,[1.2:E.2/1.3:E.7],ACTIVE,service_stat_dbtime,Service Statistics : DB time(s) - @@hostname@@,2,9,LINE,TRUE,dd hh:mm,Date & Time
[service_stat_dbtime]
select /* awrsql */ sn.snap_id,
       to_char(sn.end_interval_time,'yyyy-mm-dd hh24:mi:ss') "Timestamp",
       max(decode(rank, 1, delta/1000000, 0)) rank1,
       max(decode(rank, 2, delta/1000000, 0)) rank2,
       max(decode(rank, 3, delta/1000000, 0)) rank3,
       max(decode(rank, 4, delta/1000000, 0)) rank4,
       max(decode(rank, 5, delta/1000000, 0)) rank5
  from (  select v_service.snap_id,
                 v_rank.rank,
                 v_service.stat_name,
                 v_service.delta
            from ( select service_name, rownum rank
                     from
                        ( select service_name, sum(nvl(delta,0))
                            from
                               ( select snap_id,
                                        service_name,
                                        greatest(nvl(value - lag(value)
                                                 over ( partition by con_id, awr_startup_time, service_name order by snap_id), 0), 0) delta
                                   from (select t.*, s0.startup_time awr_startup_time from dba_hist_service_stat t, dba_hist_snapshot s0 where t.dbid = s0.dbid and t.instance_number = s0.instance_number and t.snap_id = s0.snap_id)
                                  where stat_name = 'DB time'
                                    and snap_id between :snap_fr and :snap_to
                                    and instance_number = :inst_no
                                    and dbid = :dbid
                               )
                          group by service_name order by sum(delta) desc
                        )
                    where rownum <= 5
                 ) v_rank,
                 ( select snap_id,
                          service_name,
                          stat_name,
                          greatest(nvl(value - lag(value)
                                over ( partition by con_id, awr_startup_time, service_name, stat_name order by snap_id), 0), 0) delta
                     from (select t.*, s0.startup_time awr_startup_time from dba_hist_service_stat t, dba_hist_snapshot s0 where t.dbid = s0.dbid and t.instance_number = s0.instance_number and t.snap_id = s0.snap_id)
                    where stat_name = 'DB time'
                      and snap_id between :snap_fr and :snap_to
                      and instance_number = :inst_no
                      and dbid = :dbid
                 ) v_service
           where v_service.service_name = v_rank.service_name
          ) v1,
          ( select snap_id,
                   end_interval_time
              from dba_hist_snapshot
             where snap_id between :snap_fr and :snap_to
               and instance_number = :inst_no
               and dbid = :dbid
          ) sn
 where v1.snap_id = sn.snap_id
   and sn.snap_id > :snap_fr
 group by sn.snap_id,
       to_char(sn.end_interval_time,'yyyy-mm-dd hh24:mi:ss')
 order by sn.snap_id
