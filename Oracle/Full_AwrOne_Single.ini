                from (
                     select f.snap_id,
                            s0.startup_time,
                            case when f.con_id <= 1 then f.tsname else f.tsname||'(con#'||f.con_id||')' end tsname,
                            sum(f.phyblkrd + f.phyblkwrt) s
                       from dba_hist_filestatxs f,
                            dba_hist_snapshot s0
                      where f.dbid = s0.dbid
                        and f.instance_number = s0.instance_number
                        and f.snap_id = s0.snap_id
                        and f.snap_id between :snap_fr and :snap_to
                        and f.instance_number = :inst_no
                        and f.dbid = :dbid
                      group by f.snap_id, s0.startup_time, case when f.con_id <= 1 then f.tsname else f.tsname||'(con#'||f.con_id||')' end
                     )
              )
        where snap_id > :snap_fr
        group by tsname
        order by tot_delta desc, tsname
      )
