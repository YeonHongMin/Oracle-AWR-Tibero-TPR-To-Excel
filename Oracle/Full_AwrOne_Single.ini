                 from (select t.*, s0.startup_time awr_startup_time from dba_hist_sysstat t, dba_hist_snapshot s0 where t.dbid = s0.dbid and t.instance_number = s0.instance_number and t.snap_id = s0.snap_id and t.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end) sy,
                            dba_hist_snapshot sn
                       where sy.snap_id = sn.snap_id
