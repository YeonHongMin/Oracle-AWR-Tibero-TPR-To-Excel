        ,sum(case when thread#=2 then 1 else 0 end) "Thread#2"
        ,sum(case when thread#=3 then 1 else 0 end) "Thread#3"
        ,sum(case when thread#=4 then 1 else 0 end) "Thread#4"
from    v$log_history
