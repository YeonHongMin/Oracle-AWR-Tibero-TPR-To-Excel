       max(decode(rank, 3, decode(v1.wait_class, 'Other', delta_time_waited, 0), 0))         rank3_ot_time,
       max(decode(rank, 3, decode(v1.wait_class, 'System I/O', delta_time_waited, 0), 0))    rank3_sysio_time,
       max(decode(rank, 3, decode(v1.wait_class, 'User I/O', delta_time_waited, 0), 0))      rank3_userio_time,
       max(decode(rank, 4, decode(v1.wait_class, 'Administrative',delta_time_waited, 0), 0)) rank4_adm_time,
       max(decode(rank, 4, decode(v1.wait_class, 'Application', delta_time_waited, 0), 0))   rank4_app_time,
       max(decode(rank, 4, decode(v1.wait_class, 'Cluster', delta_time_waited, 0), 0))       rank4_cl_time,
       max(decode(rank, 4, decode(v1.wait_class, 'Commit', delta_time_waited, 0), 0))        rank4_cmt_time,
       max(decode(rank, 4, decode(v1.wait_class, 'Concurrency', delta_time_waited, 0), 0))   rank4_conc_time,
       max(decode(rank, 4, decode(v1.wait_class, 'Configuration', delta_time_waited, 0), 0)) rank4_cfg_time,
       max(decode(rank, 4, decode(v1.wait_class, 'Network', delta_time_waited, 0), 0))       rank4_nw_time,
       max(decode(rank, 4, decode(v1.wait_class, 'Other', delta_time_waited, 0), 0))         rank4_ot_time,
       max(decode(rank, 4, decode(v1.wait_class, 'System I/O', delta_time_waited, 0), 0))    rank4_sysio_time,
       max(decode(rank, 4, decode(v1.wait_class, 'User I/O', delta_time_waited, 0), 0))      rank4_userio_time,
       max(decode(rank, 5, decode(v1.wait_class, 'Administrative',delta_time_waited, 0), 0)) rank5_adm_time,
       max(decode(rank, 5, decode(v1.wait_class, 'Application', delta_time_waited, 0), 0))   rank5_app_time,
       max(decode(rank, 5, decode(v1.wait_class, 'Cluster', delta_time_waited, 0), 0))       rank5_cl_time,
       max(decode(rank, 5, decode(v1.wait_class, 'Commit', delta_time_waited, 0), 0))        rank5_cmt_time,
       max(decode(rank, 5, decode(v1.wait_class, 'Concurrency', delta_time_waited, 0), 0))   rank5_conc_time,
       max(decode(rank, 5, decode(v1.wait_class, 'Configuration', delta_time_waited, 0), 0)) rank5_cfg_time,
       max(decode(rank, 5, decode(v1.wait_class, 'Network', delta_time_waited, 0), 0))       rank5_nw_time,
       max(decode(rank, 5, decode(v1.wait_class, 'Other', delta_time_waited, 0), 0))         rank5_ot_time,
       max(decode(rank, 5, decode(v1.wait_class, 'System I/O', delta_time_waited, 0), 0))    rank5_sysio_time,
       max(decode(rank, 5, decode(v1.wait_class, 'User I/O', delta_time_waited, 0), 0))      rank5_userio_time
  from (  select v_service.snap_id,
                 v_rank.rank,
                 v_service.wait_class,
                 v_service.delta_time_waited/100 delta_time_waited
            from ( select service_name, rownum rank
                     from
                        ( select service_name, sum(nvl(delta,0))
                            from
                               ( select snap_id,
                                        service_name,
                                        greatest(nvl(time_waited - lag(time_waited)
                                           over ( partition by con_id, awr_startup_time, service_name, wait_class order by snap_id), 0), 0) delta
                                   from (select t.*, s0.startup_time awr_startup_time from dba_hist_service_wait_class t, dba_hist_snapshot s0 where t.dbid = s0.dbid and t.instance_number = s0.instance_number and t.snap_id = s0.snap_id)
                                  where wait_class = 'User I/O'
                                    and snap_id between :snap_fr and :snap_to
                                    and instance_number = :inst_no
                                    and dbid = :dbid
                               )
                          group by service_name
                          order by sum(delta) desc
                        )
                    where rownum <= 5
                 ) v_rank,
                 ( select snap_id,
                          service_name,
                          wait_class,
                          greatest(nvl(time_waited - lag(time_waited) over ( partition by con_id, awr_startup_time, service_name, wait_class order by snap_id), 0), 0) delta_time_waited
                     from (select t.*, s0.startup_time awr_startup_time from dba_hist_service_wait_class t, dba_hist_snapshot s0 where t.dbid = s0.dbid and t.instance_number = s0.instance_number and t.snap_id = s0.snap_id)
                    where snap_id between :snap_fr and :snap_to
                      and instance_number = :inst_no
                      and dbid = :dbid
                 ) v_service
           where v_service.service_name = v_rank.service_name
          ) v1,
          ( select snap_id,
                   to_char(end_interval_time,'yyyy-mm-dd hh24:mi:ss') snap_time
              from dba_hist_snapshot
             where snap_id between 1+ :snap_fr and :snap_to
               and instance_number = :inst_no
               and dbid = :dbid
          ) sn
 where v1.snap_id = sn.snap_id
 group by sn.snap_id,sn.snap_time
 order by sn.snap_id
[service_wait_sql2]
select /* awrsql */ case when service_name='SYS$BACKGROUND' then 'SYS$B/G'
            when service_name='SYS$USERS'      then 'SYS$USR'
            when service_name is null          then 'N/A'
            else service_name end
       ||':'||subname title
from (
     select service_name, rownum rank
       from (
            select service_name, sum(nvl(delta,0))
              from ( select snap_id,
