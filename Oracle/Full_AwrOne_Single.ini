[sga]
select  /* awrsql */
    b.snap_id     "SnapID",
    b.snap_time   "Timestamp",
    sum(case when pool='null' and name='buffer_cache' then bytes/1048576 else 0 end) "buf.cache(M)",
    sum(case when pool='null' and name='log_buffer'   then bytes/1048576 else 0 end) "log.buf(M)",
    sum(case when pool='shared pool'                  then bytes/1048576 else 0 end) "shared.pool(M)",
    sum(case when pool='java pool'                    then bytes/1048576 else 0 end) "java.pool(M)",
    sum(case when pool='large pool'                   then bytes/1048576 else 0 end) "large.pool(M)",
    sum(case when pool='streams pool'                 then bytes/1048576 else 0 end) "streams.pool(M)",
    sum(case when pool='shared pool'  and name='SQLA' then bytes/1048576 else 0 end) "sqlarea(M)",
    sum(case when pool='shared pool'  and name in ('library cache','KGLH0','KGLHD','KGLNA','KGLSG','KGLDA','KGLA','KGLS') then bytes/1048576 else 0 end) "lib.cache(M)",
    sum(case when pool='shared pool'  and name not in ('SQLA','library cache','KGLH0','KGLHD','KGLNA','KGLSG','KGLDA','KGLA','KGLS','free memory') then bytes/1048576 else 0 end) "others(M)",
    sum(case when pool='shared pool'  and name='free memory' then bytes/1048576 else 0 end) "free(M)",
    sum(case when pool='large pool'   and name<>'free memory' then bytes/1048576 else 0 end) "largepool:used(M)",
    sum(case when pool='large pool'   and name='free memory' then bytes/1048576 else 0 end) "largepool:free(M)",
    sum(case when pool='java pool'    and name<>'free memory' then bytes/1048576 else 0 end) "javapool:used(M)",
    sum(case when pool='java pool'    and name='free memory' then bytes/1048576 else 0 end) "javapool:free(M)",
    sum(case when pool='streams pool' and name<>'free memory' then bytes/1048576 else 0 end) "streams:used(M)",
    sum(case when pool='streams pool' and name='free memory' then bytes/1048576 else 0 end) "streams:free(M)",
    sum(case when pool='shared pool'  and name='SQLA' then bytes/1048576 else 0 end) "lib.sqlarea(M)",
    sum(case when pool='shared pool'  and name='library cache' then bytes/1048576 else 0 end) "lib.cache_detail(M)",
    sum(case when pool='shared pool'  and name='SQLP' then bytes/1048576 else 0 end) "lib.SQLP(M)",
    sum(case when pool='shared pool'  and name='KGLH0' then bytes/1048576 else 0 end) "lib.KGLH0(M)",
    sum(case when pool='shared pool'  and name='KGLHD' then bytes/1048576 else 0 end) "lib.KGLHD(M)",
    sum(case when pool='shared pool'  and name='KGLNA' then bytes/1048576 else 0 end) "lib.KGLNA(M)",
    sum(case when pool='shared pool'  and name='KGLSG' then bytes/1048576 else 0 end) "lib.KGLSG(M)",
    sum(case when pool='shared pool'  and name='KGLDA' then bytes/1048576 else 0 end) "lib.KGLDA(M)",
    sum(case when pool='shared pool'  and name='KGLA'  then bytes/1048576 else 0 end) "lib.KGLA(M)",
    sum(case when pool='shared pool'  and name='KGLS'  then bytes/1048576 else 0 end) "lib.KGLS(M)",
    sum(case when pool='shared pool'  and name='PRTMV' then bytes/1048576 else 0 end) "lib.PRTMV(M)",
    sum(case when pool='shared pool'  and name='KQR L PO' then bytes/1048576 else 0 end) "lib.KQR_L_PO(M)",
    sum(case when pool='shared pool'  and name='gcs shadows' then bytes/1048576 else 0 end) "lib.ges_shad(M)",
    sum(case when pool='shared pool'  and name='gcs resources' then bytes/1048576 else 0 end) "lib.gcs_res(M)",
    sum(case when pool='shared pool'  and name='Checkpoint queue' then bytes/1048576 else 0 end) "lib.ckpt_q(M)",
    sum(case when pool='shared pool'  and name not in
                  ('SQLA','library cache','KGLH0','KGLHD','KGLNA','KGLSG','KGLDA','KGLA','KGLS','PRTMV',
                   'free memory','gcs resources','gcs shadows','Checkpoint queue','KQR L PO','SQLP')
             then bytes/1048576 else 0 end) "lib.others(M)",
    sum(case when pool='shared pool'  and name='free memory' then bytes/1048576 else 0 end) "lib.free(M)"
from    (
    select  snap_id,
            nvl(pool,'null') pool,
            name,
            bytes
    from    dba_hist_sgastat
    where   snap_id between 1+ :snap_fr and :snap_to
        and instance_number = :inst_no
        and dbid = :dbid
        and con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
    ) a,
        ( select snap_id,
                 to_char(end_interval_time, 'yyyy-mm-dd hh24:mi:ss') snap_time
            from dba_hist_snapshot
           where snap_id between 1+ :snap_fr and :snap_to
             and instance_number = :inst_no
             and dbid = :dbid
        ) b
where   a.snap_id(+) = b.snap_id
group by b.snap_id, b.snap_time
order by b.snap_id
