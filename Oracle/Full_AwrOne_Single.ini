             (max(decode(pga.name, 'total PGA used for auto workareas', value, 0))
             +max(decode(pga.name, 'total PGA used for manual workareas', value, 0))
             )/max(decode(pga.name, 'total PGA allocated', value, 0)))                        "%PGA W/A Mem",
       decode(max(decode(pga.name, 'total PGA used for auto workareas',value, 0))
             +max(decode(pga.name, 'total PGA used for manual workareas',value, 0)), 0, 0,
              max(decode(pga.name, 'total PGA used for auto workareas',value, 0))
              /(max(decode(pga.name, 'total PGA used for auto workareas',value, 0))
               +max(decode(pga.name, 'total PGA used for manual workareas',value, 0))))       "%Auto W/A Mem",
       decode(max(decode(pga.name, 'total PGA used for auto workareas',value, 0))
             +max(decode(pga.name, 'total PGA used for manual workareas',value, 0)), 0, 0,
              max(decode(pga.name, 'total PGA used for manual workareas',value, 0))
              /(max(decode(pga.name, 'total PGA used for auto workareas',value, 0))
               +max(decode(pga.name, 'total PGA used for manual workareas',value, 0))))       "%Manual W/A Mem",
       max(decode(pga.name, 'global memory bound',value/1024, 0))                             "Global Mem Bound(K)",
       max(case when pga.name='maximum PGA used for auto workareas' then value else 0 end)/1048576   "max. auto W/A(M)",
       max(case when pga.name='maximum PGA used for manual workareas' then value else 0 end)/1048576 "max. manual W/A(M)"
 from (
       select dbid,instance_number,snap_id, to_char(end_interval_time, 'yyyy-mm-dd hh24:mi:ss') snap_time
         from dba_hist_snapshot
        where snap_id between 1+ :snap_fr and :snap_to
          and instance_number = :inst_no
          and dbid = :dbid
       ) sn, (select * from dba_hist_pgastat where con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end) pga
where pga.snap_id = sn.snap_id
  and pga.instance_number = sn.instance_number
  and pga.dbid = sn.dbid
 group by sn.snap_id, sn.snap_time
 order by sn.snap_id
[pga_hit]
SQL1=pga_hit_sql,pga_hit,[1.1],TRUE
FORMAT1=pga_hit^[1.4:E.5]^###,##0.0
FORMAT2=pga_hit^[1.3:E.3]^##0.0%
CHART1=pga_hit,[1.2:E.2/1.3:E.3],ACTIVE,pga_hit,PGA cache hit (%) - @@hostname@@,2,7,LINE,FALSE,dd hh:mm,Date & Time
[pga_hit]
select  /* awrsql */  sn.snap_id "SnapID",
        sn.snap_time "Timestamp",
        decode(sum(decode(name, 'bytes processed', delta, 0))
               +sum(decode(name, 'extra bytes read/written', delta, 0)),0,1,
               sum(decode(name, 'bytes processed', delta, 0))
            / ( sum(decode(name, 'bytes processed', delta, 0))
               +sum(decode(name, 'extra bytes read/written', delta, 0))
              )) "PGA Cache Hit %",
        sum(decode(name, 'bytes processed', delta/1024/1024, 0)) "W/A MB Processed",
        sum(decode(name, 'extra bytes read/written', delta/1024/1024, 0)) "Extra W/A MB Read/Write"
  from (
         select snap_id,
                name,
                greatest(nvl(value-lag(value) over (partition by awr_startup_time, name order by snap_id), 0), 0) delta
           from (select t.*, s0.startup_time awr_startup_time from dba_hist_pgastat t, dba_hist_snapshot s0 where t.dbid = s0.dbid and t.instance_number = s0.instance_number and t.snap_id = s0.snap_id and t.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end)
          where name in ('bytes processed','extra bytes read/written')
            and snap_id between :snap_fr and :snap_to
            and instance_number = :inst_no
            and dbid = :dbid
       ) v1,
       (
       select snap_id, to_char(end_interval_time, 'yyyy-mm-dd hh24:mi:ss') snap_time
         from dba_hist_snapshot
        where snap_id between 1+ :snap_fr and :snap_to
          and instance_number = :inst_no
          and dbid = :dbid
       ) sn
 where v1.snap_id  = sn.snap_id
group by sn.snap_id, sn.snap_time
order by sn.snap_id
[workarea]
SQL1=workarea_sql,workarea,[1.1],TRUE
FORMAT1=workarea^[1.5:E.8]^###,##0
[workarea]
select  /* awrsql */  sn.snap_id "SnapID"
      ,snap_time  "Timestamp"
      ,case when low_optimal_size >= 1024*1024*1024*1024
            then lpad(round(low_optimal_size/1024/1024/1024/1024) || 'T',7)
            when low_optimal_size >= 1024*1024*1024
            then lpad(round(low_optimal_size/1024/1024/1024) || 'G' ,7)
            when low_optimal_size >= 1024*1024
            then lpad(round(low_optimal_size/1024/1024) || 'M',7)
            when low_optimal_size >= 1024
            then lpad(round(low_optimal_size/1024) || 'K',7)
            else lpad(low_optimal_size || 'B',7)
       end                    "Low Optimal"
      ,case when high_optimal_size >= 1024*1024*1024*1024
            then lpad(round(high_optimal_size/1024/1024/1024/1024) || 'T',7)
            when high_optimal_size >= 1024*1024*1024
            then lpad(round(high_optimal_size/1024/1024/1024) || 'G',7)
            when high_optimal_size >= 1024*1024
            then lpad(round(high_optimal_size/1024/1024) || 'M',7)
            when high_optimal_size >= 1024
            then lpad(round(high_optimal_size/1024) || 'K',7)
            else high_optimal_size || 'B'
       end                           "High Optimal"
      ,nvl(total_executions,0)       "tot_exe"
      ,nvl(optimal_executions,0)     "opt_exe"
      ,nvl(onepass_executions,0)     "one_exe"
      ,nvl(multipasses_executions,0) "mul_exe"
  from (select  snap_id,low_optimal_size,high_optimal_size,
            total_executions   - lag(total_executions) over (partition by awr_startup_time, low_optimal_size,high_optimal_size order by snap_id) total_executions,
            optimal_executions - lag(optimal_executions) over (partition by awr_startup_time, low_optimal_size,high_optimal_size order by snap_id) optimal_executions,
            onepass_executions - lag(onepass_executions) over (partition by awr_startup_time, low_optimal_size,high_optimal_size order by snap_id) onepass_executions,
            multipasses_executions - lag(multipasses_executions) over (partition by awr_startup_time, low_optimal_size,high_optimal_size order by snap_id) multipasses_executions
         from (select t.*, s0.startup_time awr_startup_time from dba_hist_sql_workarea_hstgrm t, dba_hist_snapshot s0 where t.dbid = s0.dbid and t.instance_number = s0.instance_number and t.snap_id = s0.snap_id and t.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end)
        where snap_id between :snap_fr and :snap_to
          and instance_number = :inst_no
          and dbid = :dbid
       ) v1,
       (
       select snap_id,
              to_char(end_interval_time, 'yyyy-mm-dd hh24:mi:ss') snap_time,
              (extract(day from (end_interval_time-begin_interval_time))*86400 + extract(hour from (end_interval_time-begin_interval_time))*3600 + extract(minute from (end_interval_time-begin_interval_time))*60 + extract(second from (end_interval_time-begin_interval_time))) interval
         from dba_hist_snapshot
        where snap_id between 1+ :snap_fr and :snap_to
          and instance_number = :inst_no
          and dbid = :dbid
       ) sn
 where v1.snap_id = sn.snap_id
 order by low_optimal_size
[workarea_raw]
SQL1=workarea_raw_sql,workarea_raw,[1.1],TRUE
FORMAT1=workarea_raw^[1.5:E.8]^###,##0
[workarea_raw]
select  /* awrsql */ :snap_to "SnapID"
      , (select to_char(end_interval_time,'yyyy-mm-dd hh24:mi:ss')
           from dba_hist_snapshot
          where snap_id = :snap_to and instance_number = :inst_no and dbid = :dbid) "Timestamp"
      , case when low_optimal_size >= 1024*1024*1024*1024
             then lpad(round(low_optimal_size/1024/1024/1024/1024) || 'T',7)
             when low_optimal_size >= 1024*1024*1024
             then lpad(round(low_optimal_size/1024/1024/1024) || 'G' ,7)
             when low_optimal_size >= 1024*1024
             then lpad(round(low_optimal_size/1024/1024) || 'M',7)
             when low_optimal_size >= 1024
             then lpad(round(low_optimal_size/1024) || 'K',7)
             else lpad(low_optimal_size || 'B',7)
        end "Low Optimal"
      , case when high_optimal_size >= 1024*1024*1024*1024
             then lpad(round(high_optimal_size/1024/1024/1024/1024) || 'T',7)
             when high_optimal_size >= 1024*1024*1024
             then lpad(round(high_optimal_size/1024/1024/1024) || 'G',7)
             when high_optimal_size >= 1024*1024
             then lpad(round(high_optimal_size/1024/1024) || 'M',7)
             when high_optimal_size >= 1024
             then lpad(round(high_optimal_size/1024) || 'K',7)
             else high_optimal_size || 'B'
        end "High Optimal"
      , sum(tot_exe) "tot_exe"
      , sum(opt_exe) "opt_exe"
      , sum(one_exe) "one_exe"
      , sum(mul_exe) "mul_exe"
  from (select w.snap_id, w.low_optimal_size, w.high_optimal_size,
               greatest(nvl(w.total_executions       - lag(w.total_executions)       over (partition by w.dbid, w.instance_number, w.con_id, s0.startup_time, w.low_optimal_size, w.high_optimal_size order by w.snap_id), 0), 0) tot_exe,
               greatest(nvl(w.optimal_executions     - lag(w.optimal_executions)     over (partition by w.dbid, w.instance_number, w.con_id, s0.startup_time, w.low_optimal_size, w.high_optimal_size order by w.snap_id), 0), 0) opt_exe,
               greatest(nvl(w.onepass_executions     - lag(w.onepass_executions)     over (partition by w.dbid, w.instance_number, w.con_id, s0.startup_time, w.low_optimal_size, w.high_optimal_size order by w.snap_id), 0), 0) one_exe,
               greatest(nvl(w.multipasses_executions - lag(w.multipasses_executions) over (partition by w.dbid, w.instance_number, w.con_id, s0.startup_time, w.low_optimal_size, w.high_optimal_size order by w.snap_id), 0), 0) mul_exe
          from dba_hist_sql_workarea_hstgrm w,
               dba_hist_snapshot s0
         where w.dbid = s0.dbid and w.instance_number = s0.instance_number and w.snap_id = s0.snap_id
           and w.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
           and w.snap_id between :snap_fr and :snap_to
           and w.instance_number = :inst_no
           and w.dbid = :dbid)
 where snap_id > :snap_fr
 group by low_optimal_size, high_optimal_size
 having sum(tot_exe) > 0
 order by low_optimal_size
[tbsstat_total]
SQL1=tbsstat_total_sql,tbsstat_total,[1.1],TRUE
FORMAT1=tbsstat_total^[1.4:E.4/1.6:E.6/1.9:E.21]^###,##0
FORMAT2=tbsstat_total^[1.3:E.3/1.5:E.5/1.7:E.8]^##0%
[tbsstat_total]
select  /* awrsql */
        tsname                                      "Tablespace",
        ' '                                         "File",
        nvl(ratio_to_report(wait_time) over (),0)   "WaitTime%",
        wait_time/100                               "WaitTime(s)",
        nvl(ratio_to_report(wait_count) over (),0)  "WaitCount%",
        wait_count                                  "WaitCount",
        nvl(ratio_to_report(phyblkrd) over (),0)    "PhyBlock Read%",
        nvl(ratio_to_report(phyblkwrt) over (),0)   "PhyBlock Write%",
        decode(phyrds,0,0,phyblkrd/phyrds)          "FullScan Ratio",
        phyblkrd                                    "PhyBlkRead",
        phyrds                                      "PhyReads",
        phyblkwrt                                   "PhyBlkWrite",
        phywrts                                     "PhyWrites",
        decode(phywrts,0,0,phyblkwrt/phywrts)       "Blocks/write",
        singleblkrds                                "SingleBlkRead",
        10*singleblkrdtim                           "SingleBlkReadTime(ms)",
        10*decode(singleblkrds,0,0,singleblkrdtim/singleblkrds) "avg.singleReadTime(ms)",
        10*decode(phyblkrd,0,0,readtim/phyblkrd)    "avg.Blk Read(ms)",
        10*decode(phyblkwrt,0,0,writetim/phyblkwrt) "avg.Blk Write(ms)",
        phyblkrd*block_size/1048576                 "PhyRd(Mb)",
        phyblkwrt*block_size/1048576                "PhyWrt(Mb)",
        block_size                                  "BlkSiz"
from    (
        select  tsname,block_size,
                sum(wait_time)      wait_time,
                sum(wait_count)     wait_count,
                sum(phyblkrd)       phyblkrd,
                sum(phyrds)         phyrds,
                sum(phyblkwrt)      phyblkwrt,
                sum(phywrts)        phywrts,
                sum(singleblkrds)   singleblkrds,
                sum(singleblkrdtim) singleblkrdtim,
                sum(readtim)        readtim,
                sum(writetim)       writetim
        from    (
                select  a.tsname,a.filename,a.block_size,
                        case when ( nvl(b.time,0)           - nvl(a.time,0)           ) < 0 then 0 else  ( nvl(b.time,0)           - nvl(a.time,0)           )  end wait_time,
                        case when ( nvl(b.wait_count,0)     - nvl(a.wait_count,0)     ) < 0 then 0 else  ( nvl(b.wait_count,0)     - nvl(a.wait_count,0)     )  end wait_count,
                        case when ( nvl(b.phyblkrd,0)       - nvl(a.phyblkrd,0)       ) < 0 then 0 else  ( nvl(b.phyblkrd,0)       - nvl(a.phyblkrd,0)       )  end phyblkrd,
                        case when ( nvl(b.phyrds,0)         - nvl(a.phyrds,0)         ) < 0 then 0 else  ( nvl(b.phyrds,0)         - nvl(a.phyrds,0)         )  end phyrds,
                        case when ( nvl(b.phyblkwrt,0)      - nvl(a.phyblkwrt,0)      ) < 0 then 0 else  ( nvl(b.phyblkwrt,0)      - nvl(a.phyblkwrt,0)      )  end phyblkwrt,
                        case when ( nvl(b.phywrts,0)        - nvl(a.phywrts,0)        ) < 0 then 0 else  ( nvl(b.phywrts,0)        - nvl(a.phywrts,0)        )  end phywrts,
                        case when ( nvl(b.singleblkrds,0)   - nvl(a.singleblkrds,0)   ) < 0 then 0 else  ( nvl(b.singleblkrds,0)   - nvl(a.singleblkrds,0)   )  end singleblkrds,
                        case when ( nvl(b.singleblkrdtim,0) - nvl(a.singleblkrdtim,0) ) < 0 then 0 else  ( nvl(b.singleblkrdtim,0) - nvl(a.singleblkrdtim,0) )  end singleblkrdtim,
                        case when ( nvl(b.readtim,0)        - nvl(a.readtim,0)        ) < 0 then 0 else  ( nvl(b.readtim,0)        - nvl(a.readtim,0)        )  end readtim,
                        case when ( nvl(b.writetim,0)       - nvl(a.writetim,0)       ) < 0 then 0 else  ( nvl(b.writetim,0)       - nvl(a.writetim,0)       )  end writetim
                  from dba_hist_filestatxs a, dba_hist_filestatxs b
                 where a.snap_id = :snap_fr
                   and b.snap_id = :snap_to
                   and a.instance_number = :inst_no
                   and b.instance_number = :inst_no
                   and a.dbid = :dbid
                   and b.dbid = :dbid
                   and a.filename = b.filename
                )
        group by tsname,block_size
        )
order by wait_time desc,wait_count desc,phyblkrd desc
[filestat_total]
SQL1=filestat_total_sql,filestat_total,[1.1],TRUE
FORMAT1=filestat_total^[1.4:E.4/1.6:E.6/1.9:E.21]^###,##0
FORMAT2=filestat_total^[1.3:E.3/1.5:E.5/1.7:E.8]^##0%
[filestat_total]
select   /* awrsql */
        tsname                                      "Tablespace",
        ' '||filename                               "File",
        nvl(ratio_to_report(wait_time) over (),0)   "WaitTime%",
        wait_time/100                               "WaitTime(s)",
        nvl(ratio_to_report(wait_count) over (),0)  "WaitCount%",
        wait_count                                  "WaitCount",
        nvl(ratio_to_report(phyblkrd) over (),0)    "PhyBlock Read%",
        nvl(ratio_to_report(phyblkwrt) over (),0)   "PhyBlock Write%",
        decode(phyrds,0,0,phyblkrd/phyrds)          "FullScan Ratio",
        phyblkrd                                    "PhyBlkRead",
        phyrds                                      "PhyReads",
        phyblkwrt                                   "PhyBlkWrite",
        phywrts                                     "PhyWrites",
        decode(phywrts,0,0,phyblkwrt/phywrts)       "Blocks/write",
        singleblkrds                                "SingleBlkRead",
        10*singleblkrdtim                           "SingleBlkReadTime(ms)",
        10*decode(singleblkrds,0,0,singleblkrdtim/singleblkrds) "avg.singleReadTime(ms)",
        10*decode(phyblkrd,0,0,readtim/phyblkrd)    "avg.Blk Read(ms)",
        10*decode(phyblkwrt,0,0,writetim/phyblkwrt) "avg.Blk Write(ms)",
        phyblkrd*block_size/1048576                 "PhyRd(Mb)",
        phyblkwrt*block_size/1048576                "PhyWrt(Mb)",
        block_size                                  "BlkSiz"
from    (
        select  a.tsname,a.filename,a.block_size,
                case when ( nvl(b.time,0)           - nvl(a.time,0)           ) < 0 then 0 else  ( nvl(b.time,0)           - nvl(a.time,0)           )  end wait_time,
                case when ( nvl(b.wait_count,0)     - nvl(a.wait_count,0)     ) < 0 then 0 else  ( nvl(b.wait_count,0)     - nvl(a.wait_count,0)     )  end wait_count,
                case when ( nvl(b.phyblkrd,0)       - nvl(a.phyblkrd,0)       ) < 0 then 0 else  ( nvl(b.phyblkrd,0)       - nvl(a.phyblkrd,0)       )  end phyblkrd,
                case when ( nvl(b.phyrds,0)         - nvl(a.phyrds,0)         ) < 0 then 0 else  ( nvl(b.phyrds,0)         - nvl(a.phyrds,0)         )  end phyrds,
                case when ( nvl(b.phyblkwrt,0)      - nvl(a.phyblkwrt,0)      ) < 0 then 0 else  ( nvl(b.phyblkwrt,0)      - nvl(a.phyblkwrt,0)      )  end phyblkwrt,
                case when ( nvl(b.phywrts,0)        - nvl(a.phywrts,0)        ) < 0 then 0 else  ( nvl(b.phywrts,0)        - nvl(a.phywrts,0)        )  end phywrts,
                case when ( nvl(b.singleblkrds,0)   - nvl(a.singleblkrds,0)   ) < 0 then 0 else  ( nvl(b.singleblkrds,0)   - nvl(a.singleblkrds,0)   )  end singleblkrds,
                case when ( nvl(b.singleblkrdtim,0) - nvl(a.singleblkrdtim,0) ) < 0 then 0 else  ( nvl(b.singleblkrdtim,0) - nvl(a.singleblkrdtim,0) )  end singleblkrdtim,
                case when ( nvl(b.readtim,0)        - nvl(a.readtim,0)        ) < 0 then 0 else  ( nvl(b.readtim,0)        - nvl(a.readtim,0)        )  end readtim,
                case when ( nvl(b.writetim,0)       - nvl(a.writetim,0)       ) < 0 then 0 else  ( nvl(b.writetim,0)       - nvl(a.writetim,0)       )  end writetim
          from dba_hist_filestatxs a, dba_hist_filestatxs b
         where a.snap_id = :snap_fr
           and b.snap_id = :snap_to
           and a.instance_number = :inst_no
           and b.instance_number = :inst_no
           and a.dbid = :dbid
           and b.dbid = :dbid
           and a.filename = b.filename
        )
order by wait_time desc,wait_count desc,phyblkrd desc
[tbsstat]
SQL1=tbsstat_sql,tbsstat,[1.1],FALSE
SQL2=tbsstat_sql2,tbsstat,[1.3],TRUE,FALSE,LTOR
FORMAT1=tbsstat^[1.3:E.7]^###,##0
CHART1=tbsstat,[1.2:E.2/1.3:E.7],ACTIVE,tbsstat,Tablespace Statistics(block R+W) (per sec) - @@hostname@@,2,9,LINE,TRUE,dd hh:mm,Date & Time
[tbsstat]
select  /* awrsql */ sn.snap_id "SnapID",
       snap_time "Timestamp",
       max(decode(rank, 1, decode(interval, 0, 0, v2.delta/interval), 0)) rank_1,
       max(decode(rank, 2, decode(interval, 0, 0, v2.delta/interval), 0)) rank_2,
       max(decode(rank, 3, decode(interval, 0, 0, v2.delta/interval), 0)) rank_3,
       max(decode(rank, 4, decode(interval, 0, 0, v2.delta/interval), 0)) rank_4,
       max(decode(rank, 5, decode(interval, 0, 0, v2.delta/interval), 0)) rank_5
  from (
       select tsname, rownum rank
         from (
              select tsname, sum(delta) tot_delta
                from (
                     select snap_id,
                            tsname,
                            greatest(nvl(s - lag(s) over (partition by startup_time, tsname order by snap_id), 0), 0) delta
                       from (
                            select f.snap_id,
                                   s0.startup_time,
                                   case when f.con_id <= 1 then f.tsname else f.tsname||'(con#'||f.con_id||')' end tsname,
                                   sum(f.phyblkrd + f.phyblkwrt) s
                              from dba_hist_filestatxs f,
                                   dba_hist_snapshot s0
                             where f.dbid = s0.dbid
                               and f.instance_number = s0.instance_number
                               and f.snap_id = s0.snap_id
                               and f.snap_id between :snap_fr and :snap_to
                               and f.instance_number = :inst_no
                               and f.dbid = :dbid
                             group by f.snap_id, s0.startup_time, case when f.con_id <= 1 then f.tsname else f.tsname||'(con#'||f.con_id||')' end
                            )
                     )
               where snap_id > :snap_fr
               group by tsname
               order by tot_delta desc, tsname
             )
       where rownum <= 5
       ) v1,
       (
       select snap_id,
              tsname,
              greatest(nvl(s - lag(s) over (partition by startup_time, tsname order by snap_id), 0), 0) delta
         from (
              select f.snap_id,
                     s0.startup_time,
                     case when f.con_id <= 1 then f.tsname else f.tsname||'(con#'||f.con_id||')' end tsname,
                     sum(f.phyblkrd + f.phyblkwrt) s
                from dba_hist_filestatxs f,
                     dba_hist_snapshot s0
               where f.dbid = s0.dbid
                 and f.instance_number = s0.instance_number
                 and f.snap_id = s0.snap_id
                 and f.snap_id between :snap_fr and :snap_to
                 and f.instance_number = :inst_no
                 and f.dbid = :dbid
               group by f.snap_id, s0.startup_time, case when f.con_id <= 1 then f.tsname else f.tsname||'(con#'||f.con_id||')' end
              )
       ) v2,
       (
       select snap_id,
              to_char(end_interval_time, 'yyyy-mm-dd hh24:mi:ss') snap_time,
              extract(day    from (end_interval_time - begin_interval_time))*86400 +
              extract(hour   from (end_interval_time - begin_interval_time))*3600 +
              extract(minute from (end_interval_time - begin_interval_time))*60 +
