       ,gets         "Gets"
       ,misses "Misses"
       ,sleeps "Sleeps"
       ,spin_gets "Spin_gets"
  from (
       select * from
              (select  snap_id
              ,latch_name
              ,gets - lag(gets) over (partition by awr_startup_time, latch_name order by snap_id) gets
              ,misses - lag(misses) over (partition by awr_startup_time, latch_name order by snap_id) misses
              ,sleeps - lag(sleeps) over (partition by awr_startup_time, latch_name order by snap_id) sleeps
              ,spin_gets - lag(spin_gets) over (partition by awr_startup_time, latch_name order by snap_id) spin_gets
         from (select t.*, s0.startup_time awr_startup_time from dba_hist_latch t, dba_hist_snapshot s0 where t.dbid = s0.dbid and t.instance_number = s0.instance_number and t.snap_id = s0.snap_id and t.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end)
        where snap_id between :snap_fr and :snap_to
          and instance_number = :inst_no
          and dbid = :dbid
          )
          where sleeps> 0
       ) v1,
       (
       select  snap_id
              ,to_char(end_interval_time,'yyyy-mm-dd hh24:mi:ss') snap_time
              ,(extract(day from (end_interval_time-begin_interval_time))*86400 + extract(hour from (end_interval_time-begin_interval_time))*3600 + extract(minute from (end_interval_time-begin_interval_time))*60 + extract(second from (end_interval_time-begin_interval_time))) interval
         from dba_hist_snapshot
        where snap_id between 1+ :snap_fr and :snap_to
          and instance_number = :inst_no
          and dbid = :dbid
       ) sn
 where v1.snap_id  = sn.snap_id
 order by sn.snap_id,sleeps desc
