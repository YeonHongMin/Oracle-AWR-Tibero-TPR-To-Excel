                               greatest(nvl(e.cum_wait_time - lag(e.cum_wait_time) over (partition by e.dbid, e.instance_number, e.con_id, s0.startup_time, e.eq_type, e.req_reason order by e.snap_id), 0), 0) wait_tm,
                               greatest(nvl(e.total_wait#   - lag(e.total_wait#)   over (partition by e.dbid, e.instance_number, e.con_id, s0.startup_time, e.eq_type, e.req_reason order by e.snap_id), 0), 0) wait_cnt
