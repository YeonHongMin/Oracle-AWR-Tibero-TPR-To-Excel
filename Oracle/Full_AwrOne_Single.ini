    ,decode((flush1+flush10+flush100+flush100+flush1000+flush10000),0,0
        ,flush1000/(flush1+flush10+flush100+flush100+flush1000+flush10000)) "%flush(<1s)"
    ,decode((flush1+flush10+flush100+flush100+flush1000+flush10000),0,0
