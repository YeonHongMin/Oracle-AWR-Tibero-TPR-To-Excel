        sum(decode(event_name, 'direct path write temp', delta_avgt, 0))/1000 "direct path write temp(ms)",
        sum(decode(event_name, 'cell single block physical read', delta_avgt, 0))/1000 "cell single block physical read(ms)",
        sum(decode(event_name, 'cell single block physical read: flash cache', delta_avgt, 0))/1000 "cell single block physical read: flash cache(ms)",
        sum(decode(event_name, 'cell single block physical read: RDMA', delta_avgt, 0))/1000 "cell single block physical read: RDMA(ms)",
        sum(decode(event_name, 'cell single block physical read: pmem cache', delta_avgt, 0))/1000 "cell single block physical read: pmem cache(ms)",
        sum(decode(event_name, 'cell single block physical read: xrmem cache', delta_avgt, 0))/1000 "cell single block physical read: xrmem cache(ms)",
        sum(decode(event_name, 'cell multiblock physical read', delta_avgt, 0))/1000 "cell multiblock physical read(ms)",
        sum(decode(event_name, 'cell list of blocks physical read', delta_avgt, 0))/1000 "cell list of blocks physical read(ms)",
        sum(decode(event_name, 'cell smart table scan', delta_avgt, 0))/1000 "cell smart table scan(ms)",
        sum(decode(event_name, 'cell smart index scan', delta_avgt, 0))/1000 "cell smart index scan(ms)",
        sum(decode(event_name, 'cell interconnect retransmit during physical read', delta_avgt, 0))/1000 "cell interconnect retransmit during physical read(ms)",
        sum(decode(event_name, 'log file parallel write', delta_avgt, 0))/1000 "log file parallel write(ms)",
        sum(decode(event_name, 'db file parallel write', delta_avgt, 0))/1000 "db file parallel write(ms)",
        sum(decode(event_name, 'control file sequential read', delta_avgt, 0))/1000 "control file sequential read(ms)",
        sum(decode(event_name, 'control file parallel write', delta_avgt, 0))/1000 "control file parallel write(ms)",
        sum(decode(event_name, 'log file sequential read', delta_avgt, 0))/1000 "log file sequential read(ms)"
  from (
         select sn.snap_id,
                sn.end_interval_time,
                (extract(day    from (sn.end_interval_time - lag(sn.end_interval_time) over (partition by se.dbid, se.instance_number, se.con_id, sn.startup_time, se.event_name order by se.snap_id)))*86400 +
                 extract(hour   from (sn.end_interval_time - lag(sn.end_interval_time) over (partition by se.dbid, se.instance_number, se.con_id, sn.startup_time, se.event_name order by se.snap_id)))*3600 +
                 extract(minute from (sn.end_interval_time - lag(sn.end_interval_time) over (partition by se.dbid, se.instance_number, se.con_id, sn.startup_time, se.event_name order by se.snap_id)))*60 +
                 extract(second from (sn.end_interval_time - lag(sn.end_interval_time) over (partition by se.dbid, se.instance_number, se.con_id, sn.startup_time, se.event_name order by se.snap_id)))) interval,
                se.event_name,
                greatest(nvl(se.total_waits - lag(se.total_waits) over (partition by se.dbid, se.instance_number, se.con_id, sn.startup_time, se.event_name order by se.snap_id), 0), 0) delta_waits,
                case when nvl(se.total_waits - lag(se.total_waits) over (partition by se.dbid, se.instance_number, se.con_id, sn.startup_time, se.event_name order by se.snap_id), 0) > 0
                      and nvl(se.time_waited_micro - lag(se.time_waited_micro) over (partition by se.dbid, se.instance_number, se.con_id, sn.startup_time, se.event_name order by se.snap_id), 0) >= 0
                     then (se.time_waited_micro - lag(se.time_waited_micro) over (partition by se.dbid, se.instance_number, se.con_id, sn.startup_time, se.event_name order by se.snap_id))
                        / (se.total_waits - lag(se.total_waits) over (partition by se.dbid, se.instance_number, se.con_id, sn.startup_time, se.event_name order by se.snap_id))
                     else 0 end delta_avgt
           from dba_hist_system_event se,
                dba_hist_snapshot sn
          where se.snap_id = sn.snap_id
            and se.instance_number = sn.instance_number
            and se.dbid = sn.dbid
            and se.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
            and se.event_name in ('db file sequential read',
                          'db file scattered read',
                          'db file parallel read',
                          'db file async I/O submit',
                          'direct path read',
                          'direct path write',
                          'direct path read temp',
                          'direct path write temp',
                          'cell single block physical read',
                          'cell single block physical read: flash cache',
                          'cell single block physical read: RDMA',
                          'cell single block physical read: pmem cache',
                          'cell single block physical read: xrmem cache',
                          'cell multiblock physical read',
                          'cell list of blocks physical read',
                          'cell smart table scan',
                          'cell smart index scan',
                          'cell interconnect retransmit during physical read',
                          'log file parallel write',
                          'db file parallel write',
                          'control file sequential read',
                          'control file parallel write',
                          'log file sequential read')
            and sn.snap_id between :snap_fr and :snap_to
            and sn.instance_number = :inst_no
            and sn.dbid = :dbid
       )
where snap_id > :snap_fr
  and interval > 0
group by snap_id, to_char(end_interval_time,'yyyy-mm-dd hh24:mi:ss')
order by snap_id
