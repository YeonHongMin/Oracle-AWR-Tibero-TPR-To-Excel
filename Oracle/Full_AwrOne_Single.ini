        physical_reads   -lag(physical_reads)   over (partition by awr_startup_time, block_size order  by snap_id) physical_reads,
        physical_writes  -lag(physical_writes)  over (partition by awr_startup_time, block_size order  by snap_id) physical_writes,
        free_buffer_wait -lag(free_buffer_wait) over (partition by awr_startup_time, block_size order  by snap_id) free_buffer_wait,
        write_complete_wait -lag(write_complete_wait) over (partition by awr_startup_time, block_size order  by snap_id) write_complete_wait,
        buffer_busy_wait -lag(buffer_busy_wait) over (partition by awr_startup_time, block_size order  by snap_id) buffer_busy_wait
    from (select t.*, s0.startup_time awr_startup_time from dba_hist_buffer_pool_stat t, dba_hist_snapshot s0 where t.dbid = s0.dbid and t.instance_number = s0.instance_number and t.snap_id = s0.snap_id and t.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end)
