                    /max(decode(stat_name, 'gc cr blocks served', delta_val, 0))) * 10
             ) "Avg GC cr blk bld time(ms)",
       decode(max(decode(stat_name, 'gc cr blocks served', delta_val, 0)), 0, 0,
                  (max(decode(stat_name, 'gc cr block send time', delta_val, 0))
