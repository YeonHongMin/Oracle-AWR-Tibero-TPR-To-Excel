       max(decode(rank, 2, decode(v1.wait_class, 'Network', delta_time_waited, 0), 0))       rank2_nw_time,
       max(decode(rank, 2, decode(v1.wait_class, 'Other', delta_time_waited, 0), 0))         rank2_ot_time,
       max(decode(rank, 2, decode(v1.wait_class, 'System I/O', delta_time_waited, 0), 0))    rank2_sysio_time,
       max(decode(rank, 2, decode(v1.wait_class, 'User I/O', delta_time_waited, 0), 0))      rank2_userio_time,
       max(decode(rank, 3, decode(v1.wait_class, 'Administrative',delta_time_waited, 0), 0)) rank3_adm_time,
       max(decode(rank, 3, decode(v1.wait_class, 'Application', delta_time_waited, 0), 0))   rank3_app_time,
