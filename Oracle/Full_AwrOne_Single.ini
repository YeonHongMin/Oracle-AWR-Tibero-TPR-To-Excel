[rac_gctran_raw]
SQL1=rac_gctran_raw_sql,rac_gctran_raw,[1.1],TRUE
FORMAT1=rac_gctran_raw^[1.5:E.5/1.9:E.9]^###,##0
FORMAT2=rac_gctran_raw^[1.6:E.8/1.10:E.12]^##0%
[rac_gctran_raw]
select /* awrsql */
        b.snap_id   "SnapID",
        b.snap_time "Timestamp",
        instance    "fr Inst#",
        case when class in ('data block', 'undo header', 'undo block') then class else 'others' end "class",
        sum(cr_block)+sum(cr_busy) +sum(cr_congested) "cr recv total",
        decode(sum(cr_block)+sum(cr_busy) +sum(cr_congested),0,0,sum(cr_block)    /(sum(cr_block)+sum(cr_busy) +sum(cr_congested))) "cr:%immed",
        decode(sum(cr_block)+sum(cr_busy) +sum(cr_congested),0,0,sum(cr_busy)     /(sum(cr_block)+sum(cr_busy) +sum(cr_congested))) "cr:%busy",
        decode(sum(cr_block)+sum(cr_busy) +sum(cr_congested),0,0,sum(cr_congested)/(sum(cr_block)+sum(cr_busy) +sum(cr_congested))) "cr:%congst",
        sum(current_block)+sum(current_busy)+sum(current_congested) "cur recv total",
        decode(sum(current_block)+sum(current_busy)+sum(current_congested),0,0,
               sum(current_block)/(sum(current_block)+sum(current_busy)+sum(current_congested)))      "cur:%immed",
        decode(sum(current_block)+sum(current_busy)+sum(current_congested),0,0,
               sum(current_busy)/(sum(current_block)+sum(current_busy)+sum(current_congested)))       "cur:%busy",
        decode(sum(current_block)+sum(current_busy)+sum(current_congested),0,0,
               sum(current_congested)/(sum(current_block)+sum(current_busy)+sum(current_congested)))  "cur:%congst"
  from (
        select  snap_id,
                instance,
                class,
                cr_block-lag(cr_block) over (partition by awr_startup_time, instance,class order by instance,class,snap_id) cr_block,
            cr_busy-lag(cr_busy) over (partition by awr_startup_time, instance,class order by instance,class,snap_id) cr_busy,
            cr_congested-lag(cr_congested) over (partition by awr_startup_time, instance,class order by instance,class,snap_id) cr_congested,
                current_block-lag(current_block) over (partition by awr_startup_time, instance,class order by instance,class,snap_id) current_block,
            current_busy-lag(current_busy) over (partition by awr_startup_time, instance,class order by instance,class,snap_id) current_busy,
            current_congested-lag(current_congested) over (partition by awr_startup_time, instance,class order by instance,class,snap_id) current_congested
          from (select t.*, s0.startup_time awr_startup_time from dba_hist_inst_cache_transfer t, dba_hist_snapshot s0 where t.dbid = s0.dbid and t.instance_number = s0.instance_number and t.snap_id = s0.snap_id and t.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end)
         where  snap_id between :snap_fr and :snap_to
           and  instance_number = :inst_no
           and  dbid = :dbid
        ) a,
        ( select snap_id,
                 to_char(end_interval_time, 'yyyy-mm-dd hh24:mi:ss') snap_time
            from dba_hist_snapshot
           where snap_id between 1+ :snap_fr and :snap_to
             and instance_number = :inst_no
             and dbid = :dbid
        ) b
where   a.snap_id=b.snap_id
group by b.snap_id,b.snap_time,instance,case when class in ('data block', 'undo header', 'undo block') then class else 'others' end
order by 3,4,2
