[undo_sql]
select /* awrsql */
       v1.snap_id "SnapID",
       to_char(sn.end_interval_time,'yyyy-mm-dd hh24:mi:ss') "Timestamp",
       sq.executions_delta "Exec",
       decode(nvl(sq.executions_delta,0), 0, to_number(null), sq.elapsed_time_delta/sq.executions_delta/1000000) "Elap/exec(s)",
       decode(nvl(sq.executions_delta,0), 0, to_number(null), sq.cpu_time_delta/sq.executions_delta/1000000) "CPU/exec(s)",
       decode(nvl(sq.executions_delta,0), 0, to_number(null), sq.buffer_gets_delta/sq.executions_delta) "Gets/exec",
       sq.elapsed_time_delta/1000000 "Elapsed(s)",
       sq.cpu_time_delta/1000000 "CPU(s)",
       sq.buffer_gets_delta "Buffer Gets",
       sq.disk_reads_delta "Physical Reads",
       v1.sql_id,
       nvl(sq.module, '-') module,
       nvl(replace(replace(replace(to_char(substr(st.sql_text,1,2500)),chr(9),' '),chr(10),' '),chr(13),' '), 'UNRESOLVED(sql_id:'||v1.sql_id||')') "SQL Text"
  from (select distinct dbid, instance_number, snap_id, maxquerysqlid sql_id
          from dba_hist_undostat
         where snap_id between 1+ :snap_fr and :snap_to
           and instance_number = :inst_no
           and dbid = :dbid
           and con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end
           and maxquerysqlid is not null) v1,
       (select dbid, instance_number, snap_id, sql_id,
               sum(executions_delta) executions_delta,
               sum(elapsed_time_delta) elapsed_time_delta,
               sum(cpu_time_delta) cpu_time_delta,
               sum(buffer_gets_delta) buffer_gets_delta,
               sum(disk_reads_delta) disk_reads_delta,
               max(module) module
          from dba_hist_sqlstat
         where snap_id between 1+ :snap_fr and :snap_to
           and instance_number = :inst_no
           and dbid = :dbid
         group by dbid, instance_number, snap_id, sql_id) sq,
       (select dbid, sql_id, sql_text
          from (select dbid, sql_id, sql_text,
                       row_number() over (partition by dbid, sql_id order by con_id) rn
                  from dba_hist_sqltext
                 where dbid = :dbid)
         where rn = 1) st,
       dba_hist_snapshot sn
 where v1.dbid = sq.dbid(+)
   and v1.instance_number = sq.instance_number(+)
   and v1.snap_id = sq.snap_id(+)
   and v1.sql_id = sq.sql_id(+)
   and v1.dbid = st.dbid(+)
   and v1.sql_id = st.sql_id(+)
   and v1.snap_id = sn.snap_id
   and v1.instance_number = sn.instance_number
   and v1.dbid = sn.dbid
 order by v1.snap_id, v1.sql_id
