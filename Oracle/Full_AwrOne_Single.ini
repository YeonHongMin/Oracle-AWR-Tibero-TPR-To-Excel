[rowcache]
SQL1=rowcache_sql,rowcache,[1.1],TRUE
FORMAT1=rowcache^[1.4:E.5]^##0.0%
FORMAT2=rowcache^[1.6:E.15]^###,##0
[rowcache]
select  /* awrsql */  b.snap_id     "SnapID",
        b.snap_time   "Timestamp",
    parameter     "Dictionary",
    decode(gets,0,0,getmisses/gets) "getMiss/gets%",
    decode(scans,0,0,scanmisses/scans) "scanMiss%",
    gets          "Get",
    getmisses     "getMiss",
    scans         "Scan",
    scanmisses    "scanMiss",
    modifications "Modify",
    flushes       "Flush",
    usage         "Usage",
    dlm_requests  "GES Request",
    dlm_conflicts "GES Conflict",
    dlm_releases  "GES Release"
from    (
    select  snap_id,parameter,
        usage,
        gets-lag(gets) over (partition by awr_startup_time, parameter order by parameter,snap_id) gets,
        getmisses-lag(getmisses) over (partition by awr_startup_time, parameter order by parameter,snap_id) getmisses,
        scans-lag(scans) over (partition by awr_startup_time, parameter order by parameter,snap_id) scans,
        scanmisses-lag(scanmisses) over (partition by awr_startup_time, parameter order by parameter,snap_id) scanmisses,
        modifications-lag(modifications) over (partition by awr_startup_time, parameter order by parameter,snap_id) modifications,
        flushes-lag(flushes) over (partition by awr_startup_time, parameter order by parameter,snap_id) flushes,
        dlm_requests-lag(dlm_requests) over (partition by awr_startup_time, parameter order by parameter,snap_id) dlm_requests,
        dlm_conflicts-lag(dlm_conflicts) over (partition by awr_startup_time, parameter order by parameter,snap_id) dlm_conflicts,
        dlm_releases-lag(dlm_releases) over (partition by awr_startup_time, parameter order by parameter,snap_id) dlm_releases
    from (select t.*, s0.startup_time awr_startup_time from dba_hist_rowcache_summary t, dba_hist_snapshot s0 where t.dbid = s0.dbid and t.instance_number = s0.instance_number and t.snap_id = s0.snap_id and t.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end)
    where snap_id between :snap_fr and :snap_to
          and instance_number = :inst_no
          and dbid = :dbid
    ) a,
          ( select snap_id,
                   to_char(end_interval_time, 'yyyy-mm-dd hh24:mi:ss') snap_time
              from dba_hist_snapshot
             where snap_id between 1+ :snap_fr and :snap_to
               and instance_number = :inst_no
               and dbid = :dbid
          ) b
where   a.snap_id=b.snap_id
  and   a.snap_id > :snap_fr
  and   (a.gets <> 0 or a.getmisses <> 0 or a.scans <> 0 or a.scanmisses <> 0
         or a.modifications <> 0 or a.flushes <> 0 or a.dlm_requests <> 0
         or a.dlm_conflicts <> 0 or a.dlm_releases <> 0)
order by 1, 4 desc, 5 desc
