              ,wtr_slp_count - lag(wtr_slp_count) over (partition by awr_startup_time, parent_name,where_in_code order by parent_name,where_in_code, snap_id) wtr_slp_count
         from (select t.*, s0.startup_time awr_startup_time from dba_hist_latch_misses_summary t, dba_hist_snapshot s0 where t.dbid = s0.dbid and t.instance_number = s0.instance_number and t.snap_id = s0.snap_id and t.con_id = case when to_number(sys_context('USERENV','CON_ID')) <= 1 then 0 else to_number(sys_context('USERENV','CON_ID')) end)
        where snap_id between :snap_fr and :snap_to
