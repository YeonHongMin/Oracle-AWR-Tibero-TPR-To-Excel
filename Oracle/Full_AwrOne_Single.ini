[service_stat]
select /* awrsql */ sn.snap_id "SnapID",
       sn.snap_time "Timestamp",
       sum(case when stat_name='dbtime' then delta else 0 end)/1000000 "DB Time(s)",
       sum(case when stat_name='dbcpu'  then delta else 0 end)/1000000 "DB CPU(s)",
       sum(case when stat_name='dbcpu'  then delta else 0 end)/1000 "DB CPU(ms)",
       sum(case when stat_name='lio'    then delta else 0 end) "Logical Reads",
       sum(case when stat_name='pio'    then delta else 0 end) "Physical Reads"
  from (  select snap_id,
                 service_name,
                 decode(stat_name,'DB time','dbtime','DB CPU','dbcpu','session logical reads','lio','physical reads','pio',stat_name) stat_name,
                 delta
            from ( select snap_id,
                          service_name,
                          stat_name,
                          greatest(nvl(value - lag(value)
                                over ( partition by con_id, awr_startup_time, service_name, stat_name order by snap_id), 0), 0) delta
                     from (select t.*, s0.startup_time awr_startup_time from dba_hist_service_stat t, dba_hist_snapshot s0 where t.dbid = s0.dbid and t.instance_number = s0.instance_number and t.snap_id = s0.snap_id)
                    where snap_id between :snap_fr and :snap_to
                      and instance_number = :inst_no
                      and dbid = :dbid
                      and stat_name in ('DB time','DB CPU','session logical reads','physical reads')
                 )
          ) v1,
          ( select snap_id,
                   to_char(end_interval_time,'yyyy-mm-dd hh24:mi:ss') snap_time
              from dba_hist_snapshot
             where snap_id between 1+ :snap_fr and :snap_to
               and instance_number = :inst_no
               and dbid = :dbid
          ) sn
 where v1.snap_id = sn.snap_id
 group by sn.snap_id, sn.snap_time
 order by sn.snap_id
